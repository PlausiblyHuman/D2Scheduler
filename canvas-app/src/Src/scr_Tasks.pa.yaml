Screens:
  scr_Tasks:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      Fill: =RGBA(246, 247, 249, 1)
      # Nothing ticked this visit means nothing to write back. Without this the
      # Back button would Patch counters onto any row merely opened to look at,
      # including the Harrison demo rows that §6a says never to touch.
      OnVisible: =Set(gblTasksDirty, false)
    Children:
      - recTasksHeader:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(11, 110, 120, 1)
            Height: =92
            Width: =Parent.Width
            X: =0
            Y: =0
      # Back writes the task counters to the Assignment in ONE Patch, per the
      # CLAUDE.md decision: never one write per checkbox. At 295 tasks a pool,
      # per-tick counter writes would each burn a Flow 3 run.
      - icoTasksBack:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.ChevronLeft
            Color: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(0, 0, 0, 1)
            DisabledBorderColor: =RGBA(56, 56, 56, 1)
            DisabledColor: =RGBA(119, 119, 119, 1)
            OnSelect: |
              =If(
                  !IsBlank(gblAssignment) && gblTasksDirty,
                  IfError(
                      Patch(
                          Assignments,
                          gblAssignment,
                          {
                              TasksTotal: CountRows(galTasks.AllItems),
                              TasksComplete: CountRows(Filter(galTasks.AllItems, Complete))
                          }
                      ),
                      Notify(
                          "Counter write failed: " & FirstError.Message,
                          NotificationType.Error
                      )
                  )
              );
              Navigate(Screen1, ScreenTransition.UnCover)
            PaddingBottom: =12
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =12
            Height: =48
            Width: =48
            X: =4
            Y: =22
      - lblTasksTitle:
          Control: Label@2.5.1
          Properties:
            # Block scalar, not a plain one: the ": " inside the string literal
            # would otherwise be read by YAML as a key separator (PA1001).
            Text: |
              ="Sign off: " & gblAssignment.SubPhaseNumber
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =18
            Height: =32
            Width: =Parent.Width - 68
            X: =56
            Y: =14
      - lblTasksSub:
          Control: Label@2.5.1
          Properties:
            Text: =gblAssignment.SubPhaseName
            Color: =RGBA(214, 240, 242, 1)
            Font: =Font.'Open Sans'
            Size: =12
            Height: =24
            Width: =Parent.Width - 68
            X: =56
            Y: =48
      - recProgressBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Width: =Parent.Width
            X: =0
            Y: =92
      - lblTasksProgress:
          Control: Label@2.5.1
          Properties:
            Text: |
              =Text(CountRows(Filter(galTasks.AllItems, Complete)))
               & " of "
               & Text(CountRows(galTasks.AllItems))
               & " tasks done"
            Color: |
              =If(
                  CountRows(galTasks.AllItems) > 0
                      && CountRows(Filter(galTasks.AllItems, Complete)) = CountRows(galTasks.AllItems),
                  RGBA(15, 118, 110, 1),
                  RGBA(107, 114, 128, 1)
              )
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =13
            Height: =44
            Width: =Parent.Width - 32
            X: =16
            Y: =92
      - lblTasksEmpty:
          Control: Label@2.5.1
          Properties:
            Text: ="No tasks on this sub-phase."
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Size: =15
            Align: =Align.Center
            Height: =40
            Width: =Parent.Width
            X: =0
            Y: =184
            Visible: =CountRows(galTasks.AllItems) = 0
      # Delegation, and why the filter is nested rather than a single And:
      #
      #   Assignment.Value declares filterFunctions ["eq"] in the connector
      #   metadata and maps to the OData path Assignment/Title, so the INNER
      #   filter is delegated to SharePoint and only the matching rows come down.
      #   Assignment.Id declares NO filterFunctions, so putting it in the same
      #   predicate risks making the whole thing local -- and a non-delegated
      #   filter here fails SILENTLY by truncating at 500 rows. Tasks is already
      #   at 282 and one real pool is 295.
      #
      #   The OUTER filter on Assignment.Id then runs locally over those few
      #   rows. It is the real key join: Assignment titles are display text and
      #   are not guaranteed unique, and this project has been bitten three
      #   times by joining on a display label. Cheap insurance, no delegation cost.
      - galTasks:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: |
              =Sort(
                  Filter(
                      Filter(Tasks, Assignment.Value = gblAssignment.Title),
                      Assignment.Id = gblAssignment.ID
                  ),
                  Sequence,
                  SortOrder.Ascending
              )
            TemplateSize: =76
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =Parent.Height - 136 - 132
            Width: =Parent.Width
            X: =0
            Y: =136
          Children:
            # 44x44 touch target -- these are tapped with work gloves on.
            - chkTask:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  Text: =""
                  Default: =ThisItem.Complete
                  OnCheck: |
                    =IfError(
                        Patch(
                            Tasks,
                            ThisItem,
                            { Complete: true, CompletedOn: Now() }
                        ),
                        Notify(
                            "Tick failed: " & FirstError.Message,
                            NotificationType.Error
                        )
                    );
                    IfError(
                        Patch(
                            Tasks,
                            ThisItem,
                            {
                                CompletedBy: {
                                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                    Claims: "i:0#.f|membership|" & Lower(gblCurrentUser.userPrincipalName),
                                    DisplayName: gblCurrentUser.displayName,
                                    Email: gblCurrentUser.userPrincipalName
                                }
                            }
                        ),
                        Notify(
                            "CompletedBy failed: " & FirstError.Message,
                            NotificationType.Warning
                        )
                    );
                    Set(gblTasksDirty, true)
                  OnUncheck: |
                    =IfError(
                        Patch(
                            Tasks,
                            ThisItem,
                            { Complete: false, CompletedOn: Blank() }
                        ),
                        Notify(
                            "Untick failed: " & FirstError.Message,
                            NotificationType.Error
                        )
                    );
                    IfError(
                        Patch(Tasks, ThisItem, { CompletedBy: Blank() }),
                        Notify(
                            "CompletedBy clear failed: " & FirstError.Message,
                            NotificationType.Warning
                        )
                    );
                    Set(gblTasksDirty, true)
                  Height: =44
                  Width: =44
                  X: =14
                  Y: =16
            - lblTaskName:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Title
                  Color: =If(ThisItem.Complete, RGBA(107, 114, 128, 1), RGBA(17, 24, 39, 1))
                  Font: =Font.'Open Sans'
                  Size: =15
                  OnSelect: =Select(Parent)
                  PaddingLeft: =0
                  Height: =60
                  Width: =Parent.TemplateWidth - 90
                  X: =70
                  Y: =8
            - recTaskSeparator:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(229, 231, 235, 1)
                  BorderColor: =RGBA(0, 18, 107, 1)
                  OnSelect: =Select(Parent)
                  Height: =1
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =Parent.TemplateHeight - 1

      # ---------------------------------------------------------------- sign-off bar
      # Docked to the bottom so it stays reachable one-handed on a phone.
      - recSignOffBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =132
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - 132
      - lblWorkDateCaption:
          Control: Label@2.5.1
          Properties:
            Text: ="Work date"
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Size: =11
            Height: =20
            Width: =120
            X: =16
            Y: =Parent.Height - 126
      - dpWorkDate:
          Control: Classic/DatePicker@2.6.0
          Properties:
            DefaultDate: =gblToday
            Font: =Font.'Open Sans'
            Size: =13
            Height: =40
            Width: =170
            X: =16
            Y: =Parent.Height - 106
      # Amber while tasks are outstanding, teal when the sub-phase is complete.
      # A partial sign-off is legitimate, so this warns rather than blocks.
      - recSignOffBtn:
          Control: Rectangle@2.3.0
          Properties:
            Fill: |
              =If(
                  CountRows(galTasks.AllItems) > 0
                      && CountRows(Filter(galTasks.AllItems, Complete)) = CountRows(galTasks.AllItems),
                  RGBA(15, 118, 110, 1),
                  RGBA(180, 83, 9, 1)
              )
            OnSelect: =Set(gblConfirmOpen, true)
            Height: =52
            Width: =Parent.Width - 214
            X: =198
            Y: =Parent.Height - 110
      - lblSignOffBtn:
          Control: Label@2.5.1
          Properties:
            Text: |
              =If(
                  CountRows(Filter(galTasks.AllItems, Complete)) = CountRows(galTasks.AllItems),
                  "Sign off",
                  "Sign off " & Text(CountRows(Filter(galTasks.AllItems, Complete)))
                      & "/" & Text(CountRows(galTasks.AllItems))
              )
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =15
            Align: =Align.Center
            OnSelect: =Set(gblConfirmOpen, true)
            Height: =52
            Width: =Parent.Width - 214
            X: =198
            Y: =Parent.Height - 110
      # ---------------------------------------------------------------- confirm overlay
      # Power Fx has no Confirm() function (formula-review finding 3), so the
      # "sign off anyway?" step is a Visible-bound overlay rather than a dialog.
      - recConfirmScrim:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(17, 24, 39, 0.55)
            OnSelect: =Set(gblConfirmOpen, false)
            Height: =Parent.Height
            Width: =Parent.Width
            X: =0
            Y: =0
            Visible: =gblConfirmOpen
      - recConfirmCard:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =230
            Width: =Parent.Width - 48
            X: =24
            Y: =(Parent.Height / 2) - 115
            Visible: =gblConfirmOpen
      - lblConfirmTitle:
          Control: Label@2.5.1
          Properties:
            Text: |
              =If(
                  CountRows(Filter(galTasks.AllItems, !Complete)) > 0,
                  "You have unticked tasks",
                  "Confirm sign-off"
              )
            Color: =RGBA(17, 24, 39, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =17
            Height: =32
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height / 2) - 99
            Visible: =gblConfirmOpen
      - lblConfirmBody:
          Control: Label@2.5.1
          Properties:
            Text: |
              =Text(CountRows(Filter(galTasks.AllItems, Complete)))
               & " of "
               & Text(CountRows(galTasks.AllItems))
               & " tasks ticked. Signing off records your name against this sub-phase for "
               & Text(dpWorkDate.SelectedDate, "ddd mm/dd")
               & "."
            Color: =RGBA(75, 85, 99, 1)
            Font: =Font.'Open Sans'
            Size: =13
            Height: =76
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height / 2) - 63
            Visible: =gblConfirmOpen
      - recConfirmCancel:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(229, 231, 235, 1)
            OnSelect: =Set(gblConfirmOpen, false)
            Height: =48
            Width: =(Parent.Width - 104) / 2
            X: =40
            Y: =(Parent.Height / 2) + 25
            Visible: =gblConfirmOpen
      - lblConfirmCancel:
          Control: Label@2.5.1
          Properties:
            Text: ="Cancel"
            Color: =RGBA(55, 65, 81, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =14
            Align: =Align.Center
            OnSelect: =Set(gblConfirmOpen, false)
            Height: =48
            Width: =(Parent.Width - 104) / 2
            X: =40
            Y: =(Parent.Height / 2) + 25
            Visible: =gblConfirmOpen
      # WorkDate is built from parts rather than a format string. Power Fx Text()
      # only treats "mm" as month when no time part precedes it, and this project
      # already inverted its entire work week once by storing a DateOnly value at
      # midnight UTC. A bare yyyy-MM-dd string is the fixed convention.
      - recConfirmGo:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(15, 118, 110, 1)
            OnSelect: |
              =IfError(
                  Set(
                      gblIntakeResponse,
                      'D2-Sign-offIntake'.Run(
                          gblAssignment.ID,
                          Text(Year(dpWorkDate.SelectedDate))
                              & "-" & Right("0" & Text(Month(dpWorkDate.SelectedDate)), 2)
                              & "-" & Right("0" & Text(Day(dpWorkDate.SelectedDate)), 2),
                          "",
                          CountRows(galTasks.AllItems),
                          CountRows(Filter(galTasks.AllItems, Complete)),
                          gblCurrentUser.userPrincipalName
                      )
                  );
                  Set(gblConfirmOpen, false);
                  Set(gblTasksDirty, false);
                  Refresh(Assignments);
                  Notify("Signed off", NotificationType.Success);
                  Navigate(Screen1, ScreenTransition.UnCover),
                  Notify(
                      "Sign-off failed: " & FirstError.Message,
                      NotificationType.Error
                  )
              )
            Height: =48
            Width: =(Parent.Width - 104) / 2
            X: =Parent.Width - 40 - ((Parent.Width - 104) / 2)
            Y: =(Parent.Height / 2) + 25
            Visible: =gblConfirmOpen
      - lblConfirmGo:
          Control: Label@2.5.1
          Properties:
            Text: ="Sign off"
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =14
            Align: =Align.Center
            OnSelect: =Select(recConfirmGo)
            Height: =48
            Width: =(Parent.Width - 104) / 2
            X: =Parent.Width - 40 - ((Parent.Width - 104) / 2)
            Y: =(Parent.Height / 2) + 25
            Visible: =gblConfirmOpen
