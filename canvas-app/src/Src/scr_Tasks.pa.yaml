Screens:
  scr_Tasks:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      Fill: =RGBA(246, 247, 249, 1)
      # Nothing ticked this visit means nothing to write back. Without this the
      # Back button would Patch counters onto any row merely opened to look at,
      # including the Harrison demo rows that §6a says never to touch.
      OnVisible: =Set(gblTasksDirty, false)
    Children:
      - recTasksHeader:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(11, 110, 120, 1)
            Height: =92
            Width: =Parent.Width
            X: =0
            Y: =0
      # Back writes the task counters to the Assignment in ONE Patch, per the
      # CLAUDE.md decision: never one write per checkbox. At 295 tasks a pool,
      # per-tick counter writes would each burn a Flow 3 run.
      - icoTasksBack:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.ChevronLeft
            Color: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(0, 0, 0, 1)
            DisabledBorderColor: =RGBA(56, 56, 56, 1)
            DisabledColor: =RGBA(119, 119, 119, 1)
            OnSelect: |
              =If(
                  !IsBlank(gblAssignment) && gblTasksDirty,
                  Patch(
                      Assignments,
                      gblAssignment,
                      {
                          TasksTotal: CountRows(galTasks.AllItems),
                          TasksComplete: CountRows(Filter(galTasks.AllItems, Complete))
                      }
                  )
              );
              Navigate(Screen1, ScreenTransition.UnCover)
            PaddingBottom: =12
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =12
            Height: =48
            Width: =48
            X: =4
            Y: =22
      - lblTasksTitle:
          Control: Label@2.5.1
          Properties:
            # Block scalar, not a plain one: the ": " inside the string literal
            # would otherwise be read by YAML as a key separator (PA1001).
            Text: |
              ="Sign off: " & gblAssignment.SubPhaseNumber
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =18
            Height: =32
            Width: =Parent.Width - 68
            X: =56
            Y: =14
      - lblTasksSub:
          Control: Label@2.5.1
          Properties:
            Text: =gblAssignment.SubPhaseName
            Color: =RGBA(214, 240, 242, 1)
            Font: =Font.'Open Sans'
            Size: =12
            Height: =24
            Width: =Parent.Width - 68
            X: =56
            Y: =48
      - recProgressBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Width: =Parent.Width
            X: =0
            Y: =92
      - lblTasksProgress:
          Control: Label@2.5.1
          Properties:
            Text: |
              =Text(CountRows(Filter(galTasks.AllItems, Complete)))
               & " of "
               & Text(CountRows(galTasks.AllItems))
               & " tasks done"
            Color: |
              =If(
                  CountRows(galTasks.AllItems) > 0
                      && CountRows(Filter(galTasks.AllItems, Complete)) = CountRows(galTasks.AllItems),
                  RGBA(15, 118, 110, 1),
                  RGBA(107, 114, 128, 1)
              )
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =13
            Height: =44
            Width: =Parent.Width - 32
            X: =16
            Y: =92
      - lblTasksEmpty:
          Control: Label@2.5.1
          Properties:
            Text: ="No tasks on this sub-phase."
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Size: =15
            Align: =Align.Center
            Height: =40
            Width: =Parent.Width
            X: =0
            Y: =184
            Visible: =CountRows(galTasks.AllItems) = 0
      # Delegation, and why the filter is nested rather than a single And:
      #
      #   Assignment.Value declares filterFunctions ["eq"] in the connector
      #   metadata and maps to the OData path Assignment/Title, so the INNER
      #   filter is delegated to SharePoint and only the matching rows come down.
      #   Assignment.Id declares NO filterFunctions, so putting it in the same
      #   predicate risks making the whole thing local -- and a non-delegated
      #   filter here fails SILENTLY by truncating at 500 rows. Tasks is already
      #   at 282 and one real pool is 295.
      #
      #   The OUTER filter on Assignment.Id then runs locally over those few
      #   rows. It is the real key join: Assignment titles are display text and
      #   are not guaranteed unique, and this project has been bitten three
      #   times by joining on a display label. Cheap insurance, no delegation cost.
      - galTasks:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: |
              =Sort(
                  Filter(
                      Filter(Tasks, Assignment.Value = gblAssignment.Title),
                      Assignment.Id = gblAssignment.ID
                  ),
                  Sequence,
                  SortOrder.Ascending
              )
            TemplateSize: =76
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =Parent.Height - 136
            Width: =Parent.Width
            X: =0
            Y: =136
          Children:
            # 44x44 touch target -- these are tapped with work gloves on.
            - chkTask:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  Text: =""
                  Default: =ThisItem.Complete
                  OnCheck: |
                    =Patch(
                        Tasks,
                        ThisItem,
                        {
                            Complete: true,
                            CompletedBy: {
                                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                Claims: "i:0#.f|membership|" & Lower(gblCurrentUser.userPrincipalName),
                                DisplayName: gblCurrentUser.displayName,
                                Email: gblCurrentUser.userPrincipalName
                            },
                            CompletedOn: Now()
                        }
                    );
                    Set(gblTasksDirty, true)
                  OnUncheck: |
                    =Patch(
                        Tasks,
                        ThisItem,
                        {
                            Complete: false,
                            CompletedBy: Blank(),
                            CompletedOn: Blank()
                        }
                    );
                    Set(gblTasksDirty, true)
                  Height: =44
                  Width: =44
                  X: =14
                  Y: =16
            - lblTaskName:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Title
                  Color: =If(ThisItem.Complete, RGBA(107, 114, 128, 1), RGBA(17, 24, 39, 1))
                  Font: =Font.'Open Sans'
                  Size: =15
                  OnSelect: =Select(Parent)
                  PaddingLeft: =0
                  Height: =60
                  Width: =Parent.TemplateWidth - 90
                  X: =70
                  Y: =8
            - recTaskSeparator:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(229, 231, 235, 1)
                  BorderColor: =RGBA(0, 18, 107, 1)
                  OnSelect: =Select(Parent)
                  Height: =1
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =Parent.TemplateHeight - 1
