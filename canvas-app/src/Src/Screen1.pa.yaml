Screens:
  Screen1:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      Fill: =RGBA(246, 247, 249, 1)
    Children:
      - recHeader:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(11, 110, 120, 1)
            Height: =92
            Width: =Parent.Width
            X: =0
            Y: =0
      - lblHeaderTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="Today's Work"
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =20
            Height: =36
            Width: =Parent.Width - 32
            X: =16
            Y: =16
      - lblHeaderSub:
          Control: Label@2.5.1
          Properties:
            Text: =Text(gblToday, "ddd mm/dd") & If(gblIsProxy, "  -  office view", "  -  " & gblCurrentCrew.Title)
            Color: =RGBA(214, 240, 242, 1)
            Font: =Font.'Open Sans'
            Size: =12
            Height: =24
            Width: =Parent.Width - 32
            X: =16
            Y: =54
      - lblEmpty:
          Control: Label@2.5.1
          Properties:
            Text: ="Nothing scheduled today."
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Size: =15
            Align: =Align.Center
            Height: =40
            Width: =Parent.Width
            X: =0
            Y: =140
            Visible: =CountRows(galToday.AllItems) = 0
      - galToday:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: |
              =Filter(
                  Assignments,
                  ScheduledStart <= gblToday,
                  ScheduledFinish >= gblToday,
                  NotApplicable = false
              )
            TemplateSize: =96
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =Parent.Height - 92
            Width: =Parent.Width
            X: =0
            Y: =92
          Children:
            - lblRowTitle:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.SubPhaseNumber & "  " & ThisItem.SubPhaseName
                  Color: =RGBA(17, 24, 39, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Size: =15
                  OnSelect: =Select(Parent)
                  PaddingLeft: =0
                  Height: =28
                  Width: =Parent.TemplateWidth - 80
                  X: =16
                  Y: =12
            - lblRowJob:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Job.Value
                  Color: =RGBA(75, 85, 99, 1)
                  Font: =Font.'Open Sans'
                  Size: =12
                  OnSelect: =Select(Parent)
                  PaddingLeft: =0
                  Height: =22
                  Width: =Parent.TemplateWidth - 80
                  X: =16
                  Y: =40
            - lblRowMeta:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =LookUp(Crews, CrewID = ThisItem.Crew, Title)
                     & "   "
                     & Text(ThisItem.TasksComplete) & "/" & Text(ThisItem.TasksTotal) & " tasks"
                     & If(ThisItem.InstallerSignOff, "   SIGNED OFF", "")
                  Color: =If(ThisItem.InstallerSignOff, RGBA(15, 118, 110, 1), RGBA(107, 114, 128, 1))
                  Font: =Font.'Open Sans'
                  Size: =12
                  OnSelect: =Select(Parent)
                  PaddingLeft: =0
                  Height: =22
                  Width: =Parent.TemplateWidth - 80
                  X: =16
                  Y: =62
            - icoRowNext:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =Icon.ChevronRight
                  Color: =RGBA(166, 166, 166, 1)
                  BorderColor: =RGBA(0, 0, 0, 1)
                  DisabledBorderColor: =RGBA(56, 56, 56, 1)
                  DisabledColor: =RGBA(119, 119, 119, 1)
                  OnSelect: =Select(Parent)
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Height: =50
                  Width: =50
                  X: =Parent.TemplateWidth - Self.Width - 12
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - recRowSeparator:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(229, 231, 235, 1)
                  BorderColor: =RGBA(0, 18, 107, 1)
                  OnSelect: =Select(Parent)
                  Height: =1
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =Parent.TemplateHeight - 1
