Screens:
  Screen1:
    Properties:
      LoadingSpinnerColor: =RGBA(11, 89, 75, 1)
      Fill: =RGBA(246, 247, 249, 1)
    Children:
      - recHeader:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(8, 37, 68, 1)
            Height: =92
            Width: =Parent.Width
            X: =0
            Y: =0
      - lblHeaderTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="Today's Work"
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =20
            Height: =36
            Width: =Parent.Width - 32
            X: =16
            Y: =16
      - lblHeaderSub:
          Control: Label@2.5.1
          Properties:
            Text: |
              =Text(gblToday, "ddd mm/dd")
               & If(
                   gblIsProxy,
                   "  -  office view" & If(IsBlank(gblCrewFilter), "  -  all crews",
                       "  -  " & Coalesce(LookUp(Crews, CrewID = gblCrewFilter, Title), gblCrewFilter)),
                   "  -  " & gblCurrentCrew.Title
               )
            Color: =RGBA(199, 211, 224, 1)
            Font: =Font.'Open Sans'
            Size: =12
            Height: =24
            Width: =Parent.Width - 32
            X: =16
            Y: =54
      - lblEmpty:
          Control: Label@2.5.1
          Properties:
            Text: ="Nothing scheduled today."
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Size: =15
            Align: =Align.Center
            Height: =40
            Width: =Parent.Width
            X: =0
            Y: =160 + If(gblIsProxy, 52, 0)
            Visible: =CountRows(galToday.AllItems) = 0
      # ---------------------------------------------------------------- crew filter
      # PM-proxy path. The four Unlimited subcontractor crews (george, armondo,
      # stl, brothers) have no M365 seat BY DESIGN and can never sign off for
      # themselves, so somebody in the office always signs on their behalf. That
      # makes this mandatory, not a convenience.
      #
      # Only shown to proxies. A crew lead is pinned to their own crew by
      # App.OnStart and cannot switch, so they can never sign off as another crew.
      - recCrewBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(237, 241, 246, 1)
            Height: =52
            Width: =Parent.Width
            X: =0
            Y: =92
            Visible: =gblIsProxy
      - recCrewPick:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(8, 37, 68, 1)
            BorderThickness: =1
            OnSelect: =Set(gblCrewPickerOpen, true)
            Height: =38
            Width: =Parent.Width - 32
            X: =16
            Y: =99
            Visible: =gblIsProxy
      - lblCrewPick:
          Control: Label@2.5.1
          Properties:
            Text: |
              ="Showing:  "
               & If(
                   IsBlank(gblCrewFilter),
                   "All crews",
                   Coalesce(LookUp(Crews, CrewID = gblCrewFilter, Title), gblCrewFilter)
               )
               & "      (tap to change)"
            Color: =RGBA(8, 37, 68, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =12
            OnSelect: =Select(recCrewPick)
            PaddingLeft: =12
            Height: =38
            Width: =Parent.Width - 32
            X: =16
            Y: =99
            Visible: =gblIsProxy
      # galToday is declared BEFORE the picker overlay on purpose. Declaration
      # order is z-order in a .pa.yaml screen and later paints on top, so with
      # the gallery last it rendered straight over the scrim and the picker
      # card. Every overlay control must stay below this line.
      - galToday:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: |
              =If(
                  IsBlank(gblCrewFilter),
                  Filter(
                      Assignments,
                      ScheduledStart <= gblToday,
                      ScheduledFinish >= gblToday,
                      NotApplicable = false
                  ),
                  Filter(
                      Assignments,
                      ScheduledStart <= gblToday,
                      ScheduledFinish >= gblToday,
                      NotApplicable = false,
                      Crew = gblCrewFilter
                  )
              )
            OnSelect: |
              =Set(gblAssignment, galToday.Selected);
              Navigate(scr_Tasks, ScreenTransition.Cover)
            TemplateSize: =96
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =Parent.Height - 92 - If(gblIsProxy, 52, 0)
            Width: =Parent.Width
            X: =0
            Y: =92 + If(gblIsProxy, 52, 0)
          Children:
            - lblRowTitle:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.SubPhaseNumber & "  " & ThisItem.SubPhaseName
                  Color: =RGBA(17, 24, 39, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Size: =15
                  OnSelect: =Select(Parent)
                  PaddingLeft: =0
                  Height: =28
                  Width: =Parent.TemplateWidth - 80
                  X: =16
                  Y: =12
            - lblRowJob:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Job.Value
                  Color: =RGBA(75, 85, 99, 1)
                  Font: =Font.'Open Sans'
                  Size: =12
                  OnSelect: =Select(Parent)
                  PaddingLeft: =0
                  Height: =22
                  Width: =Parent.TemplateWidth - 80
                  X: =16
                  Y: =40
            - lblRowMeta:
                Control: Label@2.5.1
                Properties:
                  Text: |
                    =Coalesce(LookUp(Crews, CrewID = ThisItem.Crew, Title), ThisItem.Crew, "Unassigned")
                     & "   "
                     & Text(Coalesce(ThisItem.TasksComplete, 0)) & "/"
                     & Text(Coalesce(ThisItem.TasksTotal, 0)) & " tasks"
                     & If(ThisItem.InstallerSignOff, "   SIGNED OFF", "")
                  Color: =If(ThisItem.InstallerSignOff, RGBA(11, 89, 75, 1), RGBA(107, 114, 128, 1))
                  Font: =Font.'Open Sans'
                  Size: =12
                  OnSelect: =Select(Parent)
                  PaddingLeft: =0
                  Height: =22
                  Width: =Parent.TemplateWidth - 80
                  X: =16
                  Y: =62
            - icoRowNext:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =Icon.ChevronRight
                  Color: =RGBA(166, 166, 166, 1)
                  BorderColor: =RGBA(0, 0, 0, 1)
                  DisabledBorderColor: =RGBA(56, 56, 56, 1)
                  DisabledColor: =RGBA(119, 119, 119, 1)
                  OnSelect: =Select(Parent)
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Height: =50
                  Width: =50
                  X: =Parent.TemplateWidth - Self.Width - 12
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - recRowSeparator:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(229, 231, 235, 1)
                  BorderColor: =RGBA(0, 18, 107, 1)
                  OnSelect: =Select(Parent)
                  Height: =1
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =Parent.TemplateHeight - 1

      # Picker overlay, same Visible-bound pattern as the sign-off confirmation.
      - recCrewScrim:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(17, 24, 39, 0.55)
            OnSelect: =Set(gblCrewPickerOpen, false)
            Height: =Parent.Height
            Width: =Parent.Width
            X: =0
            Y: =0
            Visible: =gblCrewPickerOpen
      - recCrewCard:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Min(Parent.Height - 120, 120 + (CountRows(galCrewList.AllItems) * 52))
            Width: =Parent.Width - 48
            X: =24
            Y: =60
            Visible: =gblCrewPickerOpen
      - lblCrewCardTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="Whose work do you want to see?"
            Color: =RGBA(17, 24, 39, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =16
            Height: =32
            Width: =Parent.Width - 80
            X: =40
            Y: =76
            Visible: =gblCrewPickerOpen
      - recCrewAll:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =If(IsBlank(gblCrewFilter), RGBA(8, 37, 68, 1), RGBA(243, 244, 246, 1))
            OnSelect: |
              =Set(gblCrewFilter, "");
              Set(gblCrewPickerOpen, false)
            Height: =44
            Width: =Parent.Width - 80
            X: =40
            Y: =116
            Visible: =gblCrewPickerOpen
      - lblCrewAll:
          Control: Label@2.5.1
          Properties:
            Text: ="All crews"
            Color: =If(IsBlank(gblCrewFilter), RGBA(255, 255, 255, 1), RGBA(17, 24, 39, 1))
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =14
            OnSelect: =Select(recCrewAll)
            PaddingLeft: =12
            Height: =44
            Width: =Parent.Width - 80
            X: =40
            Y: =116
            Visible: =gblCrewPickerOpen
      # Only crews that actually have work today, so the office is not scrolling
      # past 14 crews to find the 3 that matter.
      - galCrewList:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: |
              =Distinct(
                  Filter(
                      Assignments,
                      ScheduledStart <= gblToday,
                      ScheduledFinish >= gblToday,
                      NotApplicable = false
                  ),
                  Crew
              )
            TemplateSize: =52
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =Min(Parent.Height - 300, CountRows(galCrewList.AllItems) * 52)
            Width: =Parent.Width - 80
            X: =40
            Y: =172
            Visible: =gblCrewPickerOpen
          Children:
            - recCrewRow:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =If(gblCrewFilter = ThisItem.Value, RGBA(8, 37, 68, 1), RGBA(243, 244, 246, 1))
                  OnSelect: |
                    =Set(gblCrewFilter, ThisItem.Value);
                    Set(gblCrewPickerOpen, false)
                  Height: =44
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =4
            - lblCrewRow:
                Control: Label@2.5.1
                Properties:
                  Text: =Coalesce(LookUp(Crews, CrewID = ThisItem.Value, Title), ThisItem.Value)
                  Color: =If(gblCrewFilter = ThisItem.Value, RGBA(255, 255, 255, 1), RGBA(17, 24, 39, 1))
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  OnSelect: =Select(recCrewRow)
                  PaddingLeft: =12
                  Height: =44
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =4
