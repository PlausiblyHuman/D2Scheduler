Screens:
  scr_Tasks:
    Properties:
      Fill: =RGBA(246, 247, 249, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: =Set(gblTasksDirty, false)
    Children:
      - recTasksHeader:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(11, 110, 120, 1)
            Height: =92
            Width: =Parent.Width
      - lblTasksBack:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(214, 240, 242, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =34
            OnSelect: |
              =IfError(
                  If(
                      !IsBlank(gblAssignment) && gblTasksDirty,
                      Patch(
                          Assignments,
                          gblAssignment,
                          {
                              TasksTotal: CountRows(galTasks.AllItems),
                              TasksComplete: CountRows(Filter(galTasks.AllItems, Complete = true))
                          }
                      )
                  ),
                  Notify(
                      "Counter write failed: " & FirstError.Message,
                      NotificationType.Error
                  )
              );
              Navigate(Screen1, ScreenTransition.UnCover)
            Text: ="<<<  Back"
            Width: =110
            X: =14
            Y: =10
      - lblTasksTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =18
            Text: |
              ="Sign off: " & gblAssignment.SubPhaseNumber
            Width: =Parent.Width - 32
            X: =16
            Y: =42
      - lblTasksSub:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(214, 240, 242, 1)
            Font: =Font.'Open Sans'
            Height: =22
            Size: =12
            Text: =gblAssignment.SubPhaseName
            Width: =Parent.Width - 32
            X: =16
            Y: =70
      - recProgressBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            Width: =Parent.Width
            Y: =92
      - lblTasksProgress:
          Control: Label@2.5.1
          Properties:
            Color: |
              =If(
                  CountRows(galTasks.AllItems) > 0
                      && CountRows(Filter(galTasks.AllItems, Complete = true)) = CountRows(galTasks.AllItems),
                  RGBA(15, 118, 110, 1),
                  RGBA(107, 114, 128, 1)
              )
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =44
            Text: |
              =Text(CountRows(Filter(galTasks.AllItems, Complete = true)))
               & " of "
               & Text(CountRows(galTasks.AllItems))
               & " tasks done"
            Width: =Parent.Width - 32
            X: =16
            Y: =92
      - lblTasksEmpty:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Size: =15
            Text: ="No tasks on this sub-phase."
            Visible: =CountRows(galTasks.AllItems) = 0
            Width: =Parent.Width
            Y: =184
      - galTasks:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =Parent.Height - 136 - 132
            Items: |
              =Sort(
                  Filter(
                      Filter(Tasks, Assignment.Value = gblAssignment.Title),
                      Assignment.Id = gblAssignment.ID
                  ),
                  Sequence,
                  SortOrder.Ascending
              )
            OnSelect: |
              =IfError(
                  Patch(
                      Tasks,
                      ThisItem,
                      {
                          Complete: !ThisItem.Complete,
                          CompletedOn: If(!ThisItem.Complete, Now(), Blank())
                      }
                  ),
                  Notify(
                      "Tick failed: " & FirstError.Message,
                      NotificationType.Error
                  )
              );
              Set(gblTasksDirty, true)
            TemplateSize: =76
            Width: =Parent.Width
            Y: =136
          Children:
            - recTaskBox:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =If(ThisItem.Complete, RGBA(15, 118, 110, 1), RGBA(156, 163, 175, 1))
                  BorderThickness: =2
                  Fill: =If(ThisItem.Complete, RGBA(15, 118, 110, 1), RGBA(255, 255, 255, 1))
                  Height: =30
                  OnSelect: =Select(Parent)
                  Width: =30
                  X: =20
                  Y: =23
            - icoTaskCheck:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(56, 56, 56, 1)
                  DisabledColor: =RGBA(119, 119, 119, 1)
                  Height: =30
                  Icon: =Icon.Check
                  OnSelect: =Select(Parent)
                  PaddingBottom: =6
                  PaddingLeft: =6
                  PaddingRight: =6
                  PaddingTop: =6
                  Visible: =ThisItem.Complete
                  Width: =30
                  X: =20
                  Y: =23
            - lblTaskName:
                Control: Label@2.5.1
                Properties:
                  Color: =If(ThisItem.Complete, RGBA(107, 114, 128, 1), RGBA(17, 24, 39, 1))
                  Font: =Font.'Open Sans'
                  Height: =60
                  OnSelect: =Select(Parent)
                  PaddingLeft: =0
                  Size: =15
                  Text: =ThisItem.Title
                  Width: =Parent.TemplateWidth - 90
                  X: =70
                  Y: =8
            - recTaskSeparator:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(229, 231, 235, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - 1
      - recSignOffBar:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =132
            Width: =Parent.Width
            Y: =Parent.Height - 132
      - lblWorkDateCaption:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Height: =20
            Size: =11
            Text: ="Work date"
            Width: =120
            X: =16
            Y: =Parent.Height - 126
      - dpWorkDate:
          Control: Classic/DatePicker@2.6.0
          Properties:
            DefaultDate: =gblToday
            Font: =Font.'Open Sans'
            Size: =13
            Width: =170
            X: =16
            Y: =Parent.Height - 106
      - recSignOffBtn:
          Control: Rectangle@2.3.0
          Properties:
            Fill: |
              =If(
                  CountRows(galTasks.AllItems) > 0
                      && CountRows(Filter(galTasks.AllItems, Complete = true)) = CountRows(galTasks.AllItems),
                  RGBA(15, 118, 110, 1),
                  RGBA(180, 83, 9, 1)
              )
            Height: =52
            OnSelect: =Set(gblConfirmOpen, true)
            Width: =Parent.Width - 214
            X: =198
            Y: =Parent.Height - 110
      - lblSignOffBtn:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =52
            OnSelect: =Set(gblConfirmOpen, true)
            Size: =15
            Text: |
              =If(
                  CountRows(Filter(galTasks.AllItems, Complete = true)) = CountRows(galTasks.AllItems),
                  "Sign off",
                  "Sign off " & Text(CountRows(Filter(galTasks.AllItems, Complete = true)))
                      & "/" & Text(CountRows(galTasks.AllItems))
              )
            Width: =Parent.Width - 214
            X: =198
            Y: =Parent.Height - 110
      - recConfirmScrim:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(17, 24, 39, 0.55)
            Height: =Parent.Height
            OnSelect: =Set(gblConfirmOpen, false)
            Visible: =gblConfirmOpen
            Width: =Parent.Width
      - recConfirmCard:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =230
            Visible: =gblConfirmOpen
            Width: =Parent.Width - 48
            X: =24
            Y: =(Parent.Height / 2) - 115
      - lblConfirmTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(17, 24, 39, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =17
            Text: |
              =If(
                  CountRows(Filter(galTasks.AllItems, Complete = false)) > 0,
                  "You have unticked tasks",
                  "Confirm sign-off"
              )
            Visible: =gblConfirmOpen
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height / 2) - 99
      - lblConfirmBody:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(75, 85, 99, 1)
            Font: =Font.'Open Sans'
            Height: =76
            Text: |
              =Text(CountRows(Filter(galTasks.AllItems, Complete = true)))
               & " of "
               & Text(CountRows(galTasks.AllItems))
               & " tasks ticked. Signing off records your name against this sub-phase for "
               & Text(dpWorkDate.SelectedDate, "ddd mm/dd")
               & "."
            Visible: =gblConfirmOpen
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height / 2) - 63
      - recConfirmCancel:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(229, 231, 235, 1)
            Height: =48
            OnSelect: =Set(gblConfirmOpen, false)
            Visible: =gblConfirmOpen
            Width: =(Parent.Width - 104) / 2
            X: =40
            Y: =(Parent.Height / 2) + 25
      - lblConfirmCancel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(55, 65, 81, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =48
            OnSelect: =Set(gblConfirmOpen, false)
            Size: =14
            Text: ="Cancel"
            Visible: =gblConfirmOpen
            Width: =(Parent.Width - 104) / 2
            X: =40
            Y: =(Parent.Height / 2) + 25
      - recConfirmGo:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(15, 118, 110, 1)
            Height: =48
            OnSelect: |
              =IfError(
                  Set(
                      gblIntakeResponse,
                      'D2-Sign-offIntake'.Run(
                          gblAssignment.ID,
                          Text(Year(dpWorkDate.SelectedDate))
                              & "-" & Right("0" & Text(Month(dpWorkDate.SelectedDate)), 2)
                              & "-" & Right("0" & Text(Day(dpWorkDate.SelectedDate)), 2),
                          "",
                          CountRows(galTasks.AllItems),
                          CountRows(Filter(galTasks.AllItems, Complete = true)),
                          gblCurrentUser.userPrincipalName
                      )
                  );
                  Set(gblConfirmOpen, false);
                  Set(gblTasksDirty, false);
                  Refresh(Assignments);
                  Notify("Signed off", NotificationType.Success);
                  Navigate(Screen1, ScreenTransition.UnCover),
                  Notify(
                      "Sign-off failed: " & FirstError.Message,
                      NotificationType.Error
                  )
              )
            Visible: =gblConfirmOpen
            Width: =(Parent.Width - 104) / 2
            X: =Parent.Width - 40 - ((Parent.Width - 104) / 2)
            Y: =(Parent.Height / 2) + 25
      - lblConfirmGo:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =48
            OnSelect: =Select(recConfirmGo)
            Size: =14
            Text: ="Sign off"
            Visible: =gblConfirmOpen
            Width: =(Parent.Width - 104) / 2
            X: =Parent.Width - 40 - ((Parent.Width - 104) / 2)
            Y: =(Parent.Height / 2) + 25
