App:
  Properties:
    OnStart: |
      =Set(gblCurrentUser, Office365Users.MyProfileV2());
      Set(gblCurrentCrew, LookUp(Crews, LeadEmail = gblCurrentUser.userPrincipalName));
      Set(gblIsProxy, IsBlank(gblCurrentCrew));
      Set(gblToday, Today())
    Theme: =PowerAppsTheme
