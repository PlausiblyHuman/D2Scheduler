      <b>16 and a half minutes</b>, and stalled for six of them: allow <b>10–20 minutes</b>.
      The request sits at <span class="mono">Building</span> the whole time
      and looks stuck, but is not. Use <b>Refresh</b> once it finishes to pull the pool in here.
    </div>
    <div class="fld"><label>Job number</label><input id="ncJobNo" value="${esc(nextJobNo())}"></div>
    <div class="fld"><label>Pool / job name</label><input id="ncName" placeholder="e.g. Reyes Residence"></div>
    <div class="fld"><label>Street address</label><input id="ncAddr" placeholder="Street"></div>
    <div class="row">
      <div class="fld"><label>City</label><input id="ncCity" placeholder="City"></div>
      <div class="fld"><label>Start date</label><input type="date" id="ncStart" value="${nextWork(todayStr())}"></div>
    </div>
    <div class="fld"><label><input type="checkbox" id="ncAssignCrews" checked> Assign default crews</label>
      <div class="hint" style="padding:4px 0 0">Checked pulls each sub-phase's default crew from the
      template (rule 1 is checked nightly by D2 - Crew Trade Check either way, never enforced at
      creation). Unchecked leaves all 46 sub-phases <span class="mono">unassigned</span> for a PM to
      allocate by hand.</div></div>`;
  document.getElementById('dFoot').innerHTML=
    `<button class="btn p" id="ncSubmit" onclick="confirmNewPoolRequest()">Queue request</button>
     <button class="btn" onclick="closeDrawer()">Cancel</button>`;
  document.getElementById('drawer').classList.add('open');
}
/* Validates, then queues -- never writes anything and never builds a section.
   Save (openSavePreview / buildPendingCreates, further below) is what turns a
   queued request into a real New Pool Requests row, via sharepoint/apply-
   planner-changes.js, which ALSO re-checks the job number against live Jobs
   before creating anything -- the check here is a local sanity check only,
   never the uniqueness authority. */
function confirmNewPoolRequest(){
  const jobno=document.getElementById('ncJobNo').value.trim();
  const name=document.getElementById('ncName').value.trim();
  const addr=document.getElementById('ncAddr').value.trim();
  const city=document.getElementById('ncCity').value.trim();
  const start=document.getElementById('ncStart').value;
  const assignDefaultCrews=document.getElementById('ncAssignCrews').checked;
  if(!jobno||!name||!start){alert('Job number, pool name and start date are all required.');return;}
  S.pendingCreates=S.pendingCreates||[];
  if(S.jobs.some(j=>String(j.jobno)===jobno)||S.pendingCreates.some(c=>c.jobno===jobno)){
    alert(jobno+' is already in use here — pick a different job number.');return;}
  S.pendingCreates.push({id:'pc'+Math.random().toString(36).slice(2,8),
    jobno,name,addr,city,start,assignDefaultCrews,queuedAt:new Date().toISOString(),requestedAt:null});
  closeDrawer();
  TAB='jobs';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='jobs'));
  save();render();
  alert('Queued: '+jobno+' · '+name+'.\n\nPress Save to raise this in SharePoint\'s New Pool Requests list.\n\n'+
    'D2 - New Pool took 16 and a half minutes when last measured, stalling for six of them — allow 10–20 minutes. The request sits at '+
    '"Building" the whole time and looks stuck, but is not. Use Refresh once it finishes to pull '+
    'the finished pool in here.');
}
function cancelPendingCreate(id){
  S.pendingCreates=(S.pendingCreates||[]).filter(c=>c.id!==id);
  save();render();
}
/* Two very different actions behind one column, so the copy has to say which.
   A pool with a baseline exists in SharePoint: this removes it from this screen
   and the next Refresh brings it straight back, so calling it "delete" invited a
   PM to think the pool itself was gone. A pool with no baseline has never been
   saved anywhere, so this really is the only copy and really is unrecoverable. */
function delJob(id){
  const j=S.jobs.find(x=>x.id===id); if(!j)return;
  const nl='\n\n';
  const msg=poolHasBaseline(j)
    ? 'Remove '+j.name+' from this screen?'+nl
      +'It stays in SharePoint and will come back the next time you press Refresh. '
      +'To remove a pool for real, raise a Delete Pool Request on the SharePoint site.'
    : 'Delete '+j.name+'?'+nl
      +'This pool has never been saved to SharePoint, so this is the only copy of it '
      +'and it cannot be recovered.';
  if(!confirm(msg))return;
  S.jobs=S.jobs.filter(x=>x.id!==id);render();
}

/* ---- activating a pool: Planned -> Active ---------------------------------
   Nothing dispatches, alerts or reaches the group calendar until a pool is
   Active, which is why this is a deliberate act with its own confirmation
   rather than an inline status dropdown.
   The conflict count is on the dialog because D2 - New Pool assigns each
   sub-phase its template default crew with no awareness of what that crew is
   already booked on, so a freshly generated pool routinely arrives
   double-booked against live work. The planner knows that and SharePoint does
   not. Activating one unexamined is how those bookings reach a crew.

   NAMED "Activate", NOT "Commit": the Status column beside the button reads
   Planned / Active / On Hold, so the verb and the state it produces are the
   same word. "Commit" was developer vocabulary and meant nothing to a PM. */
function activatePool(jobId){
  const j=S.jobs.find(x=>x.id===jobId); if(!j)return;
  /* Split by level. conflicts() returns hard errors AND advisory warnings, and
     lumping them made this dialog announce "13 unresolved conflicts" on a pool
     whose only findings were unassigned pseudo-trade rows and sign-offs nobody
     can give yet, because the crew leads have no accounts. That reads as alarming
     and is not what this dialog is for: it exists because D2 - New Pool assigns
     template default crews blind, so a fresh pool routinely arrives genuinely
     double-booked. Errors are listed; warnings get a single honest line. */
  const mineAll=conflicts().filter(c=>(c.jobs||[]).includes(j.jobno));
  const mine=mineAll.filter(c=>c.lvl==='err');
  const warn=mineAll.length-mine.length;
  document.getElementById('dTitle').textContent='Activate '+(j.jobno||j.name);
  document.getElementById('dBody').innerHTML=
    `<div class="hint" style="padding:0 0 11px">
       This moves <strong>${esc(j.jobno)} ${esc(j.name)}</strong> from Planned to Active.
       From then on it appears in the daily dispatch and the summary emails, its sub-phases
       are written to the shared calendar, and conflict alerts for it go to its project manager.
     </div>`
    +(mine.length
      ? `<div class="fld"><label style="color:#a84a18">${mine.length} scheduling problem${mine.length===1?'':'s'} on this pool</label>
           <div class="hint" style="padding:0 0 6px">These do not block it, but they go live with the pool.</div>
           <table><tbody>${mine.slice(0,12).map(c=>`<tr><td class="small">${c.msg}</td></tr>`).join('')}
           ${mine.length>12?`<tr><td class="small muted">and ${mine.length-12} more — see Schedule Check</td></tr>`:''}</tbody></table></div>`
      : `<div class="fld"><label>No scheduling problems on this pool</label></div>`)
    +(warn?`<div class="hint" style="padding:8px 0 0">${warn} advisory warning${warn===1?'':'s'} as well
        (work with no crew allocated, or finished work not yet signed off). Those are listed under
        Schedule Check on the Job Board.</div>`:'');
  document.getElementById('dFoot').innerHTML=
    `<button class="btn p" onclick="doActivatePool('${jobId}')">Activate pool</button>
     <button class="btn" onclick="closeDrawer()">Cancel</button>`;
  document.getElementById('drawer').classList.add('open');
}

async function doActivatePool(jobId){
  const j=S.jobs.find(x=>x.id===jobId); if(!j)return;
  document.getElementById('dFoot').innerHTML='<span class="hint">Activating…</span>';
  try{
    const tok=await graphToken(), G=window.D2GraphWriteback;
    const siteResp=await fetch('https://graph.microsoft.com/v1.0/sites/'
      +D2_GRAPH.siteHost+':'+D2_GRAPH.sitePath,{headers:{Authorization:'Bearer '+tok}});
    if(!siteResp.ok) throw new Error('Could not reach the SharePoint site ('+siteResp.status+').');
    const siteId=(await siteResp.json()).id, U=G.urls(siteId);
    const rows=await graphPageAll(U.items(D2_GRAPH.lists.jobs)+'?$expand=fields&$top=500',tok);
    const row=rows.find(r=>String(r.fields.JobNumber)===String(j.jobno));
    if(!row) throw new Error('That pool is not in SharePoint yet. Refresh and try again.');
    /* Compare-before-write for this one field: re-read Status immediately
       before changing it, so two people activating at once cannot both think
       they did it, and so a pool already put On Hold is not quietly reactivated. */
    if(row.fields.Status!=='Planned')
      throw new Error('This pool is already '+row.fields.Status+' in SharePoint. Nothing was changed.');
    const r=await fetch(U.fields(D2_GRAPH.lists.jobs,row.fields.id),
      {method:'PATCH',headers:G.headers(tok),body:JSON.stringify(G.statusBody('Active'))});
    if(!r.ok) throw new Error('SharePoint refused the change (HTTP '+r.status+').');
    closeDrawer();
    await loadFromD2ViaGraph(true);
  }catch(e){
    document.getElementById('dBody').innerHTML=`<div class="hint" style="color:#a84a18">${esc(e.message)}</div>`;
    document.getElementById('dFoot').innerHTML='<button class="btn" onclick="closeDrawer()">Close</button>';
  }
}
function setCrew(id,k,v){const c=crew(id);
  if(k==='members')c.members=v.split(',').map(x=>x.trim()).filter(Boolean);
  else if(k==='size')c.size=(v===''||v==null)?null:Math.max(1,+v||1);else c[k]=v;save();render();}
function toggleSkill(id,sk){const c=crew(id);c.skills=c.skills.includes(sk)?c.skills.filter(x=>x!==sk):[...c.skills,sk];save();render();}
function addCrew(){S.crews.push({id:'c'+Math.random().toString(36).slice(2,7),name:'New Crew',members:[],size:1,skills:[]});render();}
function delCrew(id){if(!confirm('Delete this crew? Its assignments clear.'))return;
  S.crews=S.crews.filter(c=>c.id!==id);
  S.jobs.forEach(j=>{
    let hit=false;
    allSecs(j).forEach(({s})=>{if(s.crewId===id){s.crewId=null;s.locked=false;hit=true;}});
    if(hit)touch(j);
  });
  render();}
function setGrp(gi,k,v){S.template[gi][k]=v;save();}
function setSec(gi,si,k,v){S.template[gi].sections[si][k]= k==='days'?Math.max(1,+v||1):(k==='skill'?(v||null):v);save();}
function moveSec(gi,si,d){const a=S.template[gi].sections,n=si+d;if(n<0||n>=a.length)return;a.splice(n,0,a.splice(si,1)[0]);render();}
function delSec(gi,si){S.template[gi].sections.splice(si,1);render();}
function delGrp(gi){if(!confirm('Delete this phase and all its sub-phases from the template?'))return;S.template.splice(gi,1);render();}
function addSection(gi){const g=S.template[gi];
  g.sections.push({id:'s'+Math.random().toString(36).slice(2,7),num:g.num+'.'+(g.sections.length+1),name:'New Sub-Phase',skill:null,days:2,tasks:[]});render();}
function addPhase(){S.template.push({id:'g'+Math.random().toString(36).slice(2,7),num:String(S.template.length),name:'New Phase',sections:[]});render();}
function setAllDays(){const v=prompt('Set every sub-phase duration to how many work days?','2');
  if(v===null)return;const n=Math.max(1,+v||1);
  S.template.forEach(g=>g.sections.forEach(s=>s.days=n));
  S.jobs.forEach(j=>allSecs(j).forEach(({s})=>s.days=n));autoSchedule();render();}
function applyTemplate(){if(!confirm('Rebuild every job from the template? Crew assignments, sign-offs, and checklist ticks are cleared.'))return;
  S.jobs.forEach(j=>j.groups=mkJobGroups(S.template));autoSchedule();render();}

/* ===================== import from the SharePoint site =====================
   Reads the payload produced by sharepoint/export-to-planner.js and MERGES it
   into whatever is already in this browser.

   Merge, not replace, deliberately: swapping the whole state would destroy any
   pool a PM had sketched here but not yet raised in SharePoint. This matches on
   `jobno` and leaves local-only pools alone.

   Structure always comes from the local phase template, never from the file.
   Only the things SharePoint actually owns are overlaid: crew, dates, duration,
   the skip/lock flags, sign-off state, and which tasks are ticked. That keeps
   sub-phase names, skills and task text authoritative here and makes the import
   impossible to corrupt with a partial payload.

   Sections that are signed off, or that SharePoint has locked, are imported as
   `locked:true` so a later Auto-Schedule cannot move completed work. That is the
   same rule `D2 - Reschedule Pool` applies on the SharePoint side. */
function importFromD2(file){
  const r=new FileReader();
  r.onload=()=>{
    let d;
    try{d=JSON.parse(r.result);}catch(e){alert('That file is not valid JSON.');return;}
    importFromD2Payload(d);
  };
  r.readAsText(file);
}
/* The shared core of importFromD2, split out so the Graph read path (below)
   can feed it a payload directly -- Graph never produces a File, so there is
   nothing for a FileReader to read. Both callers hand this the exact same
   {kind:'d2-sharepoint-export', jobs:[...]} shape; see
   sharepoint/export-to-planner.js and web/graph-to-planner.js, which are
   written to produce byte-for-byte the same structure from two different
   surfaces. This function does not know or care which one produced its
   argument. */
function importFromD2Payload(d,silent){
    if(!d||d.kind!=='d2-sharepoint-export'||!Array.isArray(d.jobs)){
      alert('That is not a schedule export.\n\nUse Refresh with the file downloaded from the site.');return;}

    const bySec=j=>{const m={};allSecs(j).forEach(({s})=>m[s.num]=s);return m;};
    let added=0,updated=0,secs=0,unmatched=[];
    const plan=d.jobs.map(inj=>{
      const existing=S.jobs.find(j=>String(j.jobno)===String(inj.jobno));
      return {inj,existing};
    });
    added=plan.filter(p=>!p.existing).length;
    updated=plan.filter(p=>p.existing).length;
    plan.forEach(p=>{(p.inj.sections||[]).forEach(()=>secs++);});
    const untouched=S.jobs.filter(j=>!d.jobs.some(i=>String(i.jobno)===String(j.jobno))).length;

    /* `silent` is set only by the automatic re-read after a successful Save.
       Re-asking "load the live schedule?" one second after the PM confirmed
       writing to it is noise, and a Cancel there would leave the planner
       holding baselines it has already written past. */
    /* A Refresh overwrites crew and dates on every pool it updates, so anything
       changed here and not yet saved is gone. The dialog said "will be updated"
       and never said that, which made a Refresh a silent way to lose an
       afternoon of re-sequencing. Count it and say so. */
    const pendingSecs=S.jobs.reduce((n,j)=>n+divergedSecs(j).length,0);
    const pendingWarn=pendingSecs
      ? '\n\nYou have unsaved changes to '+pendingSecs+' sub-phase'+(pendingSecs===1?'':'s')
        +'. Loading will overwrite them. Press Cancel and Save first if you want to keep them.'
      : '';
    if(!silent&&!confirm(
      'Load the live schedule exported '+(d.exported||'(unknown date)')+'?\n\n'+
      updated+' pool(s) already here will be updated\n'+
      added+' pool(s) will be added\n'+
      untouched+' pool(s) that exist only in this browser will be left alone\n\n'+
      secs+' sub-phases carrying crew, dates and sign-off state.'+pendingWarn))return;

    // Take the tenant's work calendar before anything recomputes a span.
    if(Array.isArray(d.nonWork)){ S.settings=S.settings||{}; S.settings.nonWork=d.nonWork; syncNonWork(); }
    S.settings=S.settings||{};
    S.settings.exportedOn=d.exported||null;
    S.settings.loadedAt=new Date().toISOString();

    plan.forEach(({inj,existing})=>{
      let j=existing;
      if(!j){
        j=newJob(inj.name||'Pool',inj.addr||'',inj.city||'',inj.state||'',inj.zip||'',inj.start||todayStr());
        j.jobno=inj.jobno; j.status=inj.status||'Active'; S.jobs.push(j);
      }else{
        if(inj.name)j.name=inj.name;
        if(inj.addr!=null)j.addr=inj.addr;
        if(inj.city!=null)j.city=inj.city;
        if(inj.start)j.start=inj.start;
        if(inj.status)j.status=inj.status;
      }
      const map=bySec(j);
      (inj.sections||[]).forEach(is=>{
        const s=map[is.num];
        if(!s){unmatched.push((inj.jobno||'?')+' '+is.num);return;}
        if(is.crewId!=null)s.crewId=is.crewId;
        if(is.start)s.start=is.start;
        if(is.days)s.days=is.days;
        s.skip=!!is.skip;
        s.inst=!!is.inst;
        s.pm=!!is.pm;
        s.spLocked=!!is.locked;      // the raw SharePoint pin, tracked on its own -- see WRITEBACK_FIELDS
        s.locked=!!(is.locked||is.inst);
        if(Array.isArray(is.tasks)&&Array.isArray(s.tasks)){
          is.tasks.forEach((it,i)=>{
            let t=(it.seq!=null&&s.tasks[it.seq-1])?s.tasks[it.seq-1]:s.tasks[i];
            if(!t&&it.title)t=s.tasks.find(x=>x.t===it.title);
            // A task cannot be both done and N/A. No live row sets both today, but
            // normalize on the way in rather than trust the source: done wins, same
            // as tick() already clearing na when a task is ticked.
            if(t){t.done=!!it.done;t.na=t.done?false:!!it.na;}
          });
        }
        /* Baseline: exactly the fields SharePoint owns, as they arrived. Divergence
           is a diff against this rather than a flag, so the same structure answers
           "has this pool been edited here" and "what would a write-back send".
           Sign-off (inst/pm) and task ticks are deliberately NEVER in this object --
           see divergedSecs above. The planner has no attribution model for a
           sign-off, while SharePoint holds InstallerSignOffBy/On and SignOffNotes,
           so a future write-back diffing against a baseline that included inst/pm
           could overwrite an attested sign-off with a bare flag. fixtures/planner/
           freshness.js pins the exact key set of this object for exactly this
           reason; extend that assertion if a key is ever deliberately added here.
           `locked` stays the DERIVED lock (SharePoint's Locked OR sign-off) that
           divergedSecs and Auto-Schedule both already key off; `spLocked` is the
           raw SharePoint Locked value on its own, kept alongside so a later
           write-back can tell a PM's deliberate pin apart from a lock this planner
           inferred from sign-off -- the two read identically through `locked`.
           `seq` (the row's SharePoint Sequence) rides along for the write-back:
           it is never diffed or written itself, just carried onto a change-set
           entry so a reflow can order writes and a conflict report can be read
           against the row the way a PM does, by sub-phase. */
        s.base={id:is.id??null,seq:is.seq??null,crewId:s.crewId??null,start:s.start??null,
                days:s.days??null,locked:!!s.locked,skip:!!s.skip,
                spLocked:!!is.locked};
      });
    });
    plan.forEach(({inj})=>{const j=S.jobs.find(x=>String(x.jobno)===String(inj.jobno));if(j)delete j.touchedAt;});
    // A pending create resolves itself the moment the real pool comes back --
    // no reason to keep telling a PM they are waiting on a request SharePoint already
    // finished. Whether it was ever pushed (requestedAt set) or is still only
    // queued here, the real pool having arrived is what matters.
    if(S.pendingCreates&&S.pendingCreates.length){
      const arrived=new Set(d.jobs.map(inj=>String(inj.jobno)));
      S.pendingCreates=S.pendingCreates.filter(c=>!arrived.has(String(c.jobno)));
    }

    save(); UI={collapsed:{}}; render();
    /* The routine summary is skipped on a silent re-read -- that runs straight
       after a Save, and a "Schedule loaded" modal stacked on top of the save
       results is noise the PM did not ask for.
       Unmatched sub-phases are NOT skipped even then. That means the phase
       template here disagrees with SharePoint, which is exactly the condition
       under which a push may have been aimed at the wrong rows, so it is worth
       interrupting for however the load was triggered. */
    if(unmatched.length){
      alert(unmatched.length+' sub-phase(s) in the schedule matched nothing in this phase template:\n'+
        unmatched.slice(0,8).join(', ')+(unmatched.length>8?' ...':'')+
        '\n\nThat means the template here is out of step with SharePoint.');
    }else if(!silent){
      alert('Schedule loaded.\n\n'+updated+' updated, '+added+' added, '+untouched+' left alone.');
    }
}

/* ============================== save / write-back ==============================
   The exact inverse of importFromD2 above: instead of merging a SharePoint
   export in, this builds the file sharepoint/apply-planner-changes.js reads to
   push edits back out. It never talks to SharePoint itself -- this only ever
   downloads a file, the same arrangement export-to-planner.js already has on
   the read side.

   FIELD SCOPE IS AN ALLOWLIST, not a convention. WRITEBACK_FIELDS (above,
   next to divergedSecs) is the only place a field can enter a change-set.
   Sign-off, notes and every Tasks-list field are never candidates -- adding
   one would also have to survive fixtures/planner/freshness.js's assertion on
   s.base's key set and fixtures/planner/writeback.js's assertion on what a
   change-set may carry. */
function buildChangeSet(){
  const pools=[];
  S.jobs.forEach(j=>{
    if(!poolHasBaseline(j))return;   // a local sketch -- never raised in SharePoint, never pushed
    const secs=[];
    allSecs(j).forEach(({s})=>{
      if(!s.base)return;             // unmatched against the template -- nothing to diff
      const diffs=secFieldDiffs(s);
      if(!diffs.length)return;
      const fields={};
      diffs.forEach(d=>{fields[d.col]={from:d.from,to:d.to};});
      secs.push({id:s.base.id,seq:s.base.seq??null,num:s.num,name:s.name,fields});
    });
    if(secs.length)pools.push({jobno:j.jobno,name:j.name,sections:secs});
  });
  return pools;
}
/* Which queued pool requests have never yet been included in a downloaded
   change-set -- what a PM has raised here but not yet pushed. A create that
   HAS been pushed (requestedAt set, by confirmSaveChangeSet below) is never
   re-offered by a later Save; it is surfaced instead on the Jobs tab as
   "waiting on SharePoint" until the real pool comes back through Refresh, which
   clears the pendingCreates entry entirely (see importFromD2). This is a
   wholly separate path to a wholly different list (New Pool Requests, never
   Assignments) and is never subject to the five-field WRITEBACK_FIELDS
   allowlist above -- that allowlist governs edits to an existing row, not the
   creation of a new one. */
function buildPendingCreates(){
  return (S.pendingCreates||[]).filter(c=>!c.requestedAt)
    .map(c=>({jobno:c.jobno,name:c.name,addr:c.addr||'',city:c.city||'',start:c.start,
      assignDefaultCrews:!!c.assignDefaultCrews}));
}
/* ---------------------------- pushing to SharePoint ----------------------------
   Save has two endings. When this page can reach Graph it pushes directly; from
   a downloaded copy on file:// it falls back to writing the change-set out for
   sharepoint/apply-planner-changes.js, which is the route that existed first and
   is deliberately kept working. The preview in between is identical either way,
   because the preview is itself a safety property: the PM sees the loaded value
   beside the new one, per field, before anything moves. */

/* Is the baseline we are about to diff against old enough to be worth stopping
   for? Compare-before-write means anything changed in SharePoint since the load
   comes back as a refusal, and a screenful of refusals reads like a broken tool
   rather than like a stale baseline. Deliberately generous: loading in the
   morning and pushing after lunch is normal PM behaviour and must not nag,
   while a baseline from an earlier day is worth a word even ninety minutes
   later, because "yesterday's schedule" is a different thing from "six hours
   ago". */
const STALE_HOURS=4;
function saveStaleness(nowMs){
  const at=S.settings&&S.settings.loadedAt;
  if(!at) return {stale:false,hours:null,loadedAt:null};
  const t=Date.parse(at), hours=(nowMs-t)/3600000;
  const earlierDay=new Date(t).toDateString()!==new Date(nowMs).toDateString();
  return {stale:hours>STALE_HOURS||earlierDay, hours, loadedAt:at};
}

/* Push the confirmed change-set. Returns everything the results dialog needs,
   including siteId and the token so the create path can reuse them rather than
   resolving the site a second time. */
async function pushChangeSet(pools){
  const tok=await graphToken();
  const G=window.D2GraphWriteback, C=window.D2WritebackCore;
  const siteResp=await fetch('https://graph.microsoft.com/v1.0/sites/'
    +D2_GRAPH.siteHost+':'+D2_GRAPH.sitePath,{headers:{Authorization:'Bearer '+tok}});
  if(!siteResp.ok) throw new Error('Could not reach the SharePoint site ('+siteResp.status+'). Nothing was written.');
  const siteId=(await siteResp.json()).id;

  /* Re-read the rows immediately before writing. Compare-before-write is only
     as good as the freshness of THIS read, not of the last Refresh. */
  const rows=await graphPageAll(G.urls(siteId).items(D2_GRAPH.lists.asg)+'?$expand=fields&$top=500',tok);
  const liveById={};
  rows.forEach(r=>{liveById[String(r.fields.id)]=r.fields;});

  const plan=C.planEdits(pools,liveById,{nowMs:Date.now(),suppressMinutes:10});
  const res=await G.applyWrites({token:tok,siteId,listId:D2_GRAPH.lists.asg},plan.writes);
  return {plan,res,siteId,tok};
}

function downloadChangeSet(pools,creates){
  const stamp=fmt(new Date());
  const payload={app:'D2 Pool Build Scheduler',kind:'d2-planner-changeset',
    generated:new Date().toISOString(),pools,creates:creates||[]};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,1)],{type:'application/json'}));
  a.download='d2-planner-changes-'+stamp+'.json';
  a.click();
}
const WB_FIELD_LABEL={Crew:'Crew',ScheduledStart:'Start date',DurationDays:'Duration (days)',
  Locked:'Locked',NotApplicable:'Not applicable'};
function wbFmt(col,v){
  if(v==null||v==='')return '—';
  if(col==='Crew'){const c=crew(v);return c?c.name:v;}
  if(col==='ScheduledStart')return pretty(v);
  if(col==='Locked'||col==='NotApplicable')return v?'Yes':'No';
  return String(v);
}
let PENDING_CHANGESET=null, PENDING_CREATES=null;
/* The preview a PM must confirm before anything downloads. Grouped by pool,
   one line per changed field, naming the field and the loaded value next to
   the new one -- a count is not enough to see "this is about to move 46
   rows" before it happens. Pending pool requests are their own clearly
   labelled section, separate from field edits: "1 new pool will be
   requested" is a different kind of change than "12 sub-phases will be
   updated" -- one is a two-phase, 10-20 minute round trip through
   D2 - New Pool, the other lands immediately. */
function openSavePreview(){
  const pools=buildChangeSet();
  const creates=buildPendingCreates();
  const totalSecs=pools.reduce((n,p)=>n+p.sections.length,0);
  if(!totalSecs&&!creates.length){alert('Nothing to push -- no pool has changed here since the last Refresh, and no new pool is queued.');return;}
  const skipped=S.jobs.filter(j=>!poolHasBaseline(j));
  const canPush=graphModeAvailable();
  const st=saveStaleness(Date.now());
  document.getElementById('dTitle').textContent='Save changes';
  document.getElementById('dBody').innerHTML=
    (canPush&&st.stale?`<div class="hint" style="padding:0 0 11px;color:#a84a18">
      <strong>This schedule was loaded ${esc(freshStamp(st.loadedAt))}.</strong>
      Anything changed in SharePoint since then will be refused rather than overwritten,
      so you may see refusals below rather than a clean push. Refresh first if you want to
      be sure you are working from the current schedule.</div>`:'')+
    `<div class="hint" style="padding:0 0 11px">
      ${totalSecs?`${totalSecs} sub-phase${totalSecs===1?'':'s'} across ${pools.length} pool${pools.length===1?'':'s'} will be updated. `:''}
      ${creates.length?`${creates.length} new pool${creates.length===1?'':'s'} will be requested. `:''}
      ${canPush
        ? `This writes to SharePoint straight away. Anything changed there since you loaded
           is refused rather than overwritten, and you will see exactly what landed.`
        : `This only downloads a file — nothing is sent until that file is applied with
           <span class="mono">sharepoint/apply-planner-changes.js</span>.`}
      ${skipped.length?`<br><br>${skipped.length} pool${skipped.length===1?'':'s'} sketched only in this browser `
        +`${skipped.length===1?'is':'are'} excluded from the edits above — use the +Job form to request a new pool instead: `
        +skipped.map(j=>esc(j.jobno||j.name)).join(', ')+'.':''}
    </div>`+
    (creates.length?`<div class="fld"><label>New pools to request (${creates.length})</label>
      <div class="hint" style="padding:0 0 6px">
        Each raises a row in SharePoint's New Pool Requests list. D2 - New Pool takes about
        16m 33s when last measured, with a six-minute stall — allow 10–20 minutes, and the
        request sits at "Building" the whole time
        and looks stuck, but is not. Use Refresh once it finishes to pull the pool in.
      </div>
      <table><tbody>${creates.map(c=>`<tr><td class="small"><b>${esc(c.jobno)}</b></td>
        <td class="small">${esc(c.name)}</td>
        <td class="small muted">${esc([c.addr,c.city].filter(Boolean).join(', '))}</td>
        <td class="small muted">${esc(pretty(c.start))}</td>
        <td class="small muted">${c.assignDefaultCrews?'Assign default crews':'Leave unassigned'}</td></tr>`).join('')}
      </tbody></table></div>`:'')+
    pools.map(p=>`<div class="fld"><label>${esc(p.jobno)} · ${esc(p.name)} — ${p.sections.length} sub-phase${p.sections.length===1?'':'s'}</label>
      <table><tbody>${p.sections.map(sec=>Object.keys(sec.fields).map(col=>
        `<tr><td class="small">${esc(sec.num)} ${esc(sec.name)}</td>
             <td class="small muted">${WB_FIELD_LABEL[col]||col}</td>
             <td class="small">${esc(wbFmt(col,sec.fields[col].from))}</td>
             <td class="small muted">→</td>
             <td class="small"><b>${esc(wbFmt(col,sec.fields[col].to))}</b></td></tr>`).join('')).join('')}
      </tbody></table></div>`).join('');
  document.getElementById('dFoot').innerHTML=
    `<button class="btn p" onclick="confirmSaveChangeSet()">`
      +(canPush
        ? `Save ${totalSecs} edit${totalSecs===1?'':'s'} to SharePoint`
        : `Download change-set (${totalSecs} edit${totalSecs===1?'':'s'}`)
      +`${creates.length?(canPush?` and request ${creates.length} new pool${creates.length===1?'':'s'}`
                                 :', '+creates.length+' new pool'+(creates.length===1?'':'s')):''}`
      +(canPush?'':')')+`</button>
     <button class="btn" onclick="closeDrawer()">Cancel</button>`;
  PENDING_CHANGESET=pools;
  PENDING_CREATES=creates;
  document.getElementById('drawer').classList.add('open');
}
/* Save's two endings. Graph mode writes; otherwise the change-set downloads
   for the console applier, exactly as before. */
function confirmSaveChangeSet(){
  return graphModeAvailable()?confirmSaveByPush():confirmSaveByDownload();
}

/* Raise a New Pool Requests row per queued create.
   Wholly separate from the edit path: a different list, a different shape, and
   NOT subject to the five-field allowlist, which governs edits to an existing
   row rather than the creation of a new one. */
async function pushCreates(siteId,tok,creates){
  const G=window.D2GraphWriteback, C=window.D2WritebackCore;
  const U=G.urls(siteId);

  /* Resolve the signed-in user to a SharePoint site-user id. Exactly one match
     or refuse: a blank Person column is accepted on write and then fails inside
     D2 - New Pool about sixteen minutes later, which reads as the tool hanging.
     The UPN comes from the MSAL account because this token is scoped to
     Sites.ReadWrite.All and cannot call /me. */
  const acct=graphPca().getActiveAccount()||graphPca().getAllAccounts()[0];
  const uil=await graphPageAll(U.userInfo,tok);
  const who=G.resolveSiteUserId(uil.map(r=>r.fields),acct&&acct.username);
  if(!who.id) throw new Error(who.ambiguous
    ? 'Your sign-in matches more than one SharePoint account, so the project manager cannot be set safely. No pool was requested.'
    : 'Could not identify your SharePoint account, so the project manager cannot be set. No pool was requested.');

  /* Uniqueness spans live Jobs AND requests still Requested or Building. The
     documented wait actively trains a re-run, because a request sits at
     Building for about a quarter of an hour and looks stuck. */
  const jobs=await graphPageAll(U.items(D2_GRAPH.lists.jobs)+'?$expand=fields&$top=500',tok);
  const reqs=await graphPageAll(U.items(D2_GRAPH.lists.req)+'?$expand=fields&$top=500',tok);
  const pending=reqs.map(r=>r.fields)
    .filter(f=>f.Status==='Requested'||f.Status==='Building').map(f=>f.JobNumber);
  const plan=C.planCreates(creates,jobs.map(r=>r.fields.JobNumber),pending);

  const created=[],failed=[];
  for(const c of plan.creates){
    const r=await fetch(U.items(D2_GRAPH.lists.req),
      {method:'POST',headers:G.headers(tok),body:JSON.stringify({fields:G.createBody(c,who.id)})});
    if(r.ok) created.push(c.jobno);
    else failed.push({jobno:c.jobno,status:r.status});
  }
  return {created,refused:plan.refusals,failed};
}

async function confirmSaveByPush(){
  const pools=PENDING_CHANGESET||[], creates=PENDING_CREATES||[];
  document.getElementById('dFoot').innerHTML='<span class="hint">Saving…</span>';
  let out=null,err=null;
  try{
    out=await pushChangeSet(pools);
    if(creates.length){
      try{ out.creates=await pushCreates(out.siteId,out.tok,creates); }
      catch(e){ out.createError=e; }
    }
  }catch(e){ err=e; }

  /* Only creates that actually landed are marked requested. Marking one that
     was refused would hide it from every later Save. */
  if(out&&out.creates&&out.creates.created.length){
    const now=new Date().toISOString();
    out.creates.created.forEach(jobno=>{
      const pc=(S.pendingCreates||[]).find(x=>x.jobno===jobno&&!x.requestedAt);
      if(pc)pc.requestedAt=now;
    });
    save();
  }
  showPushResult(out,err);
  /* Re-read after a successful write: it resets every baseline, picks up what
     the flows did in the meantime, and means the next Save diffs against
     something current rather than against what we just moved away from. */
  if(out&&out.res.written.length){ try{ await loadFromD2ViaGraph(true); }catch(e){} }
}

/* A refusal nobody sees is silent data loss, so every one is named with both
   values: what we loaded, what is live now, and what was wanted. */
function showPushResult(out,err){
  const body=document.getElementById('dBody');
  document.getElementById('dTitle').textContent='Save results';
  if(err||!out){
    body.innerHTML=`<div class="hint" style="color:#a84a18">Nothing was written. ${esc(err&&err.message||'Unknown error.')}</div>`;
  }else{
    const {plan,res}=out;
    const row=(a,b,c)=>`<tr><td class="small">${esc(a)}</td><td class="small">${esc(b)}</td><td class="small muted">${esc(c)}</td></tr>`;
    const sec=(label,rows,colour)=>rows.length
      ? `<div class="fld"><label${colour?` style="color:${colour}"`:''}>${esc(label)} (${rows.length})</label>
         <table><tbody>${rows.join('')}</tbody></table></div>` : '';
    body.innerHTML=
      sec('Saved',res.written.map(w=>row(w.jobno+' '+w.num,w.fields.join(', '),'')))
     +sec('Refused — changed in SharePoint since you loaded',
          plan.refusals.map(r=>row(r.jobno+' '+r.num,r.col,
            r.reason==='diverged'?`loaded ${r.loaded}, now ${r.nowLive}, wanted ${r.wanted}`:r.reason)),'#a84a18')
     +sec('Skipped',plan.errors.map(e=>row(e.jobno+' '+e.num,e.reason,e.liveTitle||'')),'#a84a18')
     +sec('Failed',res.failed.map(f=>row(f.jobno+' '+f.num,'HTTP '+f.status,'')),'#a84a18')
     +(out.creates?sec('Pool requests raised',out.creates.created.map(j=>row(j,'requested','')))
        +sec('Pool requests refused',out.creates.refused.map(r=>row(r.jobno,r.reason,(r.missing||[]).join(', '))),'#a84a18')
        +sec('Pool requests failed',out.creates.failed.map(f=>row(f.jobno,'HTTP '+f.status,'')),'#a84a18')
        +(out.creates.created.length?`<div class="hint" style="padding:8px 0 0">
            Each request takes about 16 minutes, and one run stalled for six minutes in the
            middle. It sits at Building the whole time and looks stuck. Do not raise it again —
            use Refresh once it finishes.</div>`:''):'')
     +(out.createError?`<div class="hint" style="color:#a84a18;padding:8px 0 0">
          No pool was requested. ${esc(out.createError.message)}</div>`:'')
     +(!res.written.length&&!plan.refusals.length&&!plan.errors.length&&!res.failed.length&&!out.creates
        ? '<div class="hint">Nothing needed saving.</div>':'');
  }
  document.getElementById('dFoot').innerHTML='<button class="btn p" onclick="closeDrawer()">Close</button>';
}

function confirmSaveByDownload(){
  const creates=PENDING_CREATES||[];
  downloadChangeSet(PENDING_CHANGESET||[],creates);
  // Mark these as pushed so a later Save never re-offers them -- they now
  // read as "waiting on D2" on the Jobs tab until the real pool comes back
  // through Refresh, which clears the pendingCreates entry entirely.
  const now=new Date().toISOString();
  creates.forEach(c=>{
    const pc=(S.pendingCreates||[]).find(x=>x.jobno===c.jobno&&!x.requestedAt);
    if(pc)pc.requestedAt=now;
  });
  PENDING_CHANGESET=null; PENDING_CREATES=null;
  save();
  closeDrawer();render();
}

/* ============================== Graph read path ==============================
   Refresh reads live through Microsoft Graph when this page is served
   over http/https AND both MSAL and the mapping module are on the page;
   otherwise it falls back to the existing file picker, unchanged. That
   fallback is NOT a stopgap to remove later -- MSAL cannot complete a
   sign-in redirect back to a file:// URL, and a downloaded standalone copy
   of this planner still exists in the site's Documents library (see CLAUDE.md
   "THE PLANNER IS DISTRIBUTED AS A SHAREPOINT DOWNLOAD"). Since the Static Web
   App went live on 2026-09-14, graphModeAvailable() is TRUE for anyone using
   the hosted planner, which is the supported surface; the file picker now only
   runs for someone who opened a downloaded copy.

   The mapping from a Graph read to this planner's payload shape lives in
   web/graph-to-planner.js, loaded above via <script> as
   window.D2GraphToPlanner -- not duplicated here -- so the code this app
   runs and the code fixtures/planner/graph-read.js tests are the same file.
   MSAL itself is loaded from a vendored copy, never a CDN (see
   web/vendor/msal-browser.min.js and the <script> comment above); both live
   under web/, the Static Web Apps deploy root, and ship alongside this file.

   Popup, not redirect, for the sign-in: a redirect would navigate this page
   away and back, and unlike fixtures/planner/capture-graph.html (a one-shot
   capture tool with no state to lose) this planner has in-memory schedule
   state a PM may not have saved yet. */
const D2_GRAPH={
  clientId:'1aa00e61-e5e7-42bd-95b4-fd58863e5b54',
  authority:'https://login.microsoftonline.com/f24d9b39-6a71-4f4e-a376-03b6f61c97e4',
  scopes:['https://graph.microsoft.com/Sites.ReadWrite.All'],
  siteHost:'netorgft15040037.sharepoint.com',
  sitePath:'/sites/D2BuildScheduler',
  // Same four list GUIDs as fixtures/planner/capture-graph.js -- carried
  // here rather than re-typed as a second source of truth would invite.
  lists:{
    jobs:'ee0ecabf-2f11-458d-a9ea-641f76d10cc3',
    asg:'49ef7006-d3fe-40a7-a52f-c4c18545bd35',
    tasks:'22c45847-ff0d-417a-b53e-1ea018fbb6d3',
    cal:'d36758cf-9d27-4342-84e4-817f8dcfa2ba',
    // Written to only by + Job, via New Pool Requests. Never read on Refresh.
    req:'13331a5e-ea8e-4ab2-9276-db5b4f4d46bf'
  }
};
function graphModeAvailable(){
  return location.protocol!=='file:' &&
    typeof window.msal!=='undefined' && !!window.msal.PublicClientApplication &&
    typeof window.D2GraphToPlanner!=='undefined';
}
let D2_PCA=null;
/* Deliberately not named msal -- see capture-graph.html: naming the instance
   msal shadows the library's own global and every call below throws before
   anything useful happens. */
function graphPca(){
  if(!D2_PCA)D2_PCA=new window.msal.PublicClientApplication({
    auth:{clientId:D2_GRAPH.clientId,authority:D2_GRAPH.authority,
          redirectUri:location.origin+location.pathname},
    cache:{cacheLocation:'sessionStorage'}
  });
  return D2_PCA;
}
async function graphToken(){
  const pca=graphPca();
  const account=pca.getActiveAccount()||pca.getAllAccounts()[0];
  if(account){
    try{
      const r=await pca.acquireTokenSilent({scopes:D2_GRAPH.scopes,account});
      return r.accessToken;
    }catch(e){/* falls through to an interactive sign-in below */}
  }
  const r=await pca.loginPopup({scopes:D2_GRAPH.scopes});
  pca.setActiveAccount(r.account);
  return r.accessToken;
}
// Page through a Graph collection. Tasks is 885 rows today and grows by 295
// per pool, so following @odata.nextLink is never optional -- see
// capture-graph.html, which paid for this once already.
async function graphPageAll(url,tok){
  let out=[];
  while(url){
    const r=await fetch(url,{headers:{Authorization:'Bearer '+tok}});
    if(!r.ok)throw new Error('Graph '+r.status+' on '+url.slice(0,120));
    const d=await r.json();
    out=out.concat(d.value||[]);
    url=d['@odata.nextLink']||null;
  }
  return out;
}
async function loadFromD2ViaGraph(silent){
  const tok=await graphToken();
  const siteResp=await fetch(
    'https://graph.microsoft.com/v1.0/sites/'+D2_GRAPH.siteHost+':'+D2_GRAPH.sitePath,
    {headers:{Authorization:'Bearer '+tok}});
  if(!siteResp.ok)throw new Error('Site lookup failed: '+siteResp.status);
  const site=await siteResp.json();
  const base='https://graph.microsoft.com/v1.0/sites/'+site.id+'/lists/';
  const keys=Object.keys(D2_GRAPH.lists);
  const rows=await Promise.all(keys.map(k=>
    graphPageAll(base+D2_GRAPH.lists[k]+'/items?$expand=fields&$top=500',tok)));
  const graphPayload={site:site.webUrl};
  keys.forEach((k,i)=>{graphPayload[k]=rows[i];});
  const payload=window.D2GraphToPlanner.toPlannerPayload(graphPayload);
  importFromD2Payload(payload,silent);
}
function updateButtonTooltips(){
  const sv=document.getElementById('saveBtn');
  if(sv){
    sv.title=graphModeAvailable()
      ? 'Review everything changed here since the last Refresh, then write it back to '
        +'SharePoint. Nothing is sent until you confirm.'
      : 'Review everything changed here since the last Refresh and download it as a file. '
        +'Opened as a downloaded copy, this planner cannot write to SharePoint itself.';
  }
  const b=document.getElementById('d2Btn');
  if(graphModeAvailable()){
    b.title='Reads the live schedule from the D2 Build Scheduler site over Microsoft Graph. Merges by job number -- it never touches pools that only exist here.';
  }else{
    b.title='Load the live schedule exported from the D2 Build Scheduler SharePoint site. Merges by job number - it never touches pools that only exist here.'+
      (location.protocol==='file:'?' (Opened as a downloaded file -- pick the exported .json below.)':'');
  }
}
document.getElementById('d2Btn').onclick=()=>{
  if(graphModeAvailable()){
    loadFromD2ViaGraph().catch(e=>{
      alert('Could not load the live schedule: '+e.message+
        '\n\nFalling back to the file picker -- choose the exported .json from the site instead.');
      document.getElementById('d2File').click();
    });
  }else{
    document.getElementById('d2File').click();
  }
};
document.getElementById('d2File').onchange=e=>{const f=e.target.files[0];if(f)importFromD2(f);e.target.value='';};
updateButtonTooltips();
load();render();
