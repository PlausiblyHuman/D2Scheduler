/* ---- activating a pool: Planned -> Active ---------------------------------
   Nothing dispatches, alerts or reaches the group calendar until a pool is
   Active, which is why this is a deliberate act with its own confirmation
   rather than an inline status dropdown.
   The conflict count is on the dialog because D2 - New Pool assigns each
   sub-phase its template default crew with no awareness of what that crew is
   already booked on, so a freshly generated pool routinely arrives
   double-booked against live work. The planner knows that and SharePoint does
   not. Activating one unexamined is how those bookings reach a crew.

   NAMED "Activate", NOT "Commit": the Status column beside the button reads
   Planned / Active / On Hold, so the verb and the state it produces are the
   same word. "Commit" was developer vocabulary and meant nothing to a PM. */
function activatePool(jobId){
  const j=S.jobs.find(x=>x.id===jobId); if(!j||frozen(j))return;
  if(stopForUnsaved('Activate '+(j.jobno||j.name),'Activating a project'))return;
  /* Split by level. conflicts() returns hard errors AND advisory warnings, and
     lumping them made this dialog announce "13 unresolved conflicts" on a pool
     whose only findings were unassigned pseudo-trade rows and sign-offs nobody
     can give yet, because the crew leads have no accounts. That reads as alarming
     and is not what this dialog is for: it exists because D2 - New Pool assigns
     template default crews blind, so a fresh pool routinely arrives genuinely
     double-booked. Errors are listed; warnings get a single honest line. */
  const mineAll=conflicts().filter(c=>(c.jobs||[]).includes(j.jobno));
  const mine=mineAll.filter(c=>c.lvl==='err');
  const warn=mineAll.length-mine.length;
  document.getElementById('dTitle').textContent='Activate '+(j.jobno||j.name);
  document.getElementById('dBody').innerHTML=
    `<div class="hint" style="padding:0 0 11px">
       This moves <strong>${esc(j.jobno)} ${esc(j.name)}</strong> from Planned to Active.
       From then on it appears in the daily dispatch and the summary emails, its sub-phases
       are written to the shared calendar, and conflict alerts for it go to its project manager.
       <br><br><strong>This one writes straight away.</strong> Everything else you change on this
       screen waits for Save; activating a pool takes effect when you confirm it here.
     </div>`
    +(mine.length
      ? `<div class="fld"><label style="color:#a84a18">${mine.length} scheduling problem${mine.length===1?'':'s'} on this pool</label>
           <div class="hint" style="padding:0 0 6px">These do not block it, but they go live with the pool.</div>
           <table><tbody>${mine.slice(0,12).map(c=>`<tr><td class="small">${c.msg}</td></tr>`).join('')}
           ${mine.length>12?`<tr><td class="small muted">and ${mine.length-12} more — see Schedule Check</td></tr>`:''}</tbody></table></div>`
      : `<div class="fld"><label>No scheduling problems on this pool</label></div>`)
    +(warn?`<div class="hint" style="padding:8px 0 0">${warn} advisory warning${warn===1?'':'s'} as well
        (work with no crew allocated, or finished work not yet signed off). Those are listed under
        Schedule Check on the Job Board.</div>`:'');
  document.getElementById('dFoot').innerHTML=
    `<button class="btn p" onclick="doActivatePool('${jobId}')">Activate pool</button>
     <button class="btn" onclick="closeDrawer()">Cancel</button>`;
  document.getElementById('drawer').classList.add('open');
}

function planPool(jobId){

  if(stopForUnsaved('Back to planning: '+(j.jobno||j.name),'Moving a project back to planning'))return;

       until it is activated again. Its entries on the shared calendar are removed on the next

       <br><br><strong>This one writes straight away.</strong> Everything else you change on this

     </div>`;
  document.getElementById('dFoot').innerHTML=

function doSetPoolStatus(jobId,from,to){
  const j=S.jobs.find(x=>x.id===jobId); if(!j)return;

/* Activate, Back to planning, Mark complete and Reopen all write Jobs.Status this one way.
   By job number, because a completed project is no longer in S.jobs. */
async function setStatusByJobNo(jobno,from,to){
  document.getElementById('dFoot').innerHTML='<span class="hint">'+(to==='Active'?'Activating…':'Saving…')+'</span>';
  try{
    const tok=await graphToken(), G=window.D2GraphWriteback;
    const siteId=(await graphSite(tok)).id, U=G.urls(siteId);
    const rows=await graphPageAll(U.items(D2_GRAPH.lists.jobs)+'?$expand=fields&$top=500',tok);
    const row=rows.find(r=>String(r.fields.JobNumber)===String(jobno));
    if(!row) throw new Error('That project is not in SharePoint yet. Refresh and try again.');
    /* Compare-before-write for this one field: re-read Status immediately
       before changing it, so two people activating at once cannot both think
       they did it, and so a pool already put On Hold is not quietly reactivated. */
    if(row.fields.Status!==from)
      throw new Error('This project is already '+row.fields.Status+' in SharePoint. Nothing was changed.');
    const r=await fetch(U.fields(D2_GRAPH.lists.jobs,row.fields.id),
      {method:'PATCH',headers:G.headers(tok),body:JSON.stringify(G.statusBody(to))});
    if(!r.ok) throw new Error('SharePoint refused the change (HTTP '+r.status+').');
    closeDrawer();
    await loadFromD2ViaGraph(true);
  }catch(e){
    document.getElementById('dBody').innerHTML=graphErrorHTML(e,'');
    document.getElementById('dFoot').innerHTML='<button class="btn" onclick="closeDrawer()">Close</button>';
  }
}

/* ---- Completing a project (Spec A, decided 2026-09-28) ----
   Offered only on an Active project whose every sub-phase is installer-signed or not
   applicable. PM sign-off does not count: nothing reads it. A completed project stays in
   SharePoint as Status = Complete and leaves the planner, the dispatch, the summaries, the
   alerts and (at the 04:30 sweep) the calendar. It can be reopened. Warranty is not managed
   here. */
function readyToComplete(j){
  if(!j||j.building||j.readOnly||j.status!=='Active'||!poolHasBaseline(j))return false;
  const secs=allSecs(j);
  return secs.length>0&&secs.every(({s})=>s.inst||s.skip);
}
/* Anything changed here on this project and not yet saved. Completing writes Status and
   Refreshes, which would discard it, so Mark complete asks for a Save first. This is what stops
   a last INST tick, made here and not saved, from completing a project SharePoint holds unsigned. */
function hasUnsaved(j){
  const same=p=>String(p.jobno)===String(j.jobno);
  return divergedSecs(j).length>0||buildSignoffSet().some(same)||buildRejectionSet().some(same)
    ||buildJobStartChanges().some(same);
}
/* Activate, Back to planning, Mark complete and Reopen each write Jobs.Status and then reload
   the whole schedule, which would throw away any change on screen not yet in SharePoint, on any
   project. They stop and say so instead. Returns true when it stopped. */
function stopForUnsaved(title,doing){
  const unsaved=S.jobs.filter(hasUnsaved);
  if(!unsaved.length)return false;
  document.getElementById('dTitle').textContent=title;
  document.getElementById('dBody').innerHTML=
    `<div class="hint" style="padding:0 0 11px"><strong>Save first.</strong> There are changes on this screen
     that are not in SharePoint yet (${unsaved.map(x=>esc(x.jobno)).join(', ')}). ${doing} reloads the
     schedule, which would lose them. Press Save, then try again.</div>`;
  document.getElementById('dFoot').innerHTML='<button class="btn" onclick="closeDrawer()">Close</button>';
  document.getElementById('drawer').classList.add('open');
  return true;
}
function completeProject(jobId){
  const j=S.jobs.find(x=>x.id===jobId); if(!j||!readyToComplete(j))return;
  if(stopForUnsaved('Mark complete: '+(j.jobno||j.name),'Marking a project complete'))return;
  document.getElementById('dTitle').textContent='Mark complete: '+(j.jobno||j.name);
  document.getElementById('dBody').innerHTML=
      `<div class="hint" style="padding:0 0 11px">
         This marks <strong>${esc(j.jobno)} ${esc(j.name)}</strong> complete. It leaves the Job Board,
         the daily dispatch, the summary emails and conflict alerts. Its entries on the shared calendar
         are removed on the next full calendar sweep, at 04:30. Its record stays in SharePoint, and you
         can reopen it from Completed projects on this tab.
         <br><br><strong>This one writes straight away.</strong> Everything else you change on this
         screen waits for Save.
       </div>`;

      `<button class="btn p" onclick="doCompleteProject('${jobId}')">Mark complete</button>

}
/* Sign-off is re-read before Complete is written: a sub-phase rejected or reopened elsewhere
   since this screen last loaded would otherwise be completed unsigned. */
async function doCompleteProject(jobId){
  const j=S.jobs.find(x=>x.id===jobId); if(!j)return;
  document.getElementById('dFoot').innerHTML='<span class="hint">Checking sign-off…</span>';
  try{

    const rows=(await readAsgForJobs(siteId,tok,[j.jobno])).filter(r=>String(r.fields.JobLookupId)===String(j.spId));
    const open=rows.filter(r=>!r.fields.InstallerSignOff&&!r.fields.NotApplicable);
    if(!rows.length||open.length){
      document.getElementById('dBody').innerHTML=`<div class="hint" style="padding:0 0 11px"><strong>Not marked complete.</strong>
        ${open.length?`${open.length} sub-phase${open.length===1?' is':'s are'} not signed off in SharePoint any more
        (${open.slice(0,5).map(r=>esc(r.fields.SubPhaseNumber||'')+' '+esc(r.fields.SubPhaseName||'')).join(', ')}${open.length>5?', …':''}).`
        :'Its sub-phases could not be read.'} Refresh to see the current state. Nothing was changed.</div>`;
      document.getElementById('dFoot').innerHTML='<button class="btn" onclick="closeDrawer()">Close</button>';
      return;
    }
  }catch(e){
    document.getElementById('dBody').innerHTML=graphErrorHTML(e,'');

  }

}

function toggleSkill(id,sk){const c=crew(id);c.skills=c.skills.includes(sk)?c.skills.filter(x=>x!==sk):[...c.skills,sk];save();render();}
function addCrew(){S.crews.push({id:'c'+Math.random().toString(36).slice(2,7),name:'New Crew',members:[],size:1,skills:[]});render();}

/* ===================== import from the SharePoint site =====================
   Reads the payload produced by sharepoint/export-to-planner.js and MERGES it
   into whatever is already in this browser.

   Merge, not replace, deliberately: swapping the whole state would destroy any
   pool a PM had sketched here but not yet raised in SharePoint. This matches on
   `jobno` and leaves local-only pools alone.

   Structure always comes from the local phase template, never from the file.
   Only the things SharePoint actually owns are overlaid: crew, dates, duration,
   the skip/lock flags, sign-off state, and which tasks are ticked. That keeps
   sub-phase names, skills and task text authoritative here and makes the import
   impossible to corrupt with a partial payload.

   Sections that are signed off, or that SharePoint has locked, are imported as
   `locked:true` so a later Auto-Schedule cannot move completed work. That is the
   same rule `D2 - Reschedule Pool` applies on the SharePoint side. */
function importFromD2(file){
  const r=new FileReader();
  r.onload=()=>{
    let d;
    try{d=JSON.parse(r.result);}catch(e){alert('That file is not valid JSON.');return;}
    importFromD2Payload(d);
  };
  r.readAsText(file);
}
/* The shared core of importFromD2, split out so the Graph read path (below)
   can feed it a payload directly -- Graph never produces a File, so there is
   nothing for a FileReader to read. Both callers hand this the exact same
   {kind:'d2-sharepoint-export', jobs:[...]} shape; see
   sharepoint/export-to-planner.js and web/graph-to-planner.js, which are
   written to produce byte-for-byte the same structure from two different
   surfaces. This function does not know or care which one produced its
   argument. */
function importFromD2Payload(d,silent){
    if(!d||d.kind!=='d2-sharepoint-export'||!Array.isArray(d.jobs)){
      alert('That is not a schedule export.\n\nUse Refresh with the file downloaded from the site.');return;}

    const bySec=j=>{const m={};allSecs(j).forEach(({s})=>m[s.num]=s);return m;};
    let added=0,updated=0,secs=0,unmatched=[];
    const plan=d.jobs.map(inj=>{
      const existing=S.jobs.find(j=>String(j.jobno)===String(inj.jobno));
      return {inj,existing};
    });
    added=plan.filter(p=>!p.existing).length;
    updated=plan.filter(p=>p.existing).length;
    plan.forEach(p=>{(p.inj.sections||[]).forEach(()=>secs++);});
    /* A project completed since the last Refresh is no longer in d.jobs, which would otherwise
       make it "a pool that exists only in this browser" and leave it here forever. It came from
       SharePoint (it has a baseline), so it goes. A sketch made here and never saved has no
       baseline and stays, whatever its number. Matched by exact job number, as the merge is. */
    const liveNos=new Set(d.jobs.map(i=>String(i.jobno)));
    const doneNos=new Set((d.completedJobNumbers||[]).map(String).filter(n=>!liveNos.has(n)));
    const leaving=S.jobs.filter(j=>doneNos.has(String(j.jobno))&&poolHasBaseline(j));
    const untouched=S.jobs.filter(j=>!leaving.includes(j)&&!d.jobs.some(i=>String(i.jobno)===String(j.jobno))).length;

    /* `silent` is set only by the automatic re-read after a successful Save.
       Re-asking "load the live schedule?" one second after the PM confirmed
       writing to it is noise, and a Cancel there would leave the planner
       holding baselines it has already written past. */
    /* A Refresh overwrites crew and dates on every pool it updates, so anything
       changed here and not yet saved is gone. The dialog said "will be updated"
       and never said that, which made a Refresh a silent way to lose an
       afternoon of re-sequencing. Count it and say so. */
    const pendingSecs=S.jobs.reduce((n,j)=>n+divergedSecs(j).length,0);
    const pendingWarn=pendingSecs
      ? '\n\nYou have unsaved changes to '+pendingSecs+' sub-phase'+(pendingSecs===1?'':'s')
        +'. Loading will overwrite them. Press Cancel and Save first if you want to keep them.'
      : '';
    if(!silent&&!confirm(
      'Load the live schedule exported '+(d.exported||'(unknown date)')+'?\n\n'+
      updated+' project(s) already here will be updated\n'+
      added+' project(s) will be added\n'+
      (leaving.length?leaving.length+' completed project'+(leaving.length===1?'':'s')+' will leave the planner\n':'')+
      untouched+' project(s) that exist only in this browser will be left alone\n\n'+
      secs+' sub-phases carrying crew, dates and sign-off state.'+pendingWarn))return;

    // Take the tenant's work calendar before anything recomputes a span.
    if(Array.isArray(d.nonWork)){ S.settings=S.settings||{}; S.settings.nonWork=d.nonWork; syncNonWork(); }
    S.settings=S.settings||{};
    S.settings.exportedOn=d.exported||null;
    S.settings.loadedAt=new Date().toISOString();
    UI.tlScroll={};   // a new schedule re-centres on today

    plan.forEach(({inj,existing})=>{
      let j=existing;
      if(!j){
        j=newJob(inj.name||'Pool',inj.addr||'',inj.city||'',inj.state||'',inj.zip||'',inj.start||todayStr());
        j.jobno=inj.jobno; j.status=inj.status||'Active'; S.jobs.push(j);
      }else{
        if(inj.name)j.name=inj.name;
        if(inj.addr!=null)j.addr=inj.addr;
        if(inj.city!=null)j.city=inj.city;
        if(inj.start)j.start=inj.start;
        if(inj.status)j.status=inj.status;
      }
      /* Still being built by D2 - New Pool. Read off New Pool Requests on the
         Graph path; the REST export does not carry it, so it reads false. */
      j.building=!!inj.building;
      // A project arriving in a Refresh is live; only openCompleted marks one read-only, after this.
      j.readOnly=false;
      /* The project's own start as loaded, so a reset here can be written back
         to Jobs.StartDate with a compare against what was loaded. */
      j.baseStart=inj.start||null;
      // PM name for the Jobs tab. The id rides along for the Graph path only;
      // the REST export carries the name without it.
      if(inj.pm!=null)j.pm=inj.pm;
      if(inj.pmId!=null)j.pmId=String(inj.pmId);
      // The Jobs row's SharePoint id, so Save can read just this project's rows (Spec A).
      if(inj.id!=null)j.spId=String(inj.id);
      const map=bySec(j);
      (inj.sections||[]).forEach(is=>{
        const s=map[is.num];
        if(!s){unmatched.push((inj.jobno||'?')+' '+is.num);return;}
        if(is.crewId!=null)s.crewId=is.crewId;
        if(is.start)s.start=is.start;
        if(is.days)s.days=is.days;
        s.skip=!!is.skip;
        s.inst=!!is.inst;
        s.pm=!!is.pm;
        /* Rejection state is display state, never diffed, so it stays out of
           s.base. The thread is replaced, never merged: an entry deleted on the
           site must disappear here on the next Refresh rather than linger. */
        s.rejected=!!is.rejected;
        s.rejectedOn=is.rejectedOn||null;
        s.rejectedReason=is.rejectedReason||null;
        s.thread=Array.isArray(is.thread)?is.thread:[];
        s.spLocked=!!is.locked;      // the raw SharePoint pin, tracked on its own -- see WRITEBACK_FIELDS
        s.locked=!!(is.locked||is.inst);
        if(Array.isArray(is.tasks)&&Array.isArray(s.tasks)){
          /* Which SharePoint row each checklist line writes to. Position alone
             writes to the wrong row the moment a checklist is reordered on the
             SharePoint site: ticking "A" would land on "B". So:

             1. match by task NAME;
             2. only what is left over matches by position, and it keeps a row
                id only when the leftovers line up exactly -- the same number on
                each side, each at the position of a line still unmatched. That
                is a task renamed on one side (the SharePoint row, or this
                browser's Phase Template), and position is then the same task.

             Anything else (a reorder plus a rename, a task added or deleted in
             SharePoint) still shows SharePoint's state but carries NO row id, so
             a tick on it is reported instead of written where it may not belong.
             Ids are cleared first so a re-import never keeps a stale one. */
          const claimed=new Set(), sameName=(a,b)=>String(a??'').trim()===String(b??'').trim();
          const pos=(it,i)=>it.seq!=null?it.seq-1:i;
          s.tasks.forEach(t=>{t.spId=null;});
          // A task cannot be both done and N/A. No live row sets both today, but
          // normalize on the way in rather than trust the source: done wins, same
          // as tick() already clearing na when a task is ticked.
          const take=(t,it,keepId)=>{
            claimed.add(t);
            t.done=!!it.done;t.na=t.done?false:!!it.na;
            t.note=t.na?String(it.note||''):'';  // the N/A reason, Tasks.Note
            t.spId=keepId?(it.id??null):null;   // the Tasks row this tick writes to
            t.base={done:t.done,na:t.na,note:t.note};  // what SharePoint said, for the diff
          };
          const rest=[];
          is.tasks.forEach((it,i)=>{
            const t=s.tasks.find(x=>!claimed.has(x)&&sameName(x.t,it.title));
            if(t)take(t,it,true); else rest.push([it,i]);
          });
          const free=s.tasks.filter(t=>!claimed.has(t));
          const lined=rest.length===free.length
            && new Set(rest.map(([it,i])=>pos(it,i))).size===rest.length
            && rest.every(([it,i])=>free.includes(s.tasks[pos(it,i)]));
          rest.forEach(([it,i])=>{
            const t=s.tasks[pos(it,i)];
            if(t&&!claimed.has(t))take(t,it,lined);
          });
          s.tasks.forEach(t=>{if(!claimed.has(t))t.base={done:!!t.done,na:!!t.na,note:t.note||''};});
        }
        /* Baseline: exactly the fields SharePoint owns, as they arrived. Divergence
           is a diff against this rather than a flag, so the same structure answers
           "has this pool been edited here" and "what would a write-back send".
           fixtures/planner/freshness.js pins the exact key set of this object;
           extend that assertion if a key is ever deliberately added here. inst
           and pm are in it (see the note beside them below), but only
           buildSignoffSet reads them -- the scheduling diff never does.
           `locked` stays the DERIVED lock (SharePoint's Locked OR sign-off) that
           divergedSecs and Auto-Schedule both already key off; `spLocked` is the
           raw SharePoint Locked value on its own, kept alongside so a later
           write-back can tell a PM's deliberate pin apart from a lock this planner
           inferred from sign-off -- the two read identically through `locked`.
           `seq` (the row's SharePoint Sequence) rides along for the write-back:
           it is never diffed or written itself, just carried onto a change-set
           entry so a reflow can order writes and a conflict report can be read
           against the row the way a PM does, by sub-phase. */
        s.base={id:is.id??null,seq:is.seq??null,crewId:s.crewId??null,start:s.start??null,
                days:s.days??null,locked:!!s.locked,skip:!!s.skip,
                spLocked:!!is.locked,
                /* inst/pm added 2026-09-16. freshness.js fences this key set
                   deliberately, and the fence's reasoning was that the planner
                   held sign-off as a BARE BOOLEAN -- no attribution, no
                   timestamp -- so writing it back would replace an attested
                   sign-off with a flag. The planner now has a signed-in user and
                   resolveSiteUserId, so it writes who and when. The precondition
                   the fence protected is satisfied rather than overridden. */
                inst:!!s.inst, pm:!!s.pm};
      });
    });
    plan.forEach(({inj})=>{const j=S.jobs.find(x=>String(x.jobno)===String(inj.jobno));if(j)delete j.touchedAt;});
    // A pending create resolves itself the moment the real pool comes back --
    // no reason to keep telling a PM they are waiting on a request SharePoint already
    // finished. Whether it was ever pushed (requestedAt set) or is still only
    // queued here, the real pool having arrived is what matters.
    if(S.pendingCreates&&S.pendingCreates.length){
      const arrived=new Set(d.jobs.map(inj=>String(inj.jobno)));
      S.pendingCreates=S.pendingCreates.filter(c=>!arrived.has(String(c.jobno)));
    }

    // The people a job can be assigned to, for the + Job PM picker. Only the
    // Graph path supplies it; a file import leaves the last good list alone.
    if(Array.isArray(d.people)&&d.people.length)S.people=d.people;

    if(leaving.length) S.jobs=S.jobs.filter(j=>!leaving.includes(j));
    // A file export carries no completed list; keep the last good one rather than blanking it.
    if(Array.isArray(d.completedJobs)) S.completedJobs=d.completedJobs;

    sortJobsByNumber();

    // A Refresh re-centres the timeline and unfolds the board, but a PM who
    // filtered to their own jobs asked for that view and keeps it.
    save(); UI={collapsed:{},tlScroll:{},pmFilter:UI.pmFilter,signoffJob:UI.signoffJob,boardJob:UI.boardJob,boardStatus:UI.boardStatus}; render();
    /* The routine summary is skipped on a silent re-read -- that runs straight
       after a Save, and a "Schedule loaded" modal stacked on top of the save
       results is noise the PM did not ask for.
       Unmatched sub-phases are NOT skipped even then. That means the phase
       template here disagrees with SharePoint, which is exactly the condition
       under which a push may have been aimed at the wrong rows, so it is worth
       interrupting for however the load was triggered. */
    if(unmatched.length){
      alert(unmatched.length+' sub-phase(s) in the schedule matched nothing in this phase template:\n'+
        unmatched.slice(0,8).join(', ')+(unmatched.length>8?' ...':'')+
        '\n\nThat means the template here is out of step with SharePoint.');
    }else if(!silent){
      alert('Schedule loaded.\n\n'+updated+' updated, '+added+' added, '+untouched+' left alone.');
    }
}

/* ============================== save / write-back ==============================
   The exact inverse of importFromD2 above: instead of merging a SharePoint
   export in, this builds the file sharepoint/apply-planner-changes.js reads to
   push edits back out. It never talks to SharePoint itself -- this only ever
   downloads a file, the same arrangement export-to-planner.js already has on
   the read side.

   FIELD SCOPE IS AN ALLOWLIST, not a convention. WRITEBACK_FIELDS (above,
   next to divergedSecs) is the only place a field can enter a change-set.
   Sign-off, notes and every Tasks-list field are never candidates -- adding
   one would also have to survive fixtures/planner/freshness.js's assertion on
   s.base's key set and fixtures/planner/writeback.js's assertion on what a
   change-set may carry. */
function buildChangeSet(){
  const pools=[];
  S.jobs.forEach(j=>{
    if(!poolHasBaseline(j)||frozen(j))return;   // a local sketch, a project still being built, or a read-only one: never pushed
    const secs=[];
    allSecs(j).forEach(({s})=>{
      if(!s.base)return;             // unmatched against the template -- nothing to diff
      const diffs=secFieldDiffs(s);
      if(!diffs.length)return;
      const fields={};
      diffs.forEach(d=>{fields[d.col]={from:d.from,to:d.to};});
      secs.push({id:s.base.id,seq:s.base.seq??null,num:s.num,name:s.name,fields});
    });
    if(secs.length)pools.push({jobno:j.jobno,name:j.name,sections:secs});
  });
  return pools;
}
/* Project start dates that diverged from what was loaded. One field on the
   Jobs list, written with its own compare-before-write against the loaded
   value. A project still being built, or one never loaded, has nothing here. */
function buildJobStartChanges(){
  const out=[];
  S.jobs.forEach(j=>{
    if(!poolHasBaseline(j)||frozen(j)||!j.baseStart)return;
    if(j.start&&j.start!==j.baseStart)out.push({jobno:j.jobno,name:j.name,from:j.baseStart,to:j.start});
  });
  return out;
}
/* Which queued pool requests have never yet been included in a downloaded
   change-set -- what a PM has raised here but not yet pushed. A create that
   HAS been pushed (requestedAt set, by confirmSaveChangeSet below) is never
   re-offered by a later Save; it is surfaced instead on the Jobs tab as
   "waiting on SharePoint" until the real pool comes back through Refresh, which
   clears the pendingCreates entry entirely (see importFromD2). This is a
   wholly separate path to a wholly different list (New Pool Requests, never
   Assignments) and is never subject to the five-field WRITEBACK_FIELDS
   allowlist above -- that allowlist governs edits to an existing row, not the
   creation of a new one. */
function buildPendingCreates(){
  return (S.pendingCreates||[]).filter(c=>!c.requestedAt)
    .map(c=>({jobno:c.jobno,name:c.name,addr:c.addr||'',city:c.city||'',start:c.start,
      assignDefaultCrews:!!c.assignDefaultCrews}));
}
/* ---------------------------- pushing to SharePoint ----------------------------
   Save has two endings. When this page can reach Graph it pushes directly; from
   a downloaded copy on file:// it falls back to writing the change-set out for
   sharepoint/apply-planner-changes.js, which is the route that existed first and
   is deliberately kept working. The preview in between is identical either way,
   because the preview is itself a safety property: the PM sees the loaded value
   beside the new one, per field, before anything moves. */

/* Is the baseline we are about to diff against old enough to be worth stopping
   for? Compare-before-write means anything changed in SharePoint since the load
   comes back as a refusal, and a screenful of refusals reads like a broken tool
   rather than like a stale baseline. Deliberately generous: loading in the
   morning and pushing after lunch is normal PM behaviour and must not nag,
   while a baseline from an earlier day is worth a word even ninety minutes
   later, because "yesterday's schedule" is a different thing from "six hours
   ago". */
const STALE_HOURS=4;
function saveStaleness(nowMs){
  const at=S.settings&&S.settings.loadedAt;
  if(!at) return {stale:false,hours:null,loadedAt:null};
  const t=Date.parse(at), hours=(nowMs-t)/3600000;
  const earlierDay=new Date(t).toDateString()!==new Date(nowMs).toDateString();
  return {stale:hours>STALE_HOURS||earlierDay, hours, loadedAt:at};
}

/* Push the confirmed change-set. Returns everything the results dialog needs,
   including siteId and the token so the create path can reuse them rather than
   resolving the site a second time. */

/* ============ sign-off and task ticks: what changed since the last Refresh ====
   Separate from buildChangeSet, which carries scheduling fields only. Sign-off
   cannot ride the plain-field path: setting it writes a Person column and a
   timestamp, and clearing it is a Reopen that has to leave a trace.

   One structure feeds both planners -- planSignoffs reads inst/pm/counters,
   planTaskTicks reads tasks -- so a sub-phase is described once. */
function buildSignoffSet(){
  const pools=[];
  S.jobs.forEach(j=>{
    if(!poolHasBaseline(j)||frozen(j))return;          // a local sketch has nothing to diff against; a half-built or read-only one is closed
    const sections=[];
    allSecs(j).forEach(({s})=>{
      if(!s.base||s.base.id==null)return;
      /* A queued reject carries the sign-off change itself: its PATCH clears
         the sign-off and writes the one audit line. Sending the on-screen
         Installer un-tick as well would land first as a plain reopen, and the
         rejection would then be refused as not-signed. The section still rides
         along, flagged, so ticks that fix the problem are not refused. */
      const rejecting=rejectingIds().has(String(s.base.id));
      const instChanged = !rejecting && !!s.inst !== !!s.base.inst;
      const pmChanged   = !!s.pm   !== !!s.base.pm;
      const tasks=(s.tasks||[])
        .filter(t=>t.base && (!!t.done!==!!t.base.done || !!t.na!==!!t.base.na))
        .map(t=>({id:t.spId==null?null:t.spId, title:t.t,
                  from:{done:!!t.base.done,na:!!t.base.na,note:t.base.note||''},
                  to:{done:!!t.done,na:!!t.na,note:t.note||''}}));
      if(!instChanged && !pmChanged && !tasks.length && !rejecting)return;
      const c=secCounts(s);
      sections.push({
        id:s.base.id, num:s.num, name:s.name, rejecting,
        inst: instChanged?{from:!!s.base.inst,to:!!s.inst}:null,
        pm:   pmChanged  ?{from:!!s.base.pm,  to:!!s.pm  }:null,
        /* Counters only when ticks moved. Writing them on a bare sign-off would
           overwrite whatever the nightly sweep last computed with a number this
           screen happens to hold. */
        counters: tasks.length?{done:c.done,total:c.n}:null,
        tasks
      });
    });
    if(sections.length)pools.push({jobno:j.jobno,name:j.name,sections});
  });
  return pools;
}
const signoffChangeCount=pools=>pools.reduce((n,p)=>n+p.sections.reduce(
  (m,s)=>m+(s.inst?1:0)+(s.pm?1:0)+s.tasks.length,0),0);

/* The queued comment work, grouped the way planRejections wants it. Entries
   whose pool or sub-phase is no longer here are dropped: a Refresh can remove
   a pool, and an entry with nowhere to land would otherwise sit in the queue
   forever being counted. */
function buildRejectionSet(){
  const pools=[];
  (S.pendingComments||[]).forEach(e=>{
    const j=S.jobs.find(x=>String(x.jobno)===String(e.jobno));
    if(!j||!poolHasBaseline(j)||frozen(j))return;
    const hit=allSecs(j).find(({s})=>s.base&&String(s.base.id)===String(e.secId));
    if(!hit)return;
    let p=pools.find(x=>x.jobno===j.jobno);
    if(!p){p={jobno:j.jobno,name:j.name,sections:[]};pools.push(p);}
    let sec=p.sections.find(x=>String(x.id)===String(e.secId));
    if(!sec){sec={id:String(e.secId),num:hit.s.num,name:hit.s.name,actions:[]};p.sections.push(sec);}
    sec.actions.push({localId:e.localId,kind:e.kind,body:e.body});
  });
  return pools;
}
const rejectionChangeCount=pools=>pools.reduce((n,p)=>
  n+p.sections.reduce((m,s)=>m+s.actions.length,0),0);
/* Which SharePoint rows this Save rejects, so the sign-off pass leaves their
   sign-off to the rejection and planTaskTicks treats them as reopened. */
function rejectingIds(){
  const out=new Set();
  (S.pendingComments||[]).forEach(e=>{if(e.kind==='reject')out.add(String(e.secId));});
  return out;
}
const REJ_KIND_WORD={reject:'Reject sign-off',resolve:'Mark resolved',comment:'Comment'};
const REJ_WHY={
  'not-signed':'the sub-phase is no longer signed off',
  'already-rejected':'it is already rejected',
  'not-rejected':'it is not currently rejected',
  'reason-required':'a reason is required',
  'body-required':'a comment cannot be empty',
  'row-missing':'that sub-phase is no longer in SharePoint',
  'identity-mismatch':'that row is a different sub-phase now, so nothing was written',
  'unknown-kind':'this entry could not be read, so nothing was written'
};

/* Comments, rejections and resolutions. Takes the same fresh Assignments read
   pushChangeSet already did; that pass writes scheduling columns only, none of
   which this compares. Runs before the sign-off pass: see confirmSaveByPush. */
async function pushRejections(siteId,tok,liveById,pools){
  const G=window.D2GraphWriteback, C=window.D2WritebackCore;
  const acct=graphPca().getActiveAccount()||graphPca().getAllAccounts()[0];
  const userName=(acct&&(acct.name||acct.username))||'the planner';
  const uil=await graphPageAll(G.urls(siteId).userInfo,tok).catch(()=>[]);
  const userNamesById={};
  uil.forEach(r=>{if(r.fields&&r.fields.Title)userNamesById[String(r.fields.id)]=r.fields.Title;});

  const rPlan=C.planRejections(pools,liveById,
    {userName,userNamesById,nowIso:new Date().toISOString(),nowMs:Date.now(),suppressMinutes:10});
  const rRes=await G.applyRejectionOps(
    {token:tok,siteId,asgListId:D2_GRAPH.lists.asg,commentsListId:D2_GRAPH.commentsList},
    rPlan.ops);

  /* Clear only what landed. A refused or failed entry stays queued so the PM
     can see why and retry, rather than losing what they typed. */
  const gone=new Set(rRes.done.map(d=>String(d.localId)));
  S.pendingComments=(S.pendingComments||[]).filter(e=>!gone.has(String(e.localId)));
  save();
  return {rPlan,rRes};
}

/* Writes sign-off and ticks. Takes the site id, token and the Assignments rows
   pushChangeSet already read, so the compare-before-write here is against the
   same fresh read rather than a second one that could disagree with it. */
async function pushSignoffs(siteId,tok,liveById,pools){
  const G=window.D2GraphWriteback, C=window.D2WritebackCore, U=G.urls(siteId);

  /* Who is signing. Exactly one match or refuse -- an unattributed sign-off is
     the precise thing this whole path exists to avoid writing. */
  const acct=graphPca().getActiveAccount()||graphPca().getAllAccounts()[0];
  const uil=await graphPageAll(U.userInfo,tok);
  const who=G.resolveSiteUserId(uil.map(r=>r.fields),acct&&acct.username);
  const userName=(acct&&(acct.name||acct.username))||'the planner';

  /* Display names by site-user id, so a Reopen can say who HAD signed, the
     same as D2 - Reopen Sign-off does from the field app. */
  const userNamesById={};
  uil.forEach(r=>{if(r.fields&&r.fields.Title)userNamesById[String(r.fields.id)]=r.fields.Title;});

  const wantTaskIds=new Set(), sectionsById={};
  pools.forEach(p=>p.sections.forEach(s=>{
    sectionsById[String(s.id)]=s;
    s.tasks.forEach(t=>{if(t.id!=null)wantTaskIds.add(String(t.id));});
  }));

  /* Every live task row of every sub-phase in play, not just the changed ones:
     the counters are recounted from these after the ticks land. */
  let liveTaskById={}; const liveRowsByAsg={};
  if(wantTaskIds.size){
    /* Only the Tasks of the sub-phases in play, by an `or` chain of their ids (Spec A). */
    const R=window.D2GraphToPlanner;
    const parts=await Promise.all(R.taskUrls(U.items(D2_GRAPH.lists.tasks),Object.keys(sectionsById),R.TASK_CHAIN_MAX)
      .map(u=>graphPageAll(u,tok)));
    const trows=[].concat(...parts);
    trows.forEach(r=>{
      const id=String(r.fields.id), asg=String(r.fields.AssignmentLookupId);
      if(wantTaskIds.has(id))liveTaskById[id]=r.fields;
      if(sectionsById[asg])(liveRowsByAsg[asg]=liveRowsByAsg[asg]||[]).push(r.fields);
    });
  }

  const opts={userLookupId:who.id||null,userName,userNamesById,nowIso:new Date().toISOString()};
  const sPlan=C.planSignoffs(pools,liveById,opts);
  const tPlan=C.planTaskTicks(pools,liveTaskById,Object.assign({liveAsgById:liveById},opts));

  /* Ticks FIRST, then the assignment row. TasksComplete has to describe the
     rows as they are after this save, so it is recounted from the live rows
     with only the ticks that actually landed. Taken from this screen's own
     count instead, one refused tick left the counter disagreeing with the
     rows until the nightly sweep repaired it. */
  const tRes=await G.applyWrites({token:tok,siteId,listId:D2_GRAPH.lists.tasks},tPlan.writes);
  C.settleCounters(sPlan.writes,sectionsById,liveRowsByAsg,tRes.written.map(w=>w.id));

  /* Assignments writes carry the suppression stamp; Tasks writes must not --
     that column does not exist on the Tasks list. */
  const stamp=C.suppressUntil(Date.now(),10);
  sPlan.writes.forEach(w=>{w.suppressUntil=stamp;});

  const sRes=await G.applyWrites({token:tok,siteId,listId:D2_GRAPH.lists.asg},sPlan.writes);
  return {sPlan,tPlan,sRes,tRes};
}

/* The Assignments rows of the projects named, read fresh, one filtered read per project.
   A project held from before Spec A has no spId until its next Refresh; then the whole list is
   read as it always was, so a Save is never refused for want of an id. */
async function readAsgForJobs(siteId,tok,jobnos){
  const G=window.D2GraphWriteback, R=window.D2GraphToPlanner;
  const items=G.urls(siteId).items(D2_GRAPH.lists.asg);
  const jobs=[...new Set(jobnos.map(String))].map(no=>S.jobs.find(j=>String(j.jobno)===no));
  if(jobs.some(j=>!j||!j.spId)) return graphPageAll(items+'?$expand=fields&$top=500',tok);
  const parts=await Promise.all(jobs.map(j=>graphPageAll(R.asgUrl(items,j.spId),tok)
    .then(rows=>rows.filter(r=>String(r.fields.JobLookupId)===String(j.spId)))));
  return [].concat(...parts);
}

async function pushChangeSet(pools,alsoJobnos){
  const tok=await graphToken();
  const G=window.D2GraphWriteback, C=window.D2WritebackCore;
  const siteId=(await graphSite(tok)).id;

  /* Re-read the rows immediately before writing. Compare-before-write is only
     as good as the freshness of THIS read, not of the last Refresh. Only the
     projects this Save touches are read: the edits here, plus the sign-off and
     rejection passes that reuse this read. */
  const jobnos=pools.map(p=>p.jobno).concat(alsoJobnos||[]);
  const rows=jobnos.length?await readAsgForJobs(siteId,tok,jobnos):[];
  const liveById={};
  rows.forEach(r=>{liveById[String(r.fields.id)]=r.fields;});

  /* finishFor: every start or duration write also sends ScheduledFinish, on
     this page's work calendar, because every flow reads the finish. */
  const plan=C.planEdits(pools,liveById,{nowMs:Date.now(),suppressMinutes:10,
    finishFor:(st,d)=>workSpan(st,d).pop()});
  const res=await G.applyWrites({token:tok,siteId,listId:D2_GRAPH.lists.asg},plan.writes);
  return {plan,res,siteId,tok,liveById};
}

/* Same fresh-read discipline as pushChangeSet, on the Jobs list. The row is
   found by JobNumber, exactly as Activate finds it; the live StartDate must
   still read what was loaded or the write is refused with both values. No
   suppression stamp: Jobs has no such column, and sending one fails the PATCH. */
async function pushJobStarts(siteId,tok,changes){
  const G=window.D2GraphWriteback;
  const rows=await graphPageAll(G.urls(siteId).items(D2_GRAPH.lists.jobs)+'?$expand=fields&$top=500',tok);
  const key=v=>String(v==null?'':v).trim().toLowerCase();
  const writes=[],refusals=[],errors=[];
  (changes||[]).forEach(c=>{
    const row=rows.find(r=>key(r.fields.JobNumber)===key(c.jobno));
    if(!row){errors.push({jobno:c.jobno,reason:'row-missing'});return;}
    const live=String(row.fields.StartDate||'').slice(0,10)||null;
    if(live!==c.from){refusals.push({jobno:c.jobno,col:'StartDate',reason:'diverged',loaded:c.from,nowLive:live,wanted:c.to});return;}
    writes.push({id:String(row.fields.id),jobno:c.jobno,num:'',fields:{StartDate:c.to}});
  });
  const res=await G.applyWrites({token:tok,siteId,listId:D2_GRAPH.lists.jobs},writes);
  return {plan:{writes,refusals,errors},res};
}

function downloadChangeSet(pools,creates){
  const stamp=fmt(new Date());
  const payload={app:'D2 Pool Build Scheduler',kind:'d2-planner-changeset',
    generated:new Date().toISOString(),pools,creates:creates||[]};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,1)],{type:'application/json'}));
  a.download='d2-planner-changes-'+stamp+'.json';
  a.click();
}
const WB_FIELD_LABEL={Crew:'Crew',ScheduledStart:'Start date',DurationDays:'Duration (days)',
  Locked:'Locked',NotApplicable:'Not applicable',ScheduledFinish:'Finish date'};
const wbLabel=col=>WB_FIELD_LABEL[col]||col;
function wbFmt(col,v){
  if(v==null||v==='')return '—';
  if(col==='Crew'){const c=crew(v);return c?c.name:v;}
  if(col==='ScheduledStart')return pretty(v);
  if(col==='Locked'||col==='NotApplicable')return v?'Yes':'No';
  return String(v);
}
let PENDING_CHANGESET=null, PENDING_CREATES=null, PENDING_SIGNOFFS=null, PENDING_REJECTIONS=null, PENDING_JOBSTARTS=null;
/* The preview a PM must confirm before anything downloads. Grouped by pool,
   one line per changed field, naming the field and the loaded value next to
   the new one -- a count is not enough to see "this is about to move 46
   rows" before it happens. Pending pool requests are their own clearly
   labelled section, separate from field edits: "1 new pool will be
   requested" is a different kind of change than "12 sub-phases will be
   updated" -- one is a two-phase, 10-20 minute round trip through
   D2 - New Pool, the other lands immediately. */
function openSavePreview(){
  const pools=buildChangeSet();
  const creates=buildPendingCreates();
  const sops=graphModeAvailable()?buildSignoffSet():[];   // file:// has no way to write these
  const soCount=signoffChangeCount(sops);
  const rops=graphModeAvailable()?buildRejectionSet():[];
  const rCount=rejectionChangeCount(rops);
  const jobStarts=graphModeAvailable()?buildJobStartChanges():[];   // the console applier cannot write Jobs
  const totalSecs=pools.reduce((n,p)=>n+p.sections.length,0);
  if(!totalSecs&&!creates.length&&!soCount&&!rCount&&!jobStarts.length){alert('Nothing to push -- no pool has changed here since the last Refresh, and no new pool is queued.');return;}
  const skipped=S.jobs.filter(j=>!poolHasBaseline(j));
  const canPush=graphModeAvailable();
  const st=saveStaleness(Date.now());
  document.getElementById('dTitle').textContent='Save changes';
  document.getElementById('dBody').innerHTML=
    (canPush&&st.stale?`<div class="hint" style="padding:0 0 11px;color:#a84a18">
      <strong>This schedule was loaded ${esc(freshStamp(st.loadedAt))}.</strong>
      Anything changed in SharePoint since then will be refused rather than overwritten,
      so you may see refusals below rather than a clean push. Refresh first if you want to
      be sure you are working from the current schedule.</div>`:'')+
    `<div class="hint" style="padding:0 0 11px">
      ${totalSecs?`${totalSecs} sub-phase${totalSecs===1?'':'s'} across ${pools.length} pool${pools.length===1?'':'s'} will be updated. `:''}
      ${creates.length?`${creates.length} new pool${creates.length===1?'':'s'} will be requested. `:''}
      ${canPush
        ? `This writes to SharePoint straight away. Anything changed there since you loaded
           is refused rather than overwritten, and you will see exactly what landed.`
        : `This only downloads a file — nothing is sent until that file is applied with
           <span class="mono">sharepoint/apply-planner-changes.js</span>.`}
      ${skipped.length?`<br><br>${skipped.length} pool${skipped.length===1?'':'s'} sketched only in this browser `

      <table><tbody>${creates.map(c=>`<tr><td class="small"><b>${esc(c.jobno)}</b></td>

    (jobStarts.length?`<div class="fld"><label>Project start dates (${jobStarts.length})</label>
      <div class="hint" style="padding:0 0 6px">Written to the Jobs list, so the project's own start matches its first sub-phase.</div>
      <table><tbody>${jobStarts.map(c=>`<tr><td class="small"><b>${esc(c.jobno)}</b> ${esc(c.name)}</td><td class="small muted">Start</td>
        <td class="small">${esc(pretty(c.from))}</td><td class="small muted">→</td><td class="small"><b>${esc(pretty(c.to))}</b></td></tr>`).join('')}
      </tbody></table></div>`:'')+
    pools.map(p=>`<div class="fld"><label>${esc(p.jobno)} · ${esc(p.name)} — ${p.sections.length} sub-phase${p.sections.length===1?'':'s'}</label>
      <table><tbody>${p.sections.map(sec=>Object.keys(sec.fields).map(col=>
        `<tr><td class="small">${esc(sec.num)} ${esc(sec.name)}</td>
             <td class="small muted">${WB_FIELD_LABEL[col]||col}</td>
             <td class="small">${esc(wbFmt(col,sec.fields[col].from))}</td>
             <td class="small muted">→</td>
             <td class="small"><b>${esc(wbFmt(col,sec.fields[col].to))}</b></td></tr>`).join('')).join('')}
      </tbody></table></div>`).join('');
  /* The label counts what will actually be written. It counted scheduling edits
     only, so a save carrying nothing but sign-offs read "Save 0 edits to
     SharePoint" -- a button that says it will do nothing, pressed to do
     something. */
  const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
  const pushParts=[];
  if(totalSecs)pushParts.push(plural(totalSecs,'schedule edit'));
  if(soCount)pushParts.push(plural(soCount,'sign-off and checklist change'));
  if(rCount)pushParts.push(`${rCount} ${rCount===1?'comment or rejection':'comments and rejections'}`);
  if(jobStarts.length)pushParts.push(plural(jobStarts.length,'project start'));
  const pushLabel=pushParts.length
    ? `Save ${pushParts.join(' and ')} to SharePoint`+(creates.length?` and request ${plural(creates.length,'new pool')}`:'')
    : `Request ${plural(creates.length,'new pool')}`;
  document.getElementById('dFoot').innerHTML=
    `<button class="btn p" onclick="confirmSaveChangeSet()">`
      +(canPush
        ? pushLabel
        : `Download change-set (${plural(totalSecs,'edit')}`
          +(creates.length?', '+plural(creates.length,'new pool'):'')+')')
      +`</button>
     <button class="btn" onclick="closeDrawer()">Cancel</button>`;
  PENDING_CHANGESET=pools;
  PENDING_CREATES=creates;
  PENDING_SIGNOFFS=sops;
  PENDING_REJECTIONS=rops;
  PENDING_JOBSTARTS=jobStarts;
  document.getElementById('drawer').classList.add('open');
}
/* Save's two endings. Graph mode writes; otherwise the change-set downloads
   for the console applier, exactly as before. */
function confirmSaveChangeSet(){
  return graphModeAvailable()?confirmSaveByPush():confirmSaveByDownload();
}

/* Raise a New Pool Requests row per queued create.
   Wholly separate from the edit path: a different list, a different shape, and
   NOT subject to the five-field allowlist, which governs edits to an existing
   row rather than the creation of a new one. */
async function pushCreates(siteId,tok,creates){
  const G=window.D2GraphWriteback, C=window.D2WritebackCore;
  const U=G.urls(siteId);

  /* Resolve the signed-in user to a SharePoint site-user id. Exactly one match
     or refuse: a blank Person column is accepted on write and then fails inside
     D2 - New Pool about sixteen minutes later, which reads as the tool hanging.
     The UPN comes from the MSAL account because this token is scoped to
     Sites.ReadWrite.All and cannot call /me. */
  /* A PM picked on + Job is used as-is; the signed-in person is resolved only
     for a request queued without one (no people loaded yet, or one queued
     before the picker existed). */
  let whoId=null;
  if(creates.some(c=>!c.pmId)){
    const acct=graphPca().getActiveAccount()||graphPca().getAllAccounts()[0];
    const uil=await graphPageAll(U.userInfo,tok);
    const who=G.resolveSiteUserId(uil.map(r=>r.fields),acct&&acct.username);
    if(!who.id) throw new Error(who.ambiguous
      ? 'Your sign-in matches more than one SharePoint account, so the project manager cannot be set safely. No pool was requested.'
      : 'Could not identify your SharePoint account, so the project manager cannot be set. No pool was requested.');
    whoId=who.id;
  }

  /* Uniqueness spans live Jobs AND requests still Requested or Building. The
     documented wait actively trains a re-run, because a request sits at
     Building for about a quarter of an hour and looks stuck. */
  const jobs=await graphPageAll(U.items(D2_GRAPH.lists.jobs)+'?$expand=fields&$top=500',tok);
  const reqs=await graphPageAll(U.items(D2_GRAPH.lists.req)+'?$expand=fields&$top=500',tok);
  const pending=reqs.map(r=>r.fields)
    .filter(f=>f.Status==='Requested'||f.Status==='Building').map(f=>f.JobNumber);
  const plan=C.planCreates(creates,jobs.map(r=>r.fields.JobNumber),pending);

  const created=[],failed=[];
  for(const c of plan.creates){
    const r=await fetch(U.items(D2_GRAPH.lists.req),
      {method:'POST',headers:G.headers(tok),body:JSON.stringify({fields:G.createBody(c,c.pmId||whoId)})});
    if(r.ok) created.push(c.jobno);
    else failed.push({jobno:c.jobno,status:r.status});
  }
  return {created,refused:plan.refusals,failed};
}

async function confirmSaveByPush(){
  const pools=PENDING_CHANGESET||[], creates=PENDING_CREATES||[];
  document.getElementById('dFoot').innerHTML='<span class="hint">Saving…</span>';
  let out=null,err=null;
  try{
    out=await pushChangeSet(pools,[...(PENDING_SIGNOFFS||[]),...(PENDING_REJECTIONS||[])].map(p=>p.jobno));
    /* Project start dates, on the Jobs list, one field with its own compare. */
    if(PENDING_JOBSTARTS&&PENDING_JOBSTARTS.length){
      try{ out.js=await pushJobStarts(out.siteId,out.tok,PENDING_JOBSTARTS); }
      catch(e){ out.jsError=e; }
    }
    /* Rejections go BEFORE sign-off and ticks. A tick on a sub-phase SharePoint
       holds as signed is allowed only because this Save reopens it; if the
       rejection does not land, the row is still signed, so its section loses
       the rejecting flag here and planTaskTicks refuses those ticks rather than
       writing under a live sign-off. A PATCH that landed counts even when the
       comment POST after it failed: the sign-off was cleared. */
    if(PENDING_REJECTIONS&&PENDING_REJECTIONS.length){
      try{ out.rj=await pushRejections(out.siteId,out.tok,out.liveById,PENDING_REJECTIONS); }
      catch(e){ out.rjError=e; }
      const rejectedIds=new Set();
      if(out.rj){
        out.rj.rRes.done.forEach(d=>{if(d.kind==='reject')rejectedIds.add(String(d.id));});
        out.rj.rRes.failed.forEach(f=>{if(f.kind==='reject'&&f.patched)rejectedIds.add(String(f.id));});
      }
      (PENDING_SIGNOFFS||[]).forEach(p=>p.sections.forEach(s=>{
        if(s.rejecting&&!rejectedIds.has(String(s.id)))s.rejecting=false;
      }));
    }
    /* Same Save, same fresh read. A separate pass rather than a separate button:
       a PM who ticks a checklist and moves a date has done one piece of work. */
    if(PENDING_SIGNOFFS&&PENDING_SIGNOFFS.length){
      try{ out.so=await pushSignoffs(out.siteId,out.tok,out.liveById,PENDING_SIGNOFFS); }
      catch(e){ out.soError=e; }
    }
    if(creates.length){
      try{ out.creates=await pushCreates(out.siteId,out.tok,creates); }
      catch(e){ out.createError=e; }
    }
  }catch(e){ err=e; }

  /* Only creates that actually landed are marked requested. Marking one that
     was refused would hide it from every later Save. */
  if(out&&out.creates&&out.creates.created.length){
    const now=new Date().toISOString();
    out.creates.created.forEach(jobno=>{
      const pc=(S.pendingCreates||[]).find(x=>x.jobno===jobno&&!x.requestedAt);
      if(pc)pc.requestedAt=now;
    });
    save();
  }
  showPushResult(out,err);
  /* Re-read after a successful write: it resets every baseline, picks up what
     the flows did in the meantime, and means the next Save diffs against
     something current rather than against what we just moved away from. */
  const anyWrite = out && (out.res.written.length
    || (out.js && out.js.res.written.length)
    || (out.so && (out.so.sRes.written.length || out.so.tRes.written.length))
    || (out.rj && out.rj.rRes.done.length));
  if(anyWrite){ try{ await loadFromD2ViaGraph(true); }catch(e){} }
}

/* A refusal nobody sees is silent data loss, so every one is named with both
   values: what we loaded, what is live now, and what was wanted. */
function showPushResult(out,err){
  const body=document.getElementById('dBody');
  document.getElementById('dTitle').textContent='Save results';
  if(err||!out){
    body.innerHTML=graphErrorHTML(err,'Nothing was written.');
  }else{
    const {plan,res}=out;
    const row=(a,b,c)=>`<tr><td class="small">${esc(a)}</td><td class="small">${esc(b)}</td><td class="small muted">${esc(c)}</td></tr>`;
    const sec=(label,rows,colour)=>rows.length
      ? `<div class="fld"><label${colour?` style="color:${colour}"`:''}>${esc(label)} (${rows.length})</label>
         <table><tbody>${rows.join('')}</tbody></table></div>` : '';
    /* Sign-off outcomes are reported beside the scheduling ones. A refusal
       nobody sees is silent data loss, and that is worse here than anywhere
       else on this screen: a PM who thinks they signed something off and did
       not has a gap in the record with their name missing from it. */
    const so=out.so;
    const soRows=so?[].concat(
      /* Say what changed in words a PM uses. A counters-only write is not a
         sign-off, and InstallerSignOffByLookupId means nothing to anyone. */
      so.sRes.written.map(w=>{
        const said=[...new Set(w.fields.map(f=>({InstallerSignOff:'installer sign-off',PMSignOff:'PM sign-off',
          SignOffNotes:'reopen noted',TasksComplete:'task counts',TasksTotal:'task counts'})[f]).filter(Boolean))];
        const isSign=w.fields.includes('InstallerSignOff')||w.fields.includes('PMSignOff');
        return row(w.jobno+' '+w.num,isSign?'sign-off':'checklist',said.join(', '));
      }),
      so.tRes.written.map(w=>row(w.jobno+' '+w.num,'checklist','task updated'))):[];
    const soBad=so?[].concat(
      so.sPlan.refusals.map(r=>row(r.jobno+' '+r.num,r.col,
        r.reason==='no-user'?'could not identify your SharePoint account, so nothing was signed'
        :`loaded ${r.loaded}, now ${r.nowLive}`)),
      so.tPlan.refusals.map(r=>row(r.jobno+' '+r.num,'task: '+(r.task||''),
        r.reason==='signed-off'?'signed off, so reopen it before changing the checklist'
        :'changed in SharePoint since you loaded')),
      so.sPlan.errors.map(e=>row(e.jobno+' '+e.num,'sign-off',e.reason)),
      so.tPlan.errors.map(e=>row(e.jobno+' '+e.num,'task: '+(e.task||''),
        ({'na-no-reason':'marked N/A without a reason, so nothing was written',
          'no-row-id':'could not be matched to its SharePoint row, so nothing was written',
          'row-missing':'no longer in SharePoint'})[e.reason]||e.reason)),
      so.sRes.failed.map(f=>row(f.jobno+' '+f.num,'sign-off','HTTP '+f.status)),
      so.tRes.failed.map(f=>row(f.jobno+' '+f.num,'task','HTTP '+f.status))):[];
    /* Comments and rejections, in words. A PATCH that landed with its comment
       then failing is named as such: the sign-off WAS cleared and the reason
       is on the row, only the thread entry is missing. */
    const rj=out.rj;
    const rjRef=x=>(x.jobno||'')+' '+(x.num||'');
    const rjById={}; if(rj)rj.rPlan.ops.forEach(o=>{rjById[String(o.localId)]=o;});
    const rjRows=rj?rj.rRes.done.map(d=>{const o=rjById[String(d.localId)]||{};
      return row(rjRef(o),REJ_KIND_WORD[d.kind]||d.kind,'saved');}):[];
    const rjBad=rj?[].concat(
      rj.rPlan.refusals.map(r=>row(rjRef(r),REJ_KIND_WORD[r.kind]||r.kind,REJ_WHY[r.reason]||r.reason)),
      rj.rPlan.errors.map(e=>row(rjRef(e),REJ_KIND_WORD[e.kind]||e.kind,REJ_WHY[e.reason]||e.reason)),
      rj.rRes.failed.map(f=>{const o=rjById[String(f.localId)]||{};
        return row(rjRef(o),REJ_KIND_WORD[f.kind]||f.kind,
          f.stage==='post'&&f.patched
            ?'sign-off cleared and reason recorded on the sub-phase, but the comment was not added (HTTP '+f.status+')'
            :'HTTP '+f.status);})):[];
    const js=out.js;
    const jsRows=js?js.res.written.map(w=>row(w.jobno,'project start','')):[];
    const jsBad=js?[].concat(
      js.plan.refusals.map(r=>row(r.jobno,'project start',
        `loaded ${pretty(r.loaded)}, now ${r.nowLive?pretty(r.nowLive):'blank'}, wanted ${pretty(r.wanted)}`)),
      js.plan.errors.map(e=>row(e.jobno,'project start',e.reason==='row-missing'?'no longer in SharePoint':e.reason)),
      js.res.failed.map(f=>row(f.jobno,'project start','HTTP '+f.status))):[];
    body.innerHTML=
      (out.jsError?`<div class="hint" style="color:#a84a18">Project start dates were not saved:
        ${esc(out.jsError.message||'unknown error')}</div>`:'')
     +sec('Project start saved',jsRows,'')
     +sec('Project start NOT saved — changed in SharePoint since you loaded',jsBad,'#a84a18')
     +(out.soError?`<div class="hint" style="color:#a84a18">Scheduling changes were saved, but
        sign-off and checklist changes were not: ${esc(out.soError.message||'unknown error')}</div>`:'')
     +(out.rjError?`<div class="hint" style="color:#a84a18">Comments and rejections were not saved:
        ${esc(out.rjError.message||'unknown error')}. They are still queued.</div>`:'')
     +sec('Comments and rejections saved',rjRows,'')
     +sec('Comments and rejections NOT saved (still queued)',rjBad,'#a84a18')
     +sec('Sign-off and checklist saved',soRows,'')
     +sec('Sign-off and checklist NOT saved',soBad,'#a84a18')
     +sec('Saved',res.written.map(w=>row(w.jobno+' '+w.num,w.fields.map(wbLabel).join(', '),'')))
     +sec('Refused — changed in SharePoint since you loaded',
          plan.refusals.map(r=>row(r.jobno+' '+r.num,wbLabel(r.col),
            r.reason==='diverged'?`loaded ${r.loaded}, now ${r.nowLive}, wanted ${r.wanted}`:r.reason)),'#a84a18')
     +sec('Skipped',plan.errors.map(e=>row(e.jobno+' '+e.num,e.reason,e.liveTitle||'')),'#a84a18')
     +sec('Failed',res.failed.map(f=>row(f.jobno+' '+f.num,'HTTP '+f.status,'')),'#a84a18')
     +(out.creates?sec('Pool requests raised',out.creates.created.map(j=>row(j,'requested','')))
        +sec('Pool requests refused',out.creates.refused.map(r=>row(r.jobno,r.reason,(r.missing||[]).join(', '))),'#a84a18')
        +sec('Pool requests failed',out.creates.failed.map(f=>row(f.jobno,'HTTP '+f.status,'')),'#a84a18')
        +(out.creates.created.length?`<div class="hint" style="padding:8px 0 0">
            Each request takes about 16 minutes, and one run stalled for six minutes in the
            middle. It sits at Building the whole time and looks stuck. Do not raise it again —
            use Refresh once it finishes.</div>`:''):'')
     +(out.createError?`<div class="hint" style="color:#a84a18;padding:8px 0 0">
          No pool was requested. ${esc(out.createError.message)}</div>`:'')
     +(!res.written.length&&!plan.refusals.length&&!plan.errors.length&&!res.failed.length&&!out.creates
       &&!soRows.length&&!soBad.length&&!out.soError&&!rjRows.length&&!rjBad.length&&!out.rjError
       &&!jsRows.length&&!jsBad.length&&!out.jsError
        ? '<div class="hint">Nothing needed saving.</div>':'');
  }
  document.getElementById('dFoot').innerHTML='<button class="btn p" onclick="closeDrawer()">Close</button>';
}

function confirmSaveByDownload(){
  const creates=PENDING_CREATES||[];
  downloadChangeSet(PENDING_CHANGESET||[],creates);
  // Mark these as pushed so a later Save never re-offers them -- they now
  // read as "waiting on D2" on the Jobs tab until the real pool comes back
  // through Refresh, which clears the pendingCreates entry entirely.
  const now=new Date().toISOString();
  creates.forEach(c=>{
    const pc=(S.pendingCreates||[]).find(x=>x.jobno===c.jobno&&!x.requestedAt);
    if(pc)pc.requestedAt=now;
  });
  PENDING_CHANGESET=null; PENDING_CREATES=null; PENDING_SIGNOFFS=null; PENDING_REJECTIONS=null; PENDING_JOBSTARTS=null;
  save();
  closeDrawer();render();
}

/* ============================== Graph read path ==============================
   Refresh reads live through Microsoft Graph when this page is served
   over http/https AND both MSAL and the mapping module are on the page;
   otherwise it falls back to the existing file picker, unchanged. That
   fallback is NOT a stopgap to remove later -- MSAL cannot complete a
   sign-in redirect back to a file:// URL, and a downloaded standalone copy
   of this planner still exists in the site's Documents library (see CLAUDE.md
   "THE PLANNER IS DISTRIBUTED AS A SHAREPOINT DOWNLOAD"). Since the Static Web
   App went live on 2026-09-14, graphModeAvailable() is TRUE for anyone using
   the hosted planner, which is the supported surface; the file picker now only
   runs for someone who opened a downloaded copy.

   The mapping from a Graph read to this planner's payload shape lives in
   web/graph-to-planner.js, loaded above via <script> as
   window.D2GraphToPlanner -- not duplicated here -- so the code this app
   runs and the code fixtures/planner/graph-read.js tests are the same file.
   MSAL itself is loaded from a vendored copy, never a CDN (see
   web/vendor/msal-browser.min.js and the <script> comment above); both live
   under web/, the Static Web Apps deploy root, and ship alongside this file.

   Popup, not redirect, for the sign-in: a redirect would navigate this page
   away and back, and unlike fixtures/planner/capture-graph.html (a one-shot
   capture tool with no state to lose) this planner has in-memory schedule
   state a PM may not have saved yet.

   THE POPUP LANDS ON /auth-redirect.html, NOT ON THIS PAGE, and that is what
   broke Refresh for four of six people at the 2026-09-17 training session.
   The Static Web Apps wall's session cookie is SameSite=Strict. When the user
   clicks anything on Microsoft's sign-in page (account picker, "Stay signed
   in?", MFA), the popup's trip back here counts as cross-site and the cookie
   is withheld, so the wall ran its own login inside the popup and the sign-in
   code in the URL was lost on the way. Entra had issued every one of them a
   token. auth-redirect.html is a blank page that staticwebapp.config.json
   leaves outside the wall, so the cookie no longer matters; MSAL reads the
   code off it from this window and closes it. See fixtures/planner/signin.js. */

  lists:{
    jobs:'ee0ecabf-2f11-458d-a9ea-641f76d10cc3',
    asg:'49ef7006-d3fe-40a7-a52f-c4c18545bd35',
    tasks:'22c45847-ff0d-417a-b53e-1ea018fbb6d3',
    cal:'d36758cf-9d27-4342-84e4-817f8dcfa2ba',
    // Written by + Job, and read on Refresh so a project whose request is
    // still Requested or Building is marked and closed to edits (j.building).
    req:'13331a5e-ea8e-4ab2-9276-db5b4f4d46bf'
  }
};
function graphModeAvailable(){
  return location.protocol!=='file:' &&
    typeof window.msal!=='undefined' && !!window.msal.PublicClientApplication &&
    typeof window.D2GraphToPlanner!=='undefined';
}
let D2_PCA=null;
/* Deliberately not named msal -- see capture-graph.html: naming the instance
   msal shadows the library's own global and every call below throws before
   anything useful happens. */
function graphPca(){
  if(!D2_PCA)D2_PCA=new window.msal.PublicClientApplication({
    auth:{clientId:D2_GRAPH.clientId,authority:D2_GRAPH.authority,
          redirectUri:location.origin+D2_GRAPH.redirectPath},
    cache:{cacheLocation:'sessionStorage'}
  });
  return D2_PCA;
}
/* Who the Static Web Apps wall already signed in, passed to Microsoft as a
   login hint so a browser holding several Microsoft accounts (a personal one,
   or a second D2 account) goes straight to the right one instead of showing a
   picker. Fetched once at page load, NOT inside the Refresh click: anything
   awaited before loginPopup risks the browser blocking the popup. Null when
   there is no wall (local dev), and then no hint is sent at all. */
let D2_LOGIN_HINT=null;
function fetchLoginHint(){
  if(!graphModeAvailable())return;
  fetch('/.auth/me').then(r=>r.ok?r.json():null).then(d=>{
    const u=d&&d.clientPrincipal&&d.clientPrincipal.userDetails;
    if(typeof u==='string'&&u.includes('@'))D2_LOGIN_HINT=u;
  }).catch(()=>{});
}
/* opts.interactive goes straight to the popup. Try again uses it: if a silent
   token just failed, awaiting it a second time before loginPopup can cost the
   popup its user gesture, and a blocked popup is the one failure Try again
   exists to get past. */
async function graphToken(opts){
  const pca=graphPca();
  const account=pca.getActiveAccount()||pca.getAllAccounts()[0];
  if(account&&!(opts&&opts.interactive)){
    try{
      const r=await pca.acquireTokenSilent({scopes:D2_GRAPH.scopes,account});
      return r.accessToken;
    }catch(e){/* falls through to an interactive sign-in below */}
  }
  const req={scopes:D2_GRAPH.scopes};
  if(D2_LOGIN_HINT)req.loginHint=D2_LOGIN_HINT;
  const r=await pca.loginPopup(req);
  pca.setActiveAccount(r.account);
  return r.accessToken;
}
function graphHttpError(msg,status){const e=new Error(msg);e.status=status;return e;}
/* The one site lookup, shared by Refresh, Save and Activate. The status rides
   on the error so explainGraphError can tell "this account has no access"
   apart from everything else. */
async function graphSite(tok){
  const r=await fetch('https://graph.microsoft.com/v1.0/sites/'+D2_GRAPH.siteHost+':'+D2_GRAPH.sitePath,
    {headers:{Authorization:'Bearer '+tok}});
  if(!r.ok)throw graphHttpError('Could not reach the SharePoint site (HTTP '+r.status+').',r.status);
  return r.json();
}
/* A sign-in or Graph failure as a sentence a PM can act on. Refresh, Save and
   Activate all use it, so an MSAL code is never the headline anywhere; it is
   still shown, small, for whoever gets asked to look. */
function explainGraphError(e){
  const code=(e&&e.errorCode)||'';
  const popups='Your browser blocked the Microsoft sign-in window. Allow pop-ups for this site '
    +'(look for the blocked pop-up icon at the right of the address bar), then press Try again.';
  const byCode={
    user_cancelled:'The Microsoft sign-in window was closed before it finished. Press Try again, '
      +'and if Microsoft asks which account to use, pick your D2 account.',
    popup_window_error:popups,
    empty_window_error:popups,
    monitor_window_timeout:'The Microsoft sign-in did not finish. Press Try again. If it happens again, '
      +'reload this page and press Refresh. Your edits are kept.',
    interaction_in_progress:'A Microsoft sign-in window is already open. Finish signing in there, '
      +'or close it and press Try again.'
  };
  if(byCode[code])return {text:byCode[code],code};
  if(e&&(e.status===401||e.status===403)){
    const acct=D2_PCA&&D2_PCA.getActiveAccount();
    const who=(acct&&acct.username)||D2_LOGIN_HINT;
    return {code:'HTTP '+e.status,
      text:(who?'You are signed in as '+who+', but SharePoint did not let that account open ':
                'SharePoint did not let your account open ')
        +'the D2 Build Scheduler site. If you were only just given access, it can take a while to '
        +'reach SharePoint; try again later. Otherwise ask for access to the D2 Build Scheduler site.'};
  }
  return {text:(e&&e.message)||'Unknown error.',code};
}
function graphErrorHTML(e,lead){
  const x=explainGraphError(e);
  return `<div class="hint" style="color:#a84a18;padding:0 0 8px">${lead?esc(lead)+' ':''}${esc(x.text)}</div>`
    +(x.code?`<div class="small muted">Details for support: ${esc(x.code)}</div>`:'');
}
/* A Refresh that fails says why and offers Try again. It used to alert a raw
   MSAL error and then open the file picker, which on the hosted site asks for a
   .json nobody has -- the "broken state" every failed PM was left in on
   2026-09-17. The file picker is for a downloaded copy only. */
function showLoadProblem(e){
  document.getElementById('dTitle').textContent='Could not load the schedule';
  document.getElementById('dBody').innerHTML=graphErrorHTML(e,'');
  document.getElementById('dFoot').innerHTML=
    `<button class="btn p" onclick="refreshLive(true)">Try again</button>
     <button class="btn" onclick="closeDrawer()">Close</button>`;
  document.getElementById('drawer').classList.add('open');
}
function refreshLive(interactive){
  closeDrawer();
  return loadFromD2ViaGraph(false,{interactive:!!interactive}).catch(showLoadProblem);
}
// Page through a Graph collection. Tasks is 885 rows today and grows by 295
// per pool, so following @odata.nextLink is never optional -- see
// capture-graph.html, which paid for this once already.
async function graphPageAll(url,tok){
  let out=[];
  while(url){
    /* Graph answers a burst with 429 (or 503) and a Retry-After. A Refresh now makes a couple of
       reads per live project, so one throttled read is retried, twice at most, rather than failing
       the whole Refresh. A read that still fails throws: a partial schedule is worse than none. */
    let r, tries=0;
    for(;;){
      r=await fetch(url,{headers:{Authorization:'Bearer '+tok}});
      if((r.status===429||r.status===503)&&tries<2){
        tries++;
        const ra=Number(r.headers&&r.headers.get&&r.headers.get('Retry-After'));
        await new Promise(res=>setTimeout(res,Math.min(10,isFinite(ra)&&ra>=0?ra:2)*1000));
        continue;
      }
      break;
    }
    if(!r.ok)throw graphHttpError('Graph '+r.status+' on '+url.slice(0,120),r.status);
    const d=await r.json();
    out=out.concat(d.value||[]);
    url=d['@odata.nextLink']||null;
  }
  return out;
}
/* The small lists from the last Refresh, so Open on a completed project reads only that
   project's rows. Null until the first Refresh. */
let LAST_GRAPH=null;
/* Open a completed project read-only (Spec A). Reads that one project's Jobs row,
   Assignments and Tasks, merges it in silently and marks it readOnly; the next Refresh drops
   it again because its number is in completedJobNumbers. */
async function openCompleted(jobno){
  const c=(S.completedJobs||[]).find(x=>String(x.jobno)===String(jobno)); if(!c)return;
  try{
    const tok=await graphToken(), R=window.D2GraphToPlanner;
    if(S.jobs.some(j=>String(j.jobno)===String(jobno)&&!j.readOnly))
      throw new Error('A project numbered '+jobno+' is already on screen, so the completed one cannot be opened beside it.');
    /* After a page reload nothing has been read yet. Read just the small lists Open needs; a
       full Refresh here would be silent and overwrite unsaved work on every other project. */
    if(!LAST_GRAPH){
      const site=await graphSite(tok), base='https://graph.microsoft.com/v1.0/sites/'+site.id+'/lists/';
      const [cal,req]=await Promise.all(['cal','req'].map(k=>graphPageAll(base+D2_GRAPH.lists[k]+'/items?$expand=fields&$top=500',tok)));
      LAST_GRAPH={site:site.webUrl, siteId:site.id, base, cal, req};
    }
    const base=LAST_GRAPH.base;
    const jobs=await graphPageAll(base+D2_GRAPH.lists.jobs+'/items?$expand=fields&$top=500',tok);
    const row=jobs.find(r=>String(r.fields.id)===String(c.id));
    if(!row) throw new Error('That project is no longer in SharePoint.');
    const lr=await R.readLive({jobs:[row], pageAll:u=>graphPageAll(u,tok),
      asgItems:base+D2_GRAPH.lists.asg+'/items', taskItems:base+D2_GRAPH.lists.tasks+'/items'});
    const GW=window.D2GraphWriteback;
    const users=GW?await graphPageAll(GW.urls(LAST_GRAPH.siteId).userInfo,tok).catch(()=>[]):[];
    const payload=R.toPlannerPayload({site:LAST_GRAPH.site, cal:LAST_GRAPH.cal, req:LAST_GRAPH.req, users,
      jobs:[row], asg:lr.asg, tasks:lr.tasks},{includeComplete:true});
    // Keep the list this screen already holds; this payload carries only the one project.
    payload.completedJobs=S.completedJobs; payload.completedJobNumbers=[];
    importFromD2Payload(payload,true);
    const j=S.jobs.find(x=>String(x.jobno)===String(jobno));
    if(j){ j.readOnly=true; save(); openSchedule(j.id); }
  }catch(e){
    document.getElementById('dTitle').textContent='Open '+jobno;
    document.getElementById('dBody').innerHTML=graphErrorHTML(e,'');
    document.getElementById('dFoot').innerHTML='<button class="btn" onclick="closeDrawer()">Close</button>';
    document.getElementById('drawer').classList.add('open');
  }
}
async function loadFromD2ViaGraph(silent,opts){
  const tok=await graphToken(opts);
  const site=await graphSite(tok);
  const base='https://graph.microsoft.com/v1.0/sites/'+site.id+'/lists/';
  /* Assignments and Tasks are NOT read whole any more (Spec A): only the live projects' rows,
     project by project, through D2GraphToPlanner.readLive. A completed project is never read;
     it is listed from its Jobs row alone. The other lists are small and read whole as before. */
  const R=window.D2GraphToPlanner;
  const keys=Object.keys(D2_GRAPH.lists).filter(k=>k!=='asg'&&k!=='tasks');
  const rows=await Promise.all(keys.map(k=>
    graphPageAll(base+D2_GRAPH.lists[k]+'/items?$expand=fields&$top=500',tok)));
  const graphPayload={site:site.webUrl};
  keys.forEach((k,i)=>{graphPayload[k]=rows[i];});
  const live=(graphPayload.jobs||[]).filter(r=>!R.isComplete(r.fields&&r.fields.Status));
  const lr=await R.readLive({jobs:live, pageAll:u=>graphPageAll(u,tok),
    asgItems:base+D2_GRAPH.lists.asg+'/items', taskItems:base+D2_GRAPH.lists.tasks+'/items'});
  graphPayload.asg=lr.asg; graphPayload.tasks=lr.tasks;
  LAST_GRAPH={site:graphPayload.site, siteId:site.id, base, cal:graphPayload.cal, req:graphPayload.req};
  /* PM names and the + Job people list come from the User Information List,
     read once here. A failure costs only the names, never the Refresh: the
     schedule is what a PM opened the page for. */
  const GW=window.D2GraphWriteback;
  graphPayload.users=GW?await graphPageAll(GW.urls(site.id).userInfo,tok).catch(()=>[]):[];
  /* Sign-off comments, with their own catch. An unreadable comments list costs
     the threads and nothing else. $top=999 because a thread grows without
     bound; graphPageAll follows nextLink regardless. */
  graphPayload.comments=D2_GRAPH.commentsList
    ?await graphPageAll(base+D2_GRAPH.commentsList+'/items?$expand=fields&$top=999',tok)
        .catch(()=>[])
    :[];
  const payload=window.D2GraphToPlanner.toPlannerPayload(graphPayload);
  importFromD2Payload(payload,silent);
}
function updateButtonTooltips(){
  const sv=document.getElementById('saveBtn');
  if(sv){
    sv.title=graphModeAvailable()
      ? 'Review everything changed here since the last Refresh, then write it back to '
        +'SharePoint. Nothing is sent until you confirm.'
      : 'Review everything changed here since the last Refresh and download it as a file. '
        +'Opened as a downloaded copy, this planner cannot write to SharePoint itself.';
  }
  const b=document.getElementById('d2Btn');
  if(graphModeAvailable()){
    b.title='Reads the live schedule from the D2 Build Scheduler site over Microsoft Graph. Merges by job number -- it never touches pools that only exist here.';
  }else{
    b.title='Load the live schedule exported from the D2 Build Scheduler SharePoint site. Merges by job number - it never touches pools that only exist here.'+
      (location.protocol==='file:'?' (Opened as a downloaded file -- pick the exported .json below.)':'');
  }
}
document.getElementById('d2Btn').onclick=()=>{
  if(graphModeAvailable())refreshLive(false);
  else document.getElementById('d2File').click();
};
document.getElementById('d2File').onchange=e=>{const f=e.target.files[0];if(f)importFromD2(f);e.target.value='';};
updateButtonTooltips();
fetchLoginHint();
load();render();
</script>
