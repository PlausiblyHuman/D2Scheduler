<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>D2 Pool Build Scheduler</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23082544'/%3E%3Ctext x='16' y='22' font-family='Segoe UI,sans-serif' font-size='15' font-weight='700' fill='%23ffffff' text-anchor='middle'%3ED2%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  /* D2 brand, measured from d2pools.com by painted area. The site theme, the
     SharePoint list cards, the field app and both summary emails use these three. */
  --navy:#082544; --green:#0B594B; --cream:#F6F3ED;
  --bg:var(--cream); --panel:#fff; --ink:#111827; --muted:#6b7280; --line:#e3ded4;
  --accent:var(--green); --danger:#b91c1c; --warn:#a84a18; --ok:#0B594B;
  --day:26px; --nmw:708px;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Source Sans 3","Source Sans Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:60}
header h1{font-size:14px;margin:0;font-weight:600;font-family:Poppins,"Segoe UI",sans-serif;letter-spacing:.2px}
header .sp{flex:1}
nav{display:flex;gap:2px;background:rgba(255,255,255,.10);border-radius:8px;padding:3px}
nav button{background:none;border:0;color:#cfd8e4;padding:6px 11px;border-radius:6px;font:inherit;font-size:12.5px;cursor:pointer}
nav button.on{background:#fff;color:var(--navy);font-weight:600}
.btn{background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink)}
.btn:hover{background:#f3f4f6}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:hover{background:#094539}
.btn.d{color:var(--danger);border-color:#fecaca}
.btn.sm{padding:2px 7px;font-size:11.5px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn:disabled:hover{background:inherit}
main{padding:12px 14px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.card > h2{margin:0;font-size:12.5px;padding:9px 13px;border-bottom:1px solid var(--line);background:#fbf9f5;font-weight:600;font-family:Poppins,"Segoe UI",sans-serif;letter-spacing:.3px;text-transform:uppercase;color:var(--navy);display:flex;align-items:center;gap:8px}
.card > h2 .sp{flex:1}
.pad{padding:13px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;background:#fbf9f5}
input,select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input[type=number]{width:60px}
input[type=checkbox]{width:auto;accent-color:var(--accent);cursor:pointer}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid transparent}
.skill{background:#eef2ff;color:#3730a3;margin:1px 3px 1px 0;cursor:pointer;user-select:none;border-color:#e0e7ff}
.skill.off{background:#f3f4f6;color:#9ca3af;border-color:#e5e7eb}
.sub{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
.chip.jb{margin-left:6px;text-transform:none;letter-spacing:0}
.chip.rej{background:#fbeee6;color:#a84a18;border-color:#f0c9b0}
.cmt{padding:6px 0;border-top:1px solid var(--line)} .cmt.pending{opacity:.72}
.chip.jb.planned{background:#fef3c7;color:#92400e;border-color:#fde68a}
.chip.jb.hold{background:#e5e7eb;color:#4b5563;border-color:#d1d5db}
.chip.jb.other{background:#e0e7ff;color:#3730a3;border-color:#c7d2fe}
.chip.jb.local{background:#f1f5f9;color:#64748b;border-color:#e2e8f0}
.chip.jb.edited{background:#fff7ed;color:#9a3412;border-color:#fed7aa}
.chip.jb.ok{background:#e7f2ef;color:#0b594b;border-color:#b9d8d0}
.muted{color:var(--muted)}.small{font-size:11.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* timeline */
.tl{overflow:auto;max-height:74vh;position:relative}
.tl table{width:max-content;min-width:100%}
.tl th,.tl td{border-bottom:1px solid #f1f2f4;padding:0}
.nm{position:sticky;left:0;background:#fff;z-index:20;min-width:var(--nmw);max-width:var(--nmw);width:var(--nmw);padding:3px 8px!important;border-right:2px solid var(--line);font-size:12.5px}
thead .nm{background:#fbf9f5;z-index:30}
.tl thead th{position:sticky;top:0;background:#fbf9f5;z-index:25;border-bottom:1px solid var(--line)}
.nmflex{display:flex;align-items:center;gap:6px}
.nmflex .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Dates sit in their own fixed-width cell so they line up down the board
   rather than trailing each name at a different x. Tabular figures keep the
   slashes aligned. */
.dt{flex:0 0 296px;text-align:right;font-size:11px;color:var(--muted);
    font-variant-numeric:tabular-nums;white-space:nowrap}
tr.jobrow .dt,tr.phrow .dt{color:#475569}
.nmflex .t.click{cursor:pointer;border-radius:4px}
.nmflex .t.click:hover{background:#eef2f6;box-shadow:0 0 0 3px #eef2f6}
.sg{display:flex;gap:9px;align-items:center;flex:0 0 auto;min-width:94px;justify-content:flex-end}
/* Edit in place: crew, days and start on the row itself. The dates cell keeps
   its fixed width so the column's right edge still lines up down the board. */
.dt.ic-row{display:flex;gap:4px;align-items:center;justify-content:flex-end;text-align:left}
.ic{font-size:11px;height:22px;padding:0 3px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font-family:inherit}
select.ic{max-width:118px}
input.ic[type=number]{width:46px}
input.ic[type=date]{width:116px}
.dt .fin{white-space:nowrap;color:var(--muted)}
/* A closed row's controls are buttons drawn to the live controls' widths, so
   opening a row does not shift the column. */
button.icv{cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 auto}
button.icv:hover{border-color:#94a3b8;background:#f8fafc}
button.icv[data-ic=crew]{width:118px}
button.icv[data-ic=crew]::after{content:" ▾";color:var(--muted)}
button.icv[data-ic=days]{width:46px;text-align:right}
button.icv[data-ic=start]{width:116px}
.sg label{font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);display:flex;align-items:center;gap:2px;font-weight:650;cursor:pointer}
.sg label.on{color:var(--ok)}
.wk{font-size:10px;color:var(--muted);text-align:center;border-left:1px solid var(--line);font-weight:600;white-space:nowrap;padding:3px 0!important}
.dn{font-size:9.5px;color:#9ca3af;text-align:center;width:var(--day);min-width:var(--day);padding:2px 0!important}
.dn.mon{border-left:1px solid var(--line)}
.dn.sat{color:#c7cbd1;background:#fafbfc}
.dn.today{background:#fef3c7;color:#92400e;font-weight:700}
/* Zoom shows or hides header rows; the cells below keep their exact day span.
   Hidden rows are COLLAPSED, not display:none: the table is auto-layout, and
   the day header cells are what hold every column open to --day. A column whose
   body cells are all spanning bars has nothing else enforcing its width. */
.tl tr.mrow{visibility:collapse}
.tl.zoom-week tr.drow{visibility:collapse}
.tl.zoom-month tr.drow,.tl.zoom-month tr.wrow{visibility:collapse}
.tl.zoom-month tr.mrow{visibility:visible}
.tl th.dn{min-width:var(--day);width:var(--day)}
.tl.zoom-week th.dn,.tl.zoom-month th.dn,.tl.zoom-month th.wk{font-size:0;padding:0}
.tl.zoom-week th.wk,.tl.zoom-month th.mo{font-size:10px;overflow:hidden;white-space:nowrap;padding:2px 0}
/* The table is auto-layout, so a bar's nowrap label sets a minimum width on
   its columns. Narrow zooms drop the label (the crew is in the bar's tooltip)
   so the cells can actually shrink to --day. */
.tl.zoom-week .bar,.tl.zoom-month .bar{font-size:0;padding:0}
td.cell{width:var(--day);min-width:var(--day);height:24px;border-left:1px solid #f6f7f8}
.bar{height:18px;margin:3px 1px;border-radius:4px;color:#fff;font-size:10.5px;line-height:18px;padding:0 6px;white-space:nowrap;overflow:hidden;cursor:pointer;font-weight:600}
.bar:hover{filter:brightness(1.12);outline:2px solid #111}
.bar.bad{box-shadow:inset 0 0 0 2px #7f1d1d}
tr.jobrow td{background:#eef2f6}
tr.jobrow .nm{background:#eef2f6;font-weight:700;font-size:13px}
tr.phrow td{background:#f8fafc}
tr.phrow .nm{background:#f8fafc;font-weight:650}
.jobbar{height:7px;margin:8px 1px;border-radius:4px}
.phbar{height:10px;margin:7px 1px;border-radius:3px;opacity:.55}
.sec{padding-left:16px}
.skip{opacity:.4;text-decoration:line-through}
.tw{display:inline-block;width:34px;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;vertical-align:1px}
.tw i{display:block;height:100%;background:var(--accent)}
.flag{display:block;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px}
.flag.err{background:#fef2f2;color:#7f1d1d}
.flag.warn{background:#fffbeb;color:#78350f}
.flag.ok{background:#f0fdf4;color:#14532d}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.14);z-index:100;display:none;flex-direction:column}
.drawer.open{display:flex}
.drawer h3{margin:0;padding:11px 15px;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;align-items:center;gap:8px;background:#fbf9f5}
.drawer .body{overflow:auto;padding:13px 15px;flex:1}
.drawer .foot{border-top:1px solid var(--line);padding:9px 15px;display:flex;gap:8px;background:#fbf9f5}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:650;margin-bottom:3px}
.fld input,.fld select{width:100%}
.fld input[type=checkbox]{width:auto}
.row{display:flex;gap:8px}.row > *{flex:1}
.tk{display:flex;gap:7px;align-items:flex-start;padding:3px 0;font-size:12.5px;border-bottom:1px solid #f4f5f6}
.tk input{margin-top:2px}
.tk.done span{text-decoration:line-through;color:var(--muted)}
.tk.na span{text-decoration:line-through;color:var(--muted)}
.tk .natog{margin-left:auto;padding-left:8px;color:var(--muted);text-decoration:none;flex:0 0 auto}
.tk .natog:hover{color:var(--ink)}
.tk.na .natog{color:var(--warn);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:9px;padding:8px 13px;font-size:11.5px;align-items:center;border-bottom:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.bars{height:9px;background:#e5e7eb;border-radius:5px;overflow:hidden;min-width:110px}
.bars i{display:block;height:100%}
.hint{font-size:11.5px;color:var(--muted);padding:0 13px 11px}
.ok-txt{color:var(--ok);font-weight:600}.err-txt{color:var(--danger);font-weight:600}
.pmlink{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
a[data-open-schedule]{color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px;white-space:nowrap}
.pmlink:hover,.pmlink:focus-visible{text-decoration-style:solid}
.phcrews{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:6px}
.tw2{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}
.tw2 i{display:block;height:100%;background:var(--accent)}
@media print{header,nav,.btn,.drawer{display:none!important}.tl{max-height:none;overflow:visible}}
</style>
</head>
<body>

<header>
  <h1>D2 Pool Build Scheduler</h1>
  <nav id="tabs">
    <button data-t="board" class="on">Job Board</button>
    <button data-t="crewboard">Crew Board</button>
    <button data-t="dispatch">Daily Dispatch</button>
    <button data-t="signoff">Sign-Offs</button>
    <button data-t="jobs">Jobs</button>
    <button data-t="crews">Crews</button>
    <button data-t="phases">Phase Template</button>
  </nav>
  <span class="sp"></span>
  <button class="btn p" id="autoBtn">⚡ Auto-Schedule</button>
  <button class="btn" id="addJobBtn">+ Job</button>
  <button class="btn p" id="saveBtn" title="Review everything changed here since the last Refresh, then write it back to SharePoint. Nothing is sent until you confirm.">Save</button>
  <button class="btn" id="d2Btn" title="Load the current schedule from SharePoint. Merges by job number - it never touches pools that only exist here.">Refresh</button>
  <input type="file" id="d2File" accept="application/json,.json" style="display:none">
  <span id="freshness" class="small" style="opacity:.75"></span>
</header>

<main id="main"></main>

<div class="drawer" id="drawer">
  <h3><span id="dTitle">Edit</span><span style="flex:1"></span><button class="btn sm" onclick="closeDrawer()">✕</button></h3>
  <div class="body" id="dBody"></div>
  <div class="foot" id="dFoot"></div>
</div>

<!-- Graph read path -- TWO RUNTIME DEPENDENCIES, deliberately, a change from
     this file's history. Until now this planner was entirely self-contained:
     no external scripts, no stylesheets, no fetch, no network of any kind --
     which is WHY it could be distributed as a bare SharePoint download and
     still work opened from disk. That is no longer strictly true: vendored
     MSAL and the Graph-mapping module below are real files this page loads.
     This is an accepted, recorded decision, not an oversight -- the download
     route these two scripts don't affect is already superseded: the nav
     link to it was pulled at go-live, the PM guide never mentions it, nobody
     is trained on it, and Phase H retires that copy outright once the
     hosted planner ships. Both files are vendored here under web/, never a
     CDN (see CLAUDE.md "MSAL is vendored ... do not add a CDN dependency"),
     and both are optional at runtime: the main script below feature-detects
     window.msal and window.D2GraphToPlanner and falls back to the file
     picker when either is absent -- which is exactly what happens when this
     page is opened from disk, since a file:// page cannot fetch either one.
     web/ is the deploy root (web/staticwebapp.config.json lives beside this
     file), so these are plain relative paths with no `../` escaping it --
     they must resolve the same way from a repo checkout and from an Azure
     Static Web Apps deployment of this directory. -->
<script src="vendor/msal-browser.min.js"></script>
<script src="graph-to-planner.js"></script>
<!-- The write path. writeback-core.js holds the decisions (allowlist, per-field
     compare, row identity, suppression) and graph-writeback.js holds the Graph
     shapes. Both are served from this same directory, which is the Static Web
     Apps deploy root. A jsdom harness CANNOT catch a broken src here, because
     jsdom does not fetch external scripts -- verify these return 200 in a real
     browser over HTTP, which is how a previous round of twelve green harnesses
     shipped with both tags pointing outside the deploy root. -->
<script src="writeback-core.js"></script>
<script src="graph-writeback.js"></script>

/* ============================== dates ============================== */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function parseD(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);}
/* Non-work days come from the SharePoint Work Calendar via Refresh: 175
   Sundays and 35 holidays. Sunday is ALSO computed, deliberately -- the computed
   rule is correct forever while the list expires 2029-12-30, so a lapsed calendar
   degrades to Sundays-only rather than to every day being a work day. This
   mirrors `D2 - New Pool`, which tests dayOfWeek AND a nonWork set. */
let NONWORK = new Set();
function syncNonWork(){ NONWORK = new Set((S && S.settings && S.settings.nonWork) || []); }
const isWork=d=>d.getDay()!==0 && !NONWORK.has(fmt(d));
function nextWork(s){let d=parseD(s);let g=0;while(!isWork(d)&&g++<30)d.setDate(d.getDate()+1);return fmt(d);}
function addCal(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return fmt(d);}
function workSpan(startStr,n){const out=[];let d=parseD(startStr);let g=0;while(out.length<n&&g++<4000){if(isWork(d))out.push(fmt(d));d.setDate(d.getDate()+1);}return out;}
const todayStr=()=>fmt(new Date());
function pretty(s){if(!s)return '—';const d=parseD(s);return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2);}
const dow=s=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][parseD(s).getDay()];

/* A local SUGGESTION only. SharePoint's own Jobs list is the uniqueness
   authority once a request is actually pushed -- sharepoint/apply-planner-
   changes.js reads live Jobs and refuses a create whose job number is
   already in use rather than silently renaming it (D10 in
   docs/planner-vs-sharepoint-parity.md: two independent generators with no
   check between them used to exist). This also looks at jobs already queued
   but not yet pushed, so two +Job requests in a row do not suggest the same
   number twice. */
function nextJobNo(){
  const nums=[];
  (S&&S.jobs?S.jobs:[]).forEach(j=>{const t=String(j.jobno||'').match(/(\d+)\s*$/);if(t)nums.push(parseInt(t[1],10));});
  (S&&S.pendingCreates?S.pendingCreates:[]).forEach(c=>{const t=String(c.jobno||'').match(/(\d+)\s*$/);if(t)nums.push(parseInt(t[1],10));});
  const n=nums.length?Math.max(...nums):1000;
  return 'D2-'+(n+1);
}
function newJob(name,addr,city,state,zip,start){
  return {id:'j'+Math.random().toString(36).slice(2,8),jobno:nextJobNo(),
    name,addr,city:city||'',state:state||'',zip:zip||'',start,
    status:null,          // null = exists only in this browser, never raised in SharePoint
    groups:mkJobGroups(S?S.template:mkTemplate())};
}

/* A pool's state, from `Jobs.Status` on the SharePoint side. Planned and On Hold
   pools are deliberately still drawn on every board and still raise conflicts --
   a PM choosing dates wants to know a new pool collides with a live one, which is
   why the reflow's own conflict sweep is tenant-wide too. Only the label was

function jobBadge(j){
  if(j.readOnly)return '<span class="chip jb hold" title="Completed. Opened from Completed projects for reference; nothing on it can be changed. The next Refresh puts it away.">Completed, read only</span>';
  const edited=j.touchedAt?'<span class="chip jb edited" title="Changed here since the last Refresh">edited here</span>':'';
  const building=j.building?'<span class="chip jb hold" title="Still being built in SharePoint, usually 10 to 20 minutes. Nothing on it can be changed until it finishes; Refresh then.">Building</span>':'';
  if(!j.status)return '<span class="chip jb local" title="Sketched here, not yet raised in SharePoint">Local only</span>'+building+edited;
  const ready=readyToComplete(j)?'<span class="chip jb ok" title="Every sub-phase is signed off or not applicable. Mark it complete on the Jobs tab.">Ready to complete</span>':'';
  if(j.status==='Active')return building+ready+edited;
  const cls=j.status==='Planned'?'planned':j.status==='On Hold'?'hold':'other';
  return `<span class="chip jb ${cls}" title="Jobs.Status in SharePoint">${esc(j.status)}</span>`+building+edited;
}

/* ============================== scheduling ============================== */
function crewLoad(){
  const m={};S.crews.forEach(c=>m[c.id]=0);
  S.jobs.forEach(j=>allSecs(j).forEach(({s})=>{if(!s.skip&&s.crewId)m[s.crewId]=(m[s.crewId]||0)+s.days;}));
  return m;
}
function busyMap(skipRef){
  const m=new Map();
  S.jobs.forEach(j=>allSecs(j).forEach(({s,gi,si})=>{
    if(s.skip||!s.crewId||!s.start)return;
    const c=crew(s.crewId);if(c&&c.unlimited)return;   // capacity-exempt buckets never block
    if(skipRef&&skipRef.jobId===j.id&&skipRef.gi===gi&&skipRef.si===si)return;
    let set=m.get(s.crewId);if(!set){set=new Set();m.set(s.crewId,set);}
    workSpan(s.start,s.days).forEach(d=>set.add(d));
  }));
  return m;
}
function autoSchedule(){
  const busy=new Map();
  S.jobs.forEach(j=>allSecs(j).forEach(({s})=>{
    if(s.locked&&s.crewId&&s.start&&!s.skip){
      const c=crew(s.crewId);if(c&&c.unlimited)return;   // capacity-exempt buckets never block
      let set=busy.get(s.crewId);if(!set){set=new Set();busy.set(s.crewId,set);}
      workSpan(s.start,s.days).forEach(d=>set.add(d));
    }}));
  // DETERMINISM FIX (1 of 2): seed load from LOCKED assignments only, exactly as
  // `busy` above is seeded. crewLoad() counts EVERY assignment, so a second run
  // inherits the first run's own tiebreak results and drifts.
  const load={};S.crews.forEach(c=>load[c.id]=0);
  S.jobs.forEach(j=>allSecs(j).forEach(({s})=>{
    if(s.locked&&s.crewId&&s.start&&!s.skip)load[s.crewId]=(load[s.crewId]||0)+s.days;
  }));
  [...S.jobs].filter(j=>!frozen(j)).sort((a,b)=>jobStart(a).localeCompare(jobStart(b))).forEach(j=>{
    touch(j);
    let cursor=nextWork(jobStart(j));
    allSecs(j).forEach(({s})=>{
      if(s.skip)return;
      const adv=st=>nextWork(addCal(workSpan(st,s.days).pop(),1));
      if(s.locked&&s.start){const nc=adv(s.start);if(nc>cursor)cursor=nc;return;}  // never move the cursor backwards
      if(!s.skill){s.crewId='unassigned';s.start=cursor;cursor=adv(cursor);return;}
      const cands=qualified(s.skill);
      if(!cands.length){s.crewId=null;s.start=cursor;cursor=adv(cursor);return;}
      // capacity-exempt bucket: no availability search, it can never be busy
      if(cands.every(c=>c.unlimited)){s.crewId=cands[0].id;s.start=cursor;cursor=adv(cursor);return;}
      let at=cursor,found=null;
      for(let tries=0;tries<600&&!found;tries++){
        const span=workSpan(at,s.days);
        for(const c of [...cands].sort((a,b)=>((load[a.id]||0)-(load[b.id]||0))||a.id.localeCompare(b.id))){
          const set=busy.get(c.id)||new Set();
          if(span.every(d=>!set.has(d))){found={c,span};break;}
        }
        if(!found)at=nextWork(addCal(at,1));
      }
      if(found){
        s.crewId=found.c.id;s.start=found.span[0];
        let set=busy.get(found.c.id);if(!set){set=new Set();busy.set(found.c.id,set);}
        found.span.forEach(d=>set.add(d));
        load[found.c.id]=(load[found.c.id]||0)+s.days;
        cursor=nextWork(addCal(found.span[found.span.length-1],1));
      }else{s.crewId=null;s.start=at;cursor=adv(at);}
    });
  });
  save();
}

/* ---- Auto-Schedule, with a preview of what it did and a way back ------------
   Auto-Schedule can rewrite crew and dates on every unpinned sub-phase in every
   pool. Pressing it used to do exactly that with no account of itself: the board
   redrew and you were left to spot the difference. That is a lot of trust to ask
   for one button, and it is the reason people stop pressing it.

   It runs for real and then reports, rather than simulating first. autoSchedule
   writes only `s.crewId` and `s.start` (plus `j.touchedAt`), so a snapshot of
   those three is a complete and exact undo. Simulating instead would mean a
   second implementation of the scheduler that could drift from the real one,
   which is the failure this repo keeps recording. */
let AUTO_SNAP=null;

function autoScheduleRun(){
  AUTO_SNAP=S.jobs.map(j=>({job:j, touchedAt:j.touchedAt,
    secs:allSecs(j).map(({s})=>({s, crewId:s.crewId, start:s.start}))}));

  autoSchedule();

  const moves=[]; let pinned=0, settled=0, skipped=0;
  AUTO_SNAP.forEach(js=>js.secs.forEach(r=>{
    const s=r.s;
    if(s.skip){skipped++;return;}
    if(s.locked||s.inst){pinned++;return;}
    if(s.crewId!==r.crewId||s.start!==r.start){
      moves.push({jobno:js.job.jobno, pool:js.job.name, num:s.num, name:s.name,
                  fromCrew:r.crewId, toCrew:s.crewId, fromStart:r.start, toStart:s.start});
    } else settled++;
  }));
  render();
  openAutoPreview(moves, pinned, settled, skipped);
}

function undoAutoSchedule(){
  if(!AUTO_SNAP)return;
  AUTO_SNAP.forEach(js=>{
    js.job.touchedAt=js.touchedAt;
    js.secs.forEach(r=>{r.s.crewId=r.crewId; r.s.start=r.start;});
  });
  AUTO_SNAP=null;
  save(); closeDrawer(); render();
}

/* The action behind a late-sub-phase warning: push it to today and carry the
   rest of the pool with it. Deliberately a confirm rather than a silent move,
   and deliberately per-pool rather than a sweep, because "this one slipped" is
   a judgement a PM makes about one job. */
function slipFromToday(jobId,gi,si){
  const j=S.jobs.find(x=>x.id===jobId); if(!j)return;
  const list=allSecs(j); const at=list.findIndex(x=>x.gi===gi&&x.si===si);
  if(at<0)return;
  const s=list[at].s, from=nextWork(todayStr()), nl=String.fromCharCode(10,10);
  if(!confirm('Move '+s.num+' '+s.name+' to start '+pretty(from)
    +', and push the rest of '+j.name+' along behind it?'+nl
    +'Locked and signed-off work is never moved. Nothing reaches SharePoint until you press Save.'))return;
  const r=reflowFrom(jobId,gi,si,from);
  render();
  if(r&&!r.moved)alert('Nothing moved. Everything from here on is locked, signed off, or already scheduled later than this.');
}

/* The rules, written out. This is the only place in the app that says what
   Auto-Schedule actually does, and people need it: a button that silently moves
   a hundred rows is indistinguishable from one that moves them wrongly. */
const AUTO_RULES=[
  'Pools are laid out in order of their earliest real work, not their job number.',
  'Inside a pool, sub-phases run in order. Each one starts on the first working day after the one before it finishes.',
  'Anything <b>locked</b> or already <b>signed off</b> is never moved. The schedule flows around it.',
  'Anything marked <b>not applicable</b> is skipped entirely.',
  'For every other sub-phase it looks at the crews that hold the required trade, and gives it to the <b>least loaded</b> one that is free for the whole span.',
  'If no qualified crew is free, it tries the next working day, and keeps going until one is.',
  'Subcontractors and the office buckets are capacity-exempt: they are never counted as busy and never block a date.',
  'A sub-phase with no trade set goes to Unassigned rather than guessing.',
  'Sundays and the holidays on the D2 work calendar are never work days.'
];

function openAutoPreview(moves,pinned,settled,skipped){
  const byPool={};
  moves.forEach(m=>{(byPool[m.jobno]=byPool[m.jobno]||{pool:m.pool,rows:[]}).rows.push(m);});
  const cname=id=>{const c=id?crew(id):null;return c?c.name:(id?id:'Unassigned');};
  const CAP=40; let shown=0;

  const table=Object.keys(byPool).map(k=>{
    const g=byPool[k]; if(shown>=CAP)return '';
    const rows=g.rows.slice(0,Math.max(0,CAP-shown)); shown+=rows.length;
    return `<div class="fld"><label>${esc(g.pool)} <span class="muted">${esc(k||'')}</span> — ${g.rows.length} change${g.rows.length===1?'':'s'}</label>
      <table><tbody>${rows.map(m=>{
        const dc=m.fromCrew!==m.toCrew, dd=m.fromStart!==m.toStart;
        const bits=[];
        if(dc)bits.push(`<span class="muted">${esc(cname(m.fromCrew))}</span> → <b>${esc(cname(m.toCrew))}</b>`);
        if(dd)bits.push(`<span class="muted">${m.fromStart?pretty(m.fromStart):'unscheduled'}</span> → <b>${pretty(m.toStart)}</b>`);
        return `<tr><td class="small" style="white-space:nowrap"><b>${esc(m.num)}</b> ${esc(m.name)}</td>
                    <td class="small">${bits.join('<br>')}</td></tr>`;}).join('')}
      </tbody></table></div>`;
  }).join('');

  document.getElementById('dTitle').textContent='Auto-Schedule';
  document.getElementById('dBody').innerHTML=
    (moves.length
      ? `<div class="hint" style="padding:0 0 11px"><b>${moves.length} sub-phase${moves.length===1?'':'s'} moved.</b>
           ${pinned} left alone because ${pinned===1?'it is':'they are'} locked or signed off,
           ${settled} already where ${settled===1?'it belongs':'they belong'}${skipped?`, ${skipped} not applicable`:''}.
           Nothing has been written to SharePoint yet: press Save when you are happy with it.</div>`
      : `<div class="hint" style="padding:0 0 11px"><b>Nothing moved.</b>
           Every sub-phase that Auto-Schedule is allowed to move was already where it belongs.
           ${pinned} ${pinned===1?'is':'are'} locked or signed off and are never moved${skipped?`, ${skipped} not applicable`:''}.</div>`)
    +table
    +(moves.length>CAP?`<div class="hint" style="padding:0 0 11px">and ${moves.length-CAP} more not listed.</div>`:'')
    +`<div class="fld"><label>How Auto-Schedule decides</label>
        <ol class="small" style="margin:0;padding-left:18px;line-height:1.55">
          ${AUTO_RULES.map(r=>`<li style="margin-bottom:3px">${r}</li>`).join('')}
        </ol></div>`;
  document.getElementById('dFoot').innerHTML=
    (moves.length
      ? `<button class="btn p" onclick="closeDrawer()">Keep it</button>
         <button class="btn d" onclick="undoAutoSchedule()">Undo</button>`
      : `<button class="btn p" onclick="closeDrawer()">Close</button>`);
  document.getElementById('drawer').classList.add('open');
}
function spanOf(list){
  let a=null,b=null;
  list.forEach(s=>{if(s.skip||!s.start)return;const e=workSpan(s.start,s.days).pop();
    if(!a||s.start<a)a=s.start; if(!b||e>b)b=e;});
  return [a,b];
}
const jobSpan=j=>spanOf(allSecs(j).map(x=>x.s));
/* The earliest date this pool actually has work on, which is NOT always
   `j.start`. `D2 - Reschedule Pool` rewrites the Assignments dates without
   writing Jobs.StartDate back, so an imported pool's own field can sit months
   after its first sub-phase. autoSchedule() uses this to order pools and to seed
   each pool's cursor, and a drifted value anchors the whole pool late. */
function jobStart(j){
  let a=j.start||null;
  allSecs(j).forEach(({s})=>{if(s.skip||!s.start)return;if(!a||s.start<a)a=s.start;});
  return a||todayStr();
}

/* Projects list in job-number order by default (asked for 2026-10-01). A job number is compared
   by the numbers in it, in sequence, so 24-999 comes before 24-1999 (text order inverts them) and
   a stray space or '=' changes nothing. A number with no digits sorts last; ties fall back to the
   text. S.jobs itself is kept in this order, so every list that does not choose otherwise follows
   it. The Board and the Jobs tab can show start-date order instead. Auto-Schedule keeps its own
   order (earliest real work), which is a scheduling rule, not a display choice. */
function jobNoKey(j){ return (String((j&&j.jobno)||'').match(/\d+/g)||[]).map(Number); }
function cmpJobNo(a,b){
  const x=jobNoKey(a), y=jobNoKey(b);
  if(!x.length!==!y.length) return x.length?-1:1;
  for(let i=0;i<Math.min(x.length,y.length);i++) if(x[i]!==y[i]) return x[i]-y[i];
  return (x.length-y.length)||String(a.jobno||'').localeCompare(String(b.jobno||''));
}
function sortJobsByNumber(){ if(S&&Array.isArray(S.jobs)) S.jobs.sort(cmpJobNo); }
function jobSortMode(){ return S.settings&&S.settings.jobSort==='start'?'start':'number'; }
function orderJobs(list){
  const l=list.slice();
  return jobSortMode()==='start' ? l.sort((a,b)=>jobStart(a).localeCompare(jobStart(b))||cmpJobNo(a,b)) : l.sort(cmpJobNo);
}
function setJobSort(v){ S.settings=S.settings||{}; S.settings.jobSort=v==='start'?'start':'number'; save(); render(); }
function jobSortControl(){
  const m=jobSortMode();
  return `<select id="jobSort" style="text-transform:none;font-weight:400" title="Order projects by" onchange="setJobSort(this.value)">
        <option value="number"${m==='number'?' selected':''}>By job number</option>
        <option value="start"${m==='start'?' selected':''}>By start date</option></select> `;
}

/* Dates-only reflow of ONE pool from ONE sub-phase forward.
   This exists because editing a duration used to record the new number and move
   nothing, so a PM had to follow every edit with an Auto-Schedule or a
   Reschedule Request. That is two steps for what reads as one action.

   It deliberately mirrors `D2 - Reschedule Pool` rather than Auto-Schedule:
   it walks in Sequence order, it NEVER moves a row that is locked or signed off,
   and it never lets a pinned row drag the cursor backwards -- the same defect
   fixed in that flow on 2026-09-15, and in autoSchedule on 2026-09-12. It
   assigns no crews, which is the whole difference from Auto-Schedule: a PM
   fixing a duration wants the dates to follow on, not the crew board reshuffled.

   Rows before the starting one are never touched, exactly as FromSequence works
   server-side. Returns what happened so the caller can explain a no-op. */
function reflowFrom(jobId,gi,si,fromDate){
  const j=S.jobs.find(x=>x.id===jobId); if(!j)return null;
  const list=allSecs(j);
  const at=list.findIndex(x=>x.gi===gi&&x.si===si);
  if(at<0)return null;
  const adv=(st,days)=>nextWork(addCal(workSpan(st,days).pop(),1));
  // fromDate lets a slipped sub-phase be pushed to today rather than reflowed
  // from where it already (wrongly) sits.
  let cursor=fromDate?nextWork(fromDate):(list[at].s.start||todayStr());
  let moved=0,pinned=0,badDays=0;
  for(let i=at;i<list.length;i++){
    const s=list[i].s;
    if(s.skip)continue;
    if(!(s.days>0)){badDays++;continue;}          // logged, never guessed at
    if(s.locked||s.inst){                          // pinned or signed: leave it
      if(s.start){const nc=adv(s.start,s.days); if(nc>cursor)cursor=nc;}
      pinned++; continue;
    }
    if(s.start!==cursor){s.start=cursor;moved++;}
    cursor=adv(s.start,s.days);
  }
  if(moved)touch(j);
  return {moved,pinned,badDays};
}

/* Marks a pool as diverged from the last Refresh. Everything that rewrites
   schedule or sign-off state calls this, so the header can say plainly whether
   what is on screen is still the live schedule. */
function touch(j){ if(j) j.touchedAt=new Date().toISOString(); }

/* The exact fields SharePoint owns and this planner may ever write back to it,
   paired with the column each maps to. This list is the single source of truth
   for the write-back allowlist -- divergedSecs, the Save preview and the
   change-set file (buildChangeSet, further below) are all built
   from it, so a field cannot slip into a push without an entry here. Sign-off
   and task ticks are deliberately never in this list: they are written, but by
   their own path (buildSignoffSet / pushSignoffs), because a sign-off writes a
   Person column and a timestamp and clearing one is a Reopen that must leave a
   trace, none of which a plain field compare can express. fixtures/planner/writeback.js pins this from both
   ends: the change-set this produces, and the fields sharepoint/apply-planner-
   changes.js will actually send.

   `locked` carries a `raw:'spLocked'` override. `s.locked` (and `b.locked` on
   the baseline) is the DERIVED lock -- SharePoint's raw Locked OR sign-off --
   which render() and Auto-Schedule both need so signed work is never moved.
   But that derived value is exactly what must NOT be diffed here: on every
   signed-off row where SharePoint's actual Locked column is false (a third of
   live rows), `b.locked` reads true anyway, so diffing against it made a
   genuine Lock-checkbox edit on a signed row compare against a baseline the
   row never actually held, and the write was refused as a stale conflict that
   was never real. `spLocked`/`s.spLocked` track the raw column on its own, so
   `raw` points both `cur` and `was` at that instead, leaving `s.locked` and
   the derived behaviour untouched everywhere else. See `saveSec` for how
   `s.spLocked` is set only when the PM actually touches the Lock checkbox. */
const WRITEBACK_FIELDS=[
  {key:'crewId',col:'Crew',          bool:false},
  {key:'start', col:'ScheduledStart',bool:false},
  {key:'days',  col:'DurationDays',  bool:false},
  {key:'locked',col:'Locked',        bool:true, raw:'spLocked'},
  {key:'skip',  col:'NotApplicable', bool:true}
];
/* Which owned fields of this sub-phase no longer match what SharePoint sent,
   and what changed on each. Sign-off and task ticks are never compared here;
   buildSignoffSet diffs them separately, for the reason given on
   WRITEBACK_FIELDS. */
function secFieldDiffs(s){
  const b=s.base; if(!b)return [];
  const out=[];
  WRITEBACK_FIELDS.forEach(({key,col,bool,raw})=>{
    const rk=raw||key;
    const cur=bool?!!s[rk]:(s[rk]??null), was=bool?!!b[rk]:(b[rk]??null);
    if(cur!==was)out.push({key,col,from:was,to:cur});
  });
  return out;
}
/* Which sub-phases of this pool no longer match what SharePoint sent. Compares
   only the scheduling fields in WRITEBACK_FIELDS; sign-off and task ticks are
   diffed by buildSignoffSet instead. */
function divergedSecs(j){
  const out=[];
  if(frozen(j))return out;   // half-built in SharePoint, or completed and read-only: nothing on it is offered to Save
  allSecs(j).forEach(({s})=>{ if(s.base && secFieldDiffs(s).length) out.push(s); });
  return out;
}
/* Has this pool ever been loaded from SharePoint at all? A pool sketched only in this
   browser (never raised in SharePoint, or raised but never re-imported) carries
   no baseline on any of its sub-phases -- it is a local sketch, and Save must
   exclude it entirely rather than offer to "push" a pool SharePoint has never
   heard of. Creating a pool is out of scope for the write-back; that stays
   `New Pool Requests`. */
/* A project nothing on this screen may change: still being built by D2 - New Pool, or a
   completed project opened read-only from Completed projects (Spec A). Every edit gate and
   every Save set asks this; the Building chip and its copy still read j.building directly. */
function frozen(j){ return !!(j&&(j.building||j.readOnly)); }
function poolHasBaseline(j){ return allSecs(j).some(({s})=>!!s.base); }
/* Comments need a SharePoint row to hang off and a Graph token to write with.
   A local sketch has no row; a downloaded copy has no token. Both are told,
   rather than shown a control that does nothing. */
function commentsWritable(j){ return graphModeAvailable() && poolHasBaseline(j); }

/* ============================== sign-off + tasks ============================== */
/* Resolved, not done. Every task is Done, N/A or still to do; N/A is deliberate
   exclusion carrying a reason on the SharePoint side, so a sub-phase with one N/A
   and five done is FINISHED. The numeric label still reads 5/6, because
   Assignments.TasksComplete counts genuinely-done only and this has to agree
   with it. */
function secCounts(s){const n=s.tasks.length;
  return {n, done:s.tasks.filter(t=>t.done).length, na:s.tasks.filter(t=>t.na&&!t.done).length};}
function secDone(s){const c=secCounts(s);if(!c.n)return 1;return (c.done+c.na)/c.n;}
function grpSign(g,k){const act=g.sections.filter(s=>!s.skip);
  if(!act.length)return 'none';
  const n=act.filter(s=>s[k]).length;
  return n===0?'none':(n===act.length?'all':'some');}
function sign(jobId,gi,si,k,val){
  const j=S.jobs.find(x=>x.id===jobId);
  if(!j||frozen(j)){render();return;}
  if(si===null||si===undefined){j.groups[gi][k]=val;j.groups[gi].sections.forEach(s=>{if(!s.skip)s[k]=val;});}
  else{j.groups[gi].sections[si][k]=val;j.groups[gi][k]=grpSign(j.groups[gi],k)==='all';}
  touch(j);
  save();render();
}
/* Hosted, these boxes RECORD sign-off: Save writes it through pushSignoffs with
   the signed-in user and the time, and un-ticking a recorded installer sign-off
   is a Reopen that appends a line to SignOffNotes. Opened as a downloaded file
   there is no way to write them, so there a tick is a local view the next
   Refresh overwrites. The tooltip says which, because a checkbox that silently
   forgets is worse than one that explains itself.

   Only INST carries a name. There is no PMSignOffBy column on Assignments, so
   PM writes the flag alone, and the tooltip does not promise otherwise. */
function sgNote(k,jobId){
  if(!graphModeAvailable())
    return '. Shown from SharePoint. This downloaded copy cannot save sign-off, so a tick here is lost on the next Refresh.';
  const j=S.jobs.find(x=>x.id===jobId);
  if(j&&!poolHasBaseline(j))
    return '. This pool is not in SharePoint yet, so a tick here is not saved.';
  return k==='inst'
    ? '. Press Save to record it in SharePoint under your name. Un-ticking a recorded sign-off reopens it, and the reopen is noted.'
    : '. Press Save to record it in SharePoint.';
}
// Sign-off boxes on a project nothing here may change render disabled.
function sgOff(jobId){ return frozen(S.jobs.find(x=>x.id===jobId))?'disabled':''; }
function sgHTML(jobId,gi,si,o){
  const i=`sign('${jobId}',${gi},${si===null?'null':si},'inst',this.checked)`;
  const p=`sign('${jobId}',${gi},${si===null?'null':si},'pm',this.checked)`;
  const off=sgOff(jobId);
  return `<span class="sg">
    <label class="${o.inst?'on':''}" title="Installer sign-off${sgNote('inst',jobId)}"><input type="checkbox" ${o.inst?'checked':''} ${off} onchange="${i}">INST</label>
    <label class="${o.pm?'on':''}" title="Project Manager sign-off${sgNote('pm',jobId)}"><input type="checkbox" ${o.pm?'checked':''} ${off} onchange="${p}">PM</label></span>`;
}

/* ============================== conflicts ==============================
   Every conflict carries `jobs`, the job numbers it involves, so a caller can
   ask "what is wrong with THIS pool" -- which the activate dialog does before
   turning a pool Active. A double-booking genuinely spans two pools and
   carries both; the shared-crew-member warning is crew-level and carries
   none. */
function conflicts(){
  const out=[],byDay={},T=todayStr();
  S.jobs.filter(j=>!j.readOnly).forEach(j=>{
    let prevEnd=null;
    allSecs(j).forEach(({g,gi,s,si})=>{
      if(s.skip)return;
      /* esc() here, not at the sink: these messages deliberately carry markup
         (<b>, <u>) and flagsCard paints them with innerHTML, so escaping msg
         wholesale would render the tags as text. The pool name is free text a
         PM types into SharePoint, so it is the part that must be neutralised.
         Pinned by fixtures/planner/escaping.js. */
      const ref=`${esc(j.name)} › ${esc(s.num)} ${esc(s.name)}`;
      if(!s.start){out.push({jobs:[j.jobno],lvl:'err',msg:`<b>${ref}</b> — not scheduled.`});return;}
      if(s.skill&&!s.crewId){const q=qualified(s.skill);
        out.push({jobs:[j.jobno],lvl:'err',msg:`<b>${ref}</b> — no crew assigned${q.length?'':` and <u>no crew has the ${skillLabel(s.skill)} skill</u>`}.`});}
      if(s.skill&&s.crewId){const c=crew(s.crewId);
        if(!c)out.push({jobs:[j.jobno],lvl:'err',msg:`<b>${ref}</b> — assigned crew no longer exists.`});
        else if(!isQualified(c,s.skill))out.push({jobs:[j.jobno],lvl:'err',msg:`<b>${ref}</b> — ${esc(c.name)} is not qualified for ${skillLabel(s.skill)}.`});}
      if(s.crewId==='unassigned')out.push({jobs:[j.jobno],lvl:'warn',msg:`<b>${ref}</b> — sitting in <b>Unassigned</b>. Give it Main Office, a Subcontractor, or a field crew.`});
      if(prevEnd&&s.start<=prevEnd)out.push({jobs:[j.jobno],lvl:'err',msg:`<b>${ref}</b> — starts ${pretty(s.start)}, on or before the prior sub-phase ends (${pretty(prevEnd)}).`});
      const end=workSpan(s.start,s.days).pop();
      prevEnd=end;
      /* Installer sign-off only. `Assignments.PMSignOff` is written false once at
         pool creation and read by no flow, no view and not by the field app, so
         warning on it produced one unclearable item per finished sub-phase and
         drowned the checks that are real. The PM checkboxes and counts stay --
         when PM sign-off becomes a workflow, this check comes back with it. */
      /* `act` carries enough to reflow straight from the finding. Slippage is
         detected here and was then propagated by nobody: the plan kept saying
         downstream work starts on its original dates while the row in front of
         it visibly had not finished. Still a human decision, but one click from
         where the problem is already named. */
      if(end<T&&!s.inst)out.push({jobs:[j.jobno],lvl:'warn',act:{jobId:j.id,gi,si},
        msg:`<b>${ref}</b> — due to finish ${pretty(end)} and not signed off.`});
      /* Warn, do not block. Don's rule is that every task is Done or N/A before a
         sign-off; enforcing that in the planner during the pilot would block PMs
         constantly, because task ticking is only just becoming possible here. So
         it is surfaced rather than prevented, and the count says how many. */
      if(s.inst){const tc=secCounts(s);const open=tc.n-(tc.done+tc.na);
        if(open>0)out.push({jobs:[j.jobno],lvl:'warn',
          msg:`<b>${ref}</b> — signed off with ${open} task${open===1?'':'s'} still unresolved.`});}
      const cc=s.crewId?crew(s.crewId):null;
      if(cc&&!cc.unlimited)workSpan(s.start,s.days).forEach(d=>{byDay[s.crewId]=byDay[s.crewId]||{};(byDay[s.crewId][d]=byDay[s.crewId][d]||[]).push({j,s});});
    });
  });
  Object.entries(byDay).forEach(([cid,days])=>{
    const seen=new Set();
    Object.entries(days).forEach(([d,list])=>{
      if(list.length<2)return;
      const k=list.map(x=>x.j.id+x.s.num).sort().join('|');
      if(seen.has(k))return;seen.add(k);
      out.push({jobs:[...new Set(list.map(x=>x.j.jobno))],lvl:'err',msg:`<b>${crew(cid)?crew(cid).name:cid}</b> double-booked ${pretty(d)}: ${list.map(x=>esc(x.j.name)+' ('+esc(x.s.num)+' '+esc(x.s.name)+')').join(' vs ')}.`});
    });
  });
  for(let a=0;a<S.crews.length;a++)for(let b=a+1;b<S.crews.length;b++){
    const A=S.crews[a],B=S.crews[b];
    /* '?' is the roster's placeholder for a crew member whose name we do not
       have yet, not a person. Campos and Harrison both carry one, so without
       this the check reported "?, ? is on both Campos +2 and Harrison +2 --
       confirm these are different people", which is unclearable by definition
       and is exactly the cry-wolf warning that got PM sign-off removed from
       Schedule Check. '+2' was already excluded for the same reason. */
    const PLACEHOLDER=m=>!m||m==='+2'||m==='?';
    const both=A.members.filter(m=>!PLACEHOLDER(m)&&B.members.includes(m));
    if(!both.length)continue;
    const da=byDay[A.id]||{},db=byDay[B.id]||{};
    const clash=Object.keys(da).filter(d=>db[d]).sort();
    if(clash.length)out.push({lvl:'warn',msg:`<b>${both.join(', ')}</b> is on both ${A.name} and ${B.name}, and both crews work ${clash.length} of the same day(s) — first ${pretty(clash[0])}. Confirm these are different people.`});
  }
  return out;
}

/* ============================== axis ============================== */
/* The timeline spans the projects it is given: the Board passes only the ones
   it shows, so picking one project no longer draws every project's 18 months. */
function axis(jobs=S.jobs){
  let min=null,max=null;
  jobs.forEach(j=>{
    if(!min||j.start<min)min=j.start;
    const [a,b]=jobSpan(j);
    if(a&&(!min||a<min))min=a; if(b&&(!max||b>max))max=b;
  });
  if(!min)min=todayStr(); if(!max)max=addCal(min,30);
  min=addCal(min,-3);max=addCal(max,5);
  let d=parseD(min);while(d.getDay()!==1)d.setDate(d.getDate()-1);
  const days=[],idx={},end=parseD(max);
  while(d<=end){if(isWork(d)){idx[fmt(d)]=days.length;days.push(fmt(d));}d.setDate(d.getDate()+1);}
  return {days,idx};
}
function headHTML(ax){
  const wk=[];let i=0;
  while(i<ax.days.length){
    let n=1;const first=ax.days[i];
    while(i+n<ax.days.length&&parseD(ax.days[i+n]).getDay()>parseD(ax.days[i+n-1]).getDay())n++;
    wk.push({first,n});i+=n;
  }
  const mo=[];let k=0;
  while(k<ax.days.length){let n=1;const first=ax.days[k],m=first.slice(0,7);
    while(k+n<ax.days.length&&ax.days[k+n].slice(0,7)===m)n++;
    mo.push({first,n});k+=n;}
  const t=todayStr();
  /* Three header rows, always rendered; the zoom class on .tl decides which
     show. data-idx on the day cells is how "open on today" is placed when the
     day row itself is hidden. */
  return `<tr class="mrow"><th class="nm"></th>${mo.map(m=>`<th class="mo" colspan="${m.n}">${FRESH_MONTHS[+m.first.slice(5,7)-1]} ${m.first.slice(0,4)}</th>`).join('')}</tr>
  <tr class="wrow"><th class="nm"></th>${wk.map(w=>`<th class="wk" colspan="${w.n}">${pretty(w.first)}</th>`).join('')}</tr>
  <tr class="drow"><th class="nm small muted">${ax.days.length} work days · Mon–Sat</th>${ax.days.map((d,i)=>{const g=parseD(d).getDay();
    return `<th class="dn${g===1?' mon':''}${g===6?' sat':''}${d===t?' today':''}" data-idx="${i}">${parseD(d).getDate()}</th>`;}).join('')}</tr>`;
}
function bandRow(ax,i0,len,inner){
  const pre=i0,post=ax.days.length-i0-len;let s='';
  if(pre>0)s+=`<td class="cell" colspan="${pre}"></td>`;
  s+=`<td colspan="${len}" style="padding:0">${inner}</td>`;
  if(post>0)s+=`<td class="cell" colspan="${post}"></td>`;
  return s;
}
const emptyRow=ax=>`<td class="cell" colspan="${ax.days.length}"></td>`;

/* Fix round 2 (final whole-branch review, finding 4): "Live as of 09:14" read
   identically whether the load was five minutes old or from yesterday morning,
   which defeats the point of the feature -- telling stale apart from fresh.
   Bare time for a load from today; date-and-time otherwise, kept compact. */
const FRESH_MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function freshStamp(iso){
  const d=new Date(iso),now=new Date();
  const time=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const sameDay=d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate();
  return sameDay?time:`${FRESH_MONTHS[d.getMonth()]} ${d.getDate()}, ${time}`;
}

/* ============================== views ============================== */
let TAB='board';
function render(){
  const fz=document.getElementById('freshness');
  // Computed once and shared: the header's "edited here" count and whether
  // Save has anything to push are the same question, divergedSecs summed
  // across every pool that carries a baseline (a local sketch never diverges,
  // since it has no s.base to diverge from -- see divergedSecs above).
  const totalDiverged=S.jobs.reduce((n,j)=>n+divergedSecs(j).length,0);
  const queuedCreates=(S.pendingCreates||[]).filter(c=>!c.requestedAt).length;
  if(fz){
    const st=S.settings||{};
    const edited=S.jobs.filter(j=>j.touchedAt).length;
    fz.innerHTML = st.loadedAt
      ? `Live as of ${freshStamp(st.loadedAt)}`
        + (st.exportedOn?` · export ${st.exportedOn}`:'')
        + (edited?` · <b>${edited} pool${edited===1?'':'s'} edited here since (${totalDiverged} sub-phases)</b>`:'')
        + (queuedCreates?` · <b>${queuedCreates} new pool${queuedCreates===1?'':'s'} queued</b>`:'')
      : 'No schedule loaded yet';
  }
  const saveBtn=document.getElementById('saveBtn');
  // Save has something to push if a loaded pool diverged OR a new pool is
  // queued but not yet pushed -- creates and edits are two different reasons
  // Save can be live, not one combined count (see the Save preview, further
  // below, which lists them as separate labelled sections for the same reason).
  /* Sign-off and ticks are their own kind of change: a PM can spend a morning
     ticking checklists without moving a single date, and Save has to be live
     for that. Only counted in hosted mode, since there is no way to write them
     from a downloaded copy. */
  const pendingSignoffs=graphModeAvailable()?signoffChangeCount(buildSignoffSet()):0;
  const pendingRejections=graphModeAvailable()?rejectionChangeCount(buildRejectionSet()):0;
  if(saveBtn)saveBtn.disabled=(totalDiverged===0&&queuedCreates===0&&pendingSignoffs===0&&pendingRejections===0);
  document.getElementById('main').innerHTML=
    ({board:vBoard,crewboard:vCrewBoard,dispatch:vDispatch,signoff:vSignoff,jobs:vJobs,crews:vCrews,phases:vPhases})[TAB]();
  document.querySelectorAll('input[data-ind]').forEach(el=>el.indeterminate=true);
  positionTimeline();
  save();
}

/* The timeline spans the earliest work across ALL pools to the latest, so on real
   data it opens months behind today -- the board showed June while the office was
   working in September, and the first thing anyone did was scroll. Land it on
   today instead.

   ONCE PER TAB, THEN LEAVE IT ALONE. render() runs on every task tick, every
   drawer save and every sign-off, so re-centring on each one would yank the view
   out from under someone mid-edit, which is worse than the problem it fixes. The
   position is remembered per tab and restored; only a tab never visited, or a
   fresh Refresh (which replaces the schedule anyway), starts at today. */
const ZOOM_PX={day:26,week:10,month:4};
/* A remembered scroll position is in pixels at the OLD cell width, so a zoom
   change forgets it and lands on today at the new width. */
function setZoom(z){S.settings=S.settings||{};S.settings.zoom=ZOOM_PX[z]?z:'day';UI.tlScroll={};save();render();}
function positionTimeline(){
  const tl=document.querySelector('#main .tl');
  if(!tl)return;
  /* Zoom is a cell width, never a second layout: bars keep their exact day
     span and the header rows above them are shown or hidden by class. */
  const z=(S.settings&&ZOOM_PX[S.settings.zoom])?S.settings.zoom:'day';
  tl.classList.remove('zoom-week','zoom-month'); if(z!=='day')tl.classList.add('zoom-'+z);
  tl.style.setProperty('--day',ZOOM_PX[z]+'px');
  /* Both axes. render() rebuilds the board on every sign-off tick, and
     remembering scrollLeft alone put the PM back at the TOP of the board each
     time a box far down it was ticked. */
  tl.addEventListener('scroll',()=>{UI.tlScroll[TAB]={left:tl.scrollLeft,top:tl.scrollTop};},{passive:true});
  const keep=UI.tlScroll[TAB];
  if(keep!=null){tl.scrollLeft=keep.left;tl.scrollTop=keep.top;return;}
  const t=tl.querySelector('th.today');
  if(!t)return;                      // today is outside this schedule: leave it at the start
  // The name column is sticky and overlays the left of the scroll area, so today
  // has to clear it, plus a few days of run-up for context.
  const nm=tl.querySelector('thead .nm');
  const nmW=nm?nm.getBoundingClientRect().width:0;
  const day=ZOOM_PX[z];
  /* At Day zoom the day cell is on screen and its own offset is exact. At Week
     and Month the day row is hidden, so today is placed by its index instead. */
  tl.scrollLeft=Math.max(0,t.getBoundingClientRect().height>0?t.offsetLeft-nmW-day*3:(+t.dataset.idx-3)*day);
  UI.tlScroll[TAB]={left:tl.scrollLeft,top:0};
}
function flagsCard(){

}

function vBoard(){
  const shown=boardJobs(true), ax=axis(shown);

    const [js,je]=jobSpan(j);

      ? bandRow(ax,ax.idx[js],Math.max(1,(ax.idx[je]??ax.idx[js])-ax.idx[js]+1),`<div class="jobbar" style="background:#94a3b8"></div>`)

    let html=`<tr class="jobrow"><td class="nm"><div class="nmflex"><span class="t">${esc(j.name)} <span class="muted small mono">${esc(j.jobno||'')}</span>${jobBadge(j)}</span>
      <span class="dt">${js?pretty(js)+' → '+pretty(je):''}</span><span class="sg"></span></div></td>${jbar}</tr>`;

        <label class="${gp_==='all'?'on':''}" title="Project Manager sign-off for every sub-phase in this phase${sgNote('pm',j.id)}"><input type="checkbox" ${gp_==='all'?'checked':''} ${gp_==='some'?'data-ind="1"':''} ${sgOff(j.id)} onchange="sign('${j.id}',${gi},null,'pm',this.checked)">PM</label></span>`;

      if(col)return;
      g.sections.forEach((s,si)=>{
        const pct=Math.round(secDone(s)*100);
        /* The NAME opens the editor, not the whole cell: the sign-off boxes sit

        const fin=(!s.skip&&s.start&&s.days>0)?workSpan(s.start,s.days).pop():null;

  }).join('');
  const ro=S.jobs.filter(j=>j.readOnly);
  const roCard=ro.length?`<div class="card"><div class="pad"><b>Completed project, read only:</b>

  return roCard+flagsCard()+`<div class="card"><h2>Job Board<span class="sp"></span>

    <span class="muted small" style="text-transform:none">Change crew, days or start on the row; days or start reflows the rest of that project. Click a name or bar for lock, N/A and the checklist</span></h2>

}
/* Edit in place. A sub-phase row carries its own crew, days and start,
   opened with one click on the row (see inlineControls), so a simple change no
   longer needs the drawer. Locked, signed-off, N/A and still-building rows show text: the
   drawer is the only way into those, on purpose. The crew list keeps the
   drawer's Qualified / Not qualified split. */
function inlineEditable(j,s){ return !frozen(j) && !s.skip && !s.locked && !s.inst; }
/* CLOSED UNTIL CLICKED, for speed. A live <select> with its options, a number
   input and a date input on every row cost about a minute to draw on 34 projects
   (1,564 editable rows, 23,503 options), and the Board redraws on every tick.
   So a row shows its crew, days and start as buttons that look like the
   controls; clicking one opens THAT row in place (icOpen) and focuses the
   control clicked, without redrawing the Board. Any redraw closes it again. */
function inlineControls(j,gi,si,s,fin,live){
  if(!live){
    const c=s.crewId?crew(s.crewId):null, a=`this,'${j.id}',${gi},${si}`;
    return `<button type="button" class="ic icv" data-ic="crew" title="Crew for this sub-phase. Click to change." onclick="icOpen(${a},'crew')">${esc(c?c.name:'— Unassigned —')}</button>`
      +`<button type="button" class="ic icv" data-ic="days" title="Days. Click to change; changing it reflows the rest of this project." onclick="icOpen(${a},'days')">${s.days}</button>`
      +`<button type="button" class="ic icv" data-ic="start" title="Start. Click to change; changing it reflows the rest of this project." onclick="icOpen(${a},'start')">${pretty(s.start)}</button>`
      +`<span class="fin" title="Finish, from the start and the days">→ ${s.start?pretty(fin):'—'}</span>`;
  }
  const cands=s.skill?qualified(s.skill):[],other=S.crews.filter(c=>!cands.includes(c));
  const opt=c=>`<option value="${c.id}"${s.crewId===c.id?' selected':''}>${esc(c.name)}</option>`;
  return `<select class="ic" data-ic="crew" title="Crew for this sub-phase" onchange="inlineSet('${j.id}',${gi},${si},'crew',this.value)">
      <option value="">— Unassigned —</option>
      ${cands.length?`<optgroup label="Qualified">${cands.map(opt).join('')}</optgroup>`:''}
      ${other.length?`<optgroup label="⚠ Not qualified">${other.map(opt).join('')}</optgroup>`:''}</select>`
    +`<input class="ic" type="number" min="1" data-ic="days" title="Days. Changing it reflows the rest of this project." value="${s.days}" onchange="inlineSet('${j.id}',${gi},${si},'days',this.value)">`
    +`<input class="ic" type="date" data-ic="start" title="Start. Changing it reflows the rest of this project." value="${s.start||''}" onchange="inlineSet('${j.id}',${gi},${si},'start',this.value)">`
    +`<span class="fin" title="Finish, from the start and the days">→ ${s.start?pretty(fin):'—'}</span>`;
}
function icOpen(el,jobId,gi,si,k){
  const j=S.jobs.find(x=>x.id===jobId), s=j&&j.groups[gi]&&j.groups[gi].sections[si];
  const box=el.closest('.ic-row');
  if(!s||!box||!inlineEditable(j,s)){render();return;}
  const fin=(s.start&&s.days>0)?workSpan(s.start,s.days).pop():null;
  box.innerHTML=inlineControls(j,gi,si,s,fin,true);
  const c=box.querySelector(`[data-ic="${k}"]`); if(!c)return;
  c.focus();

  // activation, and not every browser has it, so it is best effort.
  if(k!=='days'&&typeof c.showPicker==='function'){try{c.showPicker();}catch(e){}}
  else if(k==='days'&&c.select)c.select();
}
/* A days or start change reflows THIS project from THIS row, the same walk as
   the drawer's Save + reflow: locked and signed-off rows stay, N/A rows are
   skipped, crews are untouched. Leaving the rows below where they were would
   put the board out of step with itself. A crew change moves nothing. */
function inlineSet(jobId,gi,si,k,v){
  const j=S.jobs.find(x=>x.id===jobId); if(!j)return;
  const s=j.groups[gi]&&j.groups[gi].sections[si];
  if(!s||!inlineEditable(j,s)){render();return;}
  if(k==='crew'){ s.crewId=v||null; touch(j); save(); render(); return; }
  if(k==='days') s.days=Math.max(1,+v||1);
  else if(k==='start') s.start=v?nextWork(v):null;
  else return;
  touch(j);
  if(s.start)reflowFrom(jobId,gi,si);
  save(); render();
}
/* The crews on a phase, for its FOLDED line only. "Collapse all" is how a PM
   gets one line per phase, and it used to hide who is on the work, which was
   the point of looking ("I don't see the crews assigned"). Expanded rows show
   each sub-phase's crew already, so the summary would only repeat them. The
   name column clips with an ellipsis, so the full list is also the tooltip. */
function phaseCrews(g){
  const names=[...new Set(g.sections.filter(s=>!s.skip&&s.crewId)
    .map(s=>{const c=crew(s.crewId);return c?c.name:s.crewId;}))];
  if(!names.length)return '';
  const list=names.map(esc).join(', ');
  return `<span class="phcrews" title="${list}">· ${list}</span>`;
}

  return `<div class="card"><h2>Crew Board — who is where<span class="sp"></span>${boardControls(false)}</h2>

  <div class="card"><h2>Crew Load (scheduled days)</h2><table><tbody>
    ${S.crews.map(c=>`<tr><td style="width:160px">${esc(c.name)}</td>

    <div class="hint">Auto-Schedule gives each sub-phase to the qualified crew with the lightest load that is free for the whole span.</div></div>`;
}

let DDATE=null;
function vDispatch(){
  if(!DDATE)DDATE=nextWork(todayStr());
  const rows=S.crews.map(c=>{
    const hits=[];
    S.jobs.forEach(j=>allSecs(j).forEach(({s,gi,si})=>{
      if(s.skip||s.crewId!==c.id||!s.start)return;
      if(workSpan(s.start,s.days).includes(DDATE))hits.push({j,s,gi,si});}));
    const cell=hits.length?hits.map(h=>{
      const pct=Math.round(secDone(h.s)*100);
      return `<b>${h.j.name}</b> <span class="mono small muted">${esc(h.j.jobno||'')}</span><br><span class="muted small">${esc(fullAddr(h.j))}</span><br>
      <span class="chip" style="background:${crewColor(c.id)};color:#fff">${h.s.num} ${h.s.name}</span>
      <span class="small muted">day ${workSpan(h.s.start,h.s.days).indexOf(DDATE)+1} of ${h.s.days} · checklist ${pct}%</span>
      ${sgHTML(h.j.id,h.gi,h.si,h.s)}`;}).join('<hr style="border:0;border-top:1px solid #eee;margin:6px 0">')
      :`<span class="muted">— Available —</span>`;
    return `<tr><td style="width:170px"><b>${esc(c.name)}</b><div class="muted small">${c.members.length?c.members.join(', '):'members not specified'}${c.note?' · ⚠ '+esc(c.note):''}</div></td>
      <td>${cell}${hits.length>1?(c.unlimited?` <span class="chip sub">${hits.length} jobs</span>`:' <span class="chip" style="background:#fee2e2;color:#991b1b">DOUBLE-BOOKED</span>'):''}</td></tr>`;
  }).join('');
  const subs=[];
  S.jobs.forEach(j=>allSecs(j).forEach(({s})=>{if(!s.skip&&!s.crewId&&s.start&&workSpan(s.start,s.days).includes(DDATE))subs.push(`${esc(j.name)} — ${esc(s.num)} ${esc(s.name)}`);}));
  return `<div class="card"><h2>Daily Dispatch<span class="sp"></span>
      <button class="btn sm" onclick="shiftDay(-1)">◀</button>
      <input type="date" value="${DDATE}" onchange="DDATE=nextWork(this.value);render()">
      <button class="btn sm" onclick="shiftDay(1)">▶</button></h2>
    <div class="pad"><b style="font-size:16px">${dow(DDATE)}, ${pretty(DDATE)}</b>${dow(DDATE)==='Sat'?' <span class="chip sub">Saturday</span>':''}</div>
    <table><thead><tr><th>Crew</th><th>Assignment</th></tr></thead><tbody>${rows}</tbody></table>
    ${subs.length?`<div class="pad small"><b>Office / subcontractor work today:</b> ${subs.join(' · ')}</div>`:''}</div>`;
}
function shiftDay(n){let d=DDATE;do{d=addCal(d,n);}while(!isWork(parseD(d)));DDATE=d;render();}

function vSignoff(){
  /* One job at a time, asked for at the 2026-09-17 session: with every pool on
     one page a PM scrolls past everyone else's to reach theirs. A picked job
     that is no longer here (removed, or gone after a Refresh) shows all. */
  const pick=UI.signoffJob&&S.jobs.some(j=>j.id===UI.signoffJob)?UI.signoffJob:'';
  const list=pick?S.jobs.filter(j=>j.id===pick):S.jobs;
  const bar=S.jobs.length>1?`<div class="card"><div class="pad" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label for="soJob" class="small"><b>Show</b></label>
      <select id="soJob" onchange="UI.signoffJob=this.value;render()">
        <option value="">All jobs (${S.jobs.length})</option>
        ${S.jobs.slice().sort(cmpJobNo).map(j=>`<option value="${esc(j.id)}"${j.id===pick?' selected':''}>${esc(j.jobno||'')} · ${esc(j.name)}</option>`).join('')}
      </select></div></div>`:'';
  /* Every unresolved rejection, so nothing stalls unnoticed. Follows the job
     picker above. An entry whose installer has signed again is called out,
     because that is the one a PM can act on now. */
  const rej=[];
  list.forEach(j=>allSecs(j).forEach(({s,gi,si})=>{
    if(!s.rejected)return;
    const last=(s.thread||[]).filter(e=>e.kind==='Rejected').slice(-1)[0];
    rej.push({j,gi,si,s,by:last?last.by:'',at:s.rejectedOn||(last?last.at:null)});
  }));
  const card=rej.length?`<div class="card"><h2>Open rejections <span class="chip rej">${rej.length}</span></h2>
    <table><thead><tr><th style="width:90px">Job</th><th style="width:60px">#</th><th>Sub-phase</th>
      <th style="width:190px">Rejected</th><th>Reason</th><th style="width:190px"></th></tr></thead><tbody>
    ${rej.map(r=>`<tr><td class="small mono">${esc(r.j.jobno||'')}</td>
      <td class="small muted">${esc(r.s.num)}</td>
      <td><a href="#" onclick="editSec('${esc(r.j.id)}',${r.gi},${r.si});return false">${esc(r.s.name)}</a></td>
      <td class="small muted">${esc(cmtWhen(r.at))}${r.by?' · '+esc(r.by):''}</td>
      <td class="small">${esc(r.s.rejectedReason||'')}</td>
      <td class="small">${r.s.inst?'<b>Signed again, ready to review</b>':''}</td></tr>`).join('')}
    </tbody></table></div>`:'';
  return bar+card+list.map(j=>{
    const secs=allSecs(j).filter(x=>!x.s.skip);
    const i=secs.filter(x=>x.s.inst).length,p=secs.filter(x=>x.s.pm).length;
    const tot=secs.reduce((a,x)=>a+x.s.tasks.length,0),
          dn=secs.reduce((a,x)=>a+secCounts(x.s).done,0),
          na=secs.reduce((a,x)=>a+secCounts(x.s).na,0);
    return `<div class="card"><h2>${esc(j.name)} <span class="muted mono" style="text-transform:none">${esc(j.jobno||'')}</span>${jobBadge(j)}<span class="sp"></span>
      <span class="small" style="text-transform:none">Installer ${i}/${secs.length} · PM ${p}/${secs.length} · checklist ${dn}/${tot}${na?` · ${na} N/A`:''}</span></h2>
      <div class="pad" style="padding-bottom:0"><div class="tw2"><i style="width:${tot?(dn+na)/tot*100:0}%"></i></div></div>
      <table><thead><tr><th style="width:70px">#</th><th>Sub-phase</th><th style="width:130px">Crew</th><th style="width:150px">Dates</th>
        <th style="width:110px">Checklist</th><th style="width:130px">Sign-off</th></tr></thead><tbody>
      ${j.groups.map((g,gi)=>{
        const gi_=grpSign(g,'inst'),gp_=grpSign(g,'pm');
        return `<tr class="phrow"><td><b>${g.num}.0</b></td><td colspan="4"><b>${g.name}</b></td>
          <td><span class="sg">
            <label class="${gi_==='all'?'on':''}" title="Installer sign-off for every sub-phase in this phase${sgNote('inst',j.id)}"><input type="checkbox" ${gi_==='all'?'checked':''} ${gi_==='some'?'data-ind="1"':''} ${sgOff(j.id)} onchange="sign('${j.id}',${gi},null,'inst',this.checked)">INST</label>
            <label class="${gp_==='all'?'on':''}" title="Project Manager sign-off for every sub-phase in this phase${sgNote('pm',j.id)}"><input type="checkbox" ${gp_==='all'?'checked':''} ${gp_==='some'?'data-ind="1"':''} ${sgOff(j.id)} onchange="sign('${j.id}',${gi},null,'pm',this.checked)">PM</label></span></td></tr>`+
        g.sections.map((s,si)=>{
          const c=s.crewId?crew(s.crewId):null,pct=Math.round(secDone(s)*100);
          const e=s.start?workSpan(s.start,s.days).pop():null;
          return `<tr${s.skip?' class="skip"':''}><td class="small muted">${s.num}</td>
            <td><a href="#" onclick="editSec('${j.id}',${gi},${si});return false">${s.name}</a></td>
            <td class="small">${c?`<span class="chip" style="background:${crewColor(c.id)};color:#fff">${esc(c.name)}</span>`:'<span class="chip sub">none</span>'}</td>
            <td class="small muted">${pretty(s.start)} → ${pretty(e)}</td>
            <td class="small"><span class="tw" style="width:50px"><i style="width:${pct}%"></i></span> ${pct}%</td>
            <td>${sgHTML(j.id,gi,si,s)}</td></tr>`;}).join('');
      }).join('')}</tbody></table></div>`;
  }).join('')||'<div class="card pad muted">No jobs.</div>';
}

/* Pending pool requests -- queued here via +Job, not yet built as sub-phases
   anywhere. Surfaced on the Jobs tab so a PM can see both what they have
   raised but not yet pushed (Save still to come) and what they have pushed
   but not yet received back (waiting on D2 - New Pool, measured at 16m 33s with a
   six-minute stall mid-run, so the copy says 10-20). A create clears itself the
   moment the real pool comes back
   through Refresh -- see importFromD2. */
function vJobs(){
  const pend=S.pendingCreates||[];
  const pendingCard=pend.length?`<div class="card"><h2>Pending Pool Requests<span class="sp"></span>
      <span class="muted small" style="text-transform:none">Queued here — pushed to SharePoint by Save</span></h2>

    ${pend.map(c=>`<tr>
      <td class="mono small">${esc(c.jobno)}</td>
      <td>${esc(c.name)}</td>
      <td class="small">${c.pmName?esc(c.pmName):'<span class="muted">You</span>'}</td>
      <td class="small muted">${esc([c.addr,c.city].filter(Boolean).join(', '))}</td>

      <td class="small muted">${c.assignDefaultCrews?'Assign':'Unassigned'}</td>
      <td class="small">${c.requestedAt
        ?`Requested ${freshStamp(c.requestedAt)} — allow 10–20 min, then Refresh`
        :'<span class="chip jb local">Draft — not saved</span> — press Save'}</td>
      <td style="text-align:right">${c.requestedAt?'':`<button class="btn sm d" onclick="cancelPendingCreate('${c.id}')">Remove</button>`}</td>
      </tr>`).join('')}
    </tbody></table></div>`:'';
  /* Filter by project manager, by NAME: the REST export carries the name and no
     id, so the name is the one key both import paths share. A filter naming a
     PM who no longer has a job here is ignored rather than showing nothing. */
  const pms=[...new Set(S.jobs.map(j=>j.pm).filter(Boolean))].sort();
  const pmOn=UI.pmFilter&&pms.includes(UI.pmFilter)?UI.pmFilter:'';
  const shown=orderJobs(pmOn?S.jobs.filter(j=>j.pm===pmOn):S.jobs);
  /* Projects ready to complete, named here so nobody has to hunt for the chip. */
  const ready=graphModeAvailable()?S.jobs.filter(readyToComplete).sort(cmpJobNo):[];
  const readyBanner=ready.length?`<div class="card" data-ready-banner><div class="pad" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span><b>${ready.length} project${ready.length===1?' is':'s are'} ready to complete: ${ready.map(j=>esc(j.jobno)).join(', ')}.</b>
      Every sub-phase is signed off or not applicable. Use Mark complete on its row.</span></div></div>`:'';
  /* Completed projects stay in SharePoint and are listed here from their Jobs rows alone:
     their sub-phases are not read on Refresh. Newest first. */
  const done=S.completedJobs||[];
  const completedCard=done.length?`<details class="card" data-completed><summary style="padding:12px 16px;cursor:pointer"><b>Completed projects (${done.length})</b>
      <span class="muted small">finished and out of the planner; reopen one to bring it back</span></summary>
    <table><thead><tr><th style="width:92px">Job ID</th><th>Name</th><th style="width:150px">Project manager</th><th style="width:120px">Completed</th><th></th></tr></thead><tbody>
    ${done.map(c=>`<tr data-completed-row="${esc(c.jobno)}">
      <td class="mono small">${esc(c.jobno)}</td><td>${esc(c.name)}</td>
      <td class="small">${c.pm?esc(c.pm):'<span class="muted">—</span>'}</td>
      <td class="small muted">${c.completedOn?pretty(String(c.completedOn).slice(0,10)):''}</td>
      <td style="text-align:right">${graphModeAvailable()
        ?`<button class="btn sm" data-jobno="${esc(c.jobno)}" onclick="openCompleted(this.dataset.jobno)" title="Show it on the Job Board, read only, until the next Refresh.">Open</button>
          <button class="btn sm" data-jobno="${esc(c.jobno)}" onclick="reopenProject(this.dataset.jobno)">Reopen</button>`:''}</td>
      </tr>`).join('')}
    </tbody></table></details>`:'';
  return pendingCard+readyBanner+`<div class="card"><h2>Jobs<span class="sp"></span>
    ${S.jobs.length>1?jobSortControl():''}
    ${pms.length?`<select id="pmFilter" onchange="setPmFilter(this.value)" style="text-transform:none;font-weight:400">
      <option value="">All project managers</option>
      ${pms.map(n=>`<option value="${esc(n)}"${n===pmOn?' selected':''}>${esc(n)}</option>`).join('')}</select>`:''}
    <button class="btn sm p" onclick="addJob()">+ New Job</button></h2>
  ${pmOn?`<div class="hint" style="padding-top:8px">Showing ${shown.length} job${shown.length===1?'':'s'} for

  <table><thead><tr><th style="width:92px">Job ID</th><th>Job Name</th><th style="width:150px">Project manager</th><th>Street Address</th>

  ${shown.map(j=>{const [a,b]=jobSpan(j);return `<tr>
    <td><input value="${esc(j.jobno||'')}" onchange="setJob('${j.id}','jobno',this.value)" style="width:82px;font-family:ui-monospace,Menlo,monospace"></td>

    <td class="small">${j.pm
      ? `<button class="pmlink" data-pm="${esc(j.pm)}" onclick="setPmFilter(this.dataset.pm)" title="Show only ${esc(j.pm)}'s jobs">${esc(j.pm)}</button>`
      : '<span class="muted">—</span>'}</td>
    <td><input value="${esc(j.addr)}" onchange="setJob('${j.id}','addr',this.value)" style="width:170px" placeholder="Street"></td>
    <td><input value="${esc(j.city)}" onchange="setJob('${j.id}','city',this.value)" style="width:110px" placeholder="City"></td>

      ? `<input type="date" data-reset value="${a}" title="Change the start and reflow the whole project from it. Nothing is written until Save." onchange="resetStart('${j.id}',this.value)">`

    <td class="small muted">${b?pretty(b):''}</td>
    <td class="small">${allSecs(j).filter(x=>!x.s.skip).length} active ${jobBadge(j)}
      <a href="#" class="small" data-open-schedule onclick="openSchedule('${j.id}');return false" title="Open the Job Board showing only this project">Open schedule</a></td>
    <td class="small">${j.building
      ? '<span class="muted" title="Still being built in SharePoint">Building…</span>'

      : j.status==='Active'&&graphModeAvailable()
      ? `<span class="muted">Active</span> <button class="btn sm" onclick="planPool('${j.id}')" title="Move this project back to Planned: out of the dispatch, the summaries and the alerts until it is activated again.">Back to planning</button>${readyToComplete(j)
        ? ` <button class="btn sm p" onclick="completeProject('${j.id}')" title="Every sub-phase is signed off or not applicable.">Mark complete</button>`:''}`
      : `<span class="muted">${esc(j.status||'Active')}</span>`}</td>
    <td style="text-align:right">${poolHasBaseline(j)
      ? `<button class="btn sm" onclick="delJob('${j.id}')" title="Removes this pool from this screen only. It stays in SharePoint and comes back on the next Refresh.">Remove</button>`
      : `<button class="btn sm d" onclick="delJob('${j.id}')" title="This pool has never been saved to SharePoint. Deleting it here cannot be undone.">Delete</button>`}</td></tr>`;}).join('')}
  </tbody></table>
  <div class="hint">New jobs are built from the template stored in SharePoint. Mark a sub-phase "not applicable" in its editor to skip it on one pool.</div></div>`+completedCard;
}

function cmtWhen(iso){
  if(!iso)return '';
  try{const p={};new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',
    month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
    .formatToParts(new Date(iso)).forEach(x=>p[x.type]=x.value);
    return p.month+'/'+p.day+'/'+String(p.year).slice(2)+' '+p.hour+':'+p.minute;
  }catch(e){return String(iso).slice(0,16).replace('T',' ')+' UTC';}
}
function queueEntry(kind,body){
  const j=S.jobs.find(x=>x.id===CUR.jobId),s=cur();
  if(!s.base||s.base.id==null||!commentsWritable(j))return;
  S.pendingComments=S.pendingComments||[];
  S.pendingComments.push({localId:'c'+Math.random().toString(36).slice(2,9),
    jobno:j.jobno,num:s.num,secId:String(s.base.id),kind,body,at:new Date().toISOString()});
  save();editSec(CUR.jobId,CUR.gi,CUR.si);render();
}
function commentBox(){const el=document.getElementById('fComment');return el?String(el.value||'').trim():'';}
function queueComment(){

function queueReject(){
  const b=commentBox();
  if(!b){alert('A reason is required to reject a sign-off. Say what is missing.');return;}
  /* Un-tick Installer on screen straight away so the checklist unlocks for the
     fix. Nothing is written until Save, and the queued reject is what carries
     the sign-off change, not this flag: see buildSignoffSet. */
  cur().inst=false;

function queueResolve(){ queueEntry('resolve',commentBox()); }
function unqueueEntry(localId){
  /* Removing a queued reject puts Installer back as SharePoint holds it.
     Otherwise the on-screen un-tick left behind would go out at Save as a
     plain reopen, which is not what anyone asked for. */
  const gone=(S.pendingComments||[]).find(e=>e.localId===localId);
  if(gone&&gone.kind==='reject'){
    const j=S.jobs.find(x=>String(x.jobno)===String(gone.jobno));
    const hit=j&&allSecs(j).find(({s})=>s.base&&String(s.base.id)===String(gone.secId));
    if(hit&&hit.s.base.inst)hit.s.inst=true;
  }
  S.pendingComments=(S.pendingComments||[]).filter(e=>e.localId!==localId);
  save();if(CUR)editSec(CUR.jobId,CUR.gi,CUR.si);render();
}
/* Sign-off locks the checklist. The controls render disabled; these guards
   stop anything that reaches the handlers anyway. */
function checklistLocked(){ if(cur().inst){ editSec(CUR.jobId,CUR.gi,CUR.si); return true; } return false; }
function tick(ti,v){if(checklistLocked())return;const t=cur().tasks[ti];t.done=v;if(v){t.na=false;t.note='';}touch(S.jobs.find(x=>x.id===CUR.jobId));save();}
/* N/A asks why, and a blank answer changes nothing. The reason is Don's rule and
   the field app's: N/A is the honest alternative to a false tick only while it
   has to say why, or marking everything N/A becomes a way round the sign-off. */
function toggleNA(ti){
  if(checklistLocked())return;
  const t=cur().tasks[ti];
  if(!t.na){
    const why=prompt('Why is "'+t.t+'" not applicable on this pool?'+String.fromCharCode(10,10)
      +'A reason is required. It is saved with the task.','');
    if(why===null)return;
    if(!why.trim()){alert('Nothing was changed. A task can only be marked N/A with a reason.');return;}
    t.na=true;t.done=false;t.note=why.trim();
  }else{
    t.na=false;t.note='';
  }
  touch(S.jobs.find(x=>x.id===CUR.jobId));save();editSec(CUR.jobId,CUR.gi,CUR.si);

function allTasks(v){if(checklistLocked())return;cur().tasks.forEach(t=>{if(!t.na)t.done=v;});touch(S.jobs.find(x=>x.id===CUR.jobId));save();editSec(CUR.jobId,CUR.gi,CUR.si);}

function saveSec(reflow){
